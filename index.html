<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio Tracker</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield}
body{background:#0f172a;color:#f1f5f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;min-height:100vh}
button{cursor:pointer;font-family:inherit;transition:background .15s,border-color .15s,color .15s,opacity .15s}
input,select{font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums;background:#1e293b;border:1px solid #334155;border-radius:6px;padding:5px 8px;font-size:12px;color:#f1f5f9;width:100%;transition:border-color .15s}
input:focus,select:focus{outline:2px solid #3b82f6;outline-offset:-1px;border-color:transparent}

/* Smooth content fade on tab change */
@keyframes contentIn{from{opacity:0}to{opacity:1}}
.content{animation:contentIn .18s ease-out}

/* Modal entrance */
@keyframes modalIn{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.guide-modal.open{animation:overlayIn .15s ease-out}
.guide-modal.open>div{animation:modalIn .18s ease-out}
#traspasoOverlay>div{animation:modalIn .18s ease-out}

.app{max-width:940px;margin:0 auto}

/* Header & nav */
.header{background:#1e293b;border-bottom:1px solid #334155;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.header button{white-space:nowrap}
.hdr-btn{background:#1e293b;border:1px solid #334155;border-radius:6px;color:#94a3b8;font-size:11px;font-weight:600;padding:5px 10px;cursor:pointer;transition:all .15s;position:relative;z-index:1}
.hdr-btn:hover{border-color:#60a5fa;color:#60a5fa}
.hdr-btn.danger{border-color:#7f1d1d;color:#f87171}
.hdr-btn.danger:hover{background:#7f1d1d;color:#fca5a5;border-color:#7f1d1d}
.exp-item{width:100%;text-align:left;background:none;border:none;color:#94a3b8;font-size:11px;font-weight:600;padding:6px 10px;cursor:pointer;border-radius:5px;display:block}
.exp-item:hover{background:#334155;color:#f1f5f9}
.tabs{background:#1e293b;border-bottom:1px solid #334155;padding:0 20px;display:flex;position:sticky;top:57px;z-index:19}
.tab{padding:10px 16px;font-size:13px;font-weight:500;border:none;border-bottom:2px solid transparent;background:none;color:#94a3b8;transition:color .15s,border-color .15s}
.tab.on{border-bottom-color:#3b82f6;color:#60a5fa}
.tab:hover:not(.on){color:#e2e8f0}

/* Content */
.content{padding:20px}

/* Grids */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.g2s{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

/* Cards */
.card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.25),0 4px 12px rgba(0,0,0,.12)}
.card:last-child{margin-bottom:0}
.card-ttl{font-size:11px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}

/* Stat cards */
.stat{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px}
.stat-lbl{font-size:11px;color:#64748b;margin-bottom:6px}
.stat-val{font-size:21px;font-weight:700;font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums}
.stat-sub{font-size:13px;font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums;margin-top:2px}

/* Colors */
.g{color:#34d399}.r{color:#f87171}.m{color:#94a3b8}.d{color:#64748b}.b{color:#60a5fa}
.bg-g{background:#064e3b}.bg-r{background:#450a0a}

/* Badges */
.badge{display:inline-block;padding:3px 10px;border-radius:5px;font-size:12px;font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums;font-weight:600}
.b-pos{background:#064e3b;color:#34d399}.b-neg{background:#450a0a;color:#f87171}
.b-buy{background:#1e3a5f;color:#60a5fa;font-size:11px;padding:2px 7px;border-radius:4px}
.b-sell{background:#431407;color:#fb923c;font-size:11px;padding:2px 7px;border-radius:4px}

/* Position list */
.pos-card{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:16px;margin-bottom:12px}
.pos-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.pos-name{font-weight:600;border:none;background:none;color:#f1f5f9;text-align:left;font-size:14px;padding:0;transition:color .15s}
.pos-name:hover{color:#60a5fa}
.pos-meta{font-size:11px;color:#64748b;margin-top:3px}
.pos-ft{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.mini label{display:block;font-size:11px;color:#64748b;margin-bottom:3px}
.mini span{font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums;font-size:13px;color:#e2e8f0}

/* Inline price edit */
.p-btn{font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums;font-size:13px;color:#e2e8f0;background:none;border:none;padding:0;transition:color .15s}
.p-btn:hover{color:#60a5fa}
.p-inp{width:76px!important;padding:2px 6px!important;font-size:12px!important}
.ok-btn{background:#065f46;color:#34d399;border:none;border-radius:4px;padding:2px 8px;font-size:11px;margin-left:4px;white-space:nowrap}
.x-btn{background:none;border:none;color:#64748b;font-size:13px;margin-left:2px;padding:0 2px}

/* Tables */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;color:#64748b;font-weight:500;border-bottom:1px solid #334155;white-space:nowrap}
th.R{text-align:right}
td{padding:8px 10px;border-bottom:1px solid #1e293b;color:#e2e8f0}
td.R{text-align:right;font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:none}
tbody tr:hover td{background:#0f172a}

/* Perf grid */
.perf-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.perf-item{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background .15s}
.perf-item:hover{background:#1e293b}

/* Form */
.fg-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.fg label{display:block;font-size:11px;color:#94a3b8;margin-bottom:3px}
.btns{display:flex;gap:8px}
.btn{padding:6px 14px;border-radius:6px;font-size:12px;border:none;font-family:inherit;transition:opacity .15s}
.btn-bl{background:#1d4ed8;color:#fff}.btn-bl:hover{background:#1e40af}
.btn-gr{background:#065f46;color:#34d399}.btn-gr:hover{background:#047857}
.btn-gy{background:#334155;color:#e2e8f0}.btn-gy:hover{background:#475569}
.btn-red{background:#7f1d1d;color:#f87171;font-size:11px;padding:4px 10px}.btn-red:hover{background:#991b1b}

/* Detail */
.det-hd{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.pl-box{padding:12px 16px;border-radius:8px;text-align:right}
.pl-val{font-size:22px;font-weight:700;font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums}
.pl-pct{font-size:13px;font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums;margin-top:2px}

/* Legend */
.leg{display:flex;align-items:center;justify-content:space-between;font-size:11px;margin-bottom:5px}
.leg-l{display:flex;align-items:center;gap:6px;color:#cbd5e1}
.dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;display:inline-block}

/* Summary rows */
.sum{display:flex;justify-content:space-between;align-items:center;font-size:12px;padding:3px 0}
.sum-v{display:flex;gap:14px;font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums}
.sub-card{background:#0f172a;border-radius:8px;padding:12px}
.sub-lbl{font-size:11px;color:#94a3b8;margin-bottom:5px}
.sub-val{font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums;font-size:15px}
.sub-inv{font-size:11px;color:#64748b;margin-top:3px}

hr{border:none;border-top:1px solid #334155;margin:8px 0}
.back-btn{background:none;border:none;color:#94a3b8;font-size:13px;margin-bottom:16px;padding:0;display:flex;align-items:center;gap:4px;transition:color .15s}
.back-btn:hover{color:#f1f5f9}
.link{background:none;border:none;color:#60a5fa;font-size:11px;padding:0;transition:color .15s}
.link:hover{color:#93c5fd}
.mn{font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums}

/* Notification */
.notif{position:fixed;bottom:20px;right:20px;background:#065f46;color:#34d399;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:500;z-index:99;opacity:0;transition:opacity .3s;pointer-events:none}
.notif.show{opacity:1}

/* Notes */
.notes-area{width:100%;background:#0f172a;border:1px solid #334155;border-radius:6px;padding:10px;font-size:13px;color:#e2e8f0;resize:vertical;min-height:72px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.5;transition:border-color .15s}
.notes-area:focus{outline:none;border-color:#3b82f6}

/* Mobile */
@media(max-width:640px){
  .app{max-width:100%}
  .header{padding:10px 14px;flex-wrap:wrap;gap:8px}
  .tabs{padding:0 10px;overflow-x:auto;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{padding:8px 10px;font-size:12px;white-space:nowrap}
  .content{padding:12px}
  .g2{grid-template-columns:1fr!important}
  .g3{grid-template-columns:1fr 1fr!important}
  .g4{grid-template-columns:1fr 1fr!important}
  .g2s{grid-template-columns:1fr!important}
  .perf-grid{grid-template-columns:1fr!important}
  .fg-grid{grid-template-columns:1fr 1fr!important}
  .det-hd{flex-direction:column;gap:10px}
  .pl-box{align-self:flex-start}
  .sum-v{gap:8px;font-size:11px}
  /* tx table: hide running totals columns on mobile, show card-style */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tbl-wrap table{min-width:600px}
  /* Mobile tx cards */
  .tx-mobile{display:block}
  .tx-desktop{display:none}
  .pos-card .g4{grid-template-columns:1fr 1fr!important}
  /* Header buttons stack */
  .hdr-btns{flex-wrap:wrap!important;justify-content:flex-end}
  /* Currency grid */
  .ccy-grid{grid-template-columns:1fr 1fr!important}
}
@media(min-width:641px){
  .tx-mobile{display:none}
  .tx-desktop{display:block}
  .ccy-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
}
/* Guide modal */
.guide-modal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);overflow-y:auto}
.guide-modal.open{display:block}
/* Settings modal */
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #1e293b}
.settings-row:last-child{border-bottom:none}
.settings-label{font-size:13px;color:#cbd5e1;font-family:-apple-system,sans-serif}
.settings-sublabel{font-size:11px;color:#64748b;margin-top:2px;font-family:-apple-system,sans-serif}
.settings-section{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:#475569;font-weight:600;font-family:-apple-system,sans-serif;margin:16px 0 6px;padding-bottom:4px;border-bottom:1px solid #334155}
.guide-inner{max-width:760px;margin:32px auto;background:#0f172a;border:1px solid #334155;border-radius:14px;padding:40px 44px 56px;position:relative}
.guide-close{position:sticky;top:0;float:right;background:#1e293b;border:1px solid #334155;border-radius:6px;color:#94a3b8;font-size:13px;font-weight:600;padding:5px 12px;cursor:pointer;margin-bottom:16px;transition:all .15s;z-index:10}
.guide-close:hover{border-color:#f87171;color:#f87171}
.gd-h1{font-size:1.8rem;font-weight:700;font-family:-apple-system,sans-serif;color:#f1f5f9;margin-bottom:6px}
.gd-sub{color:#64748b;font-size:14px;font-family:-apple-system,sans-serif;margin-bottom:28px}
.gd-toc{background:#1e293b;border:1px solid #334155;border-radius:10px;padding:18px 22px;margin-bottom:36px;font-family:-apple-system,sans-serif}
.gd-toc-title{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#64748b;font-weight:600;margin-bottom:10px}
.gd-toc ol{padding-left:18px;margin:0}.gd-toc li{margin-bottom:4px;font-size:13px}.gd-toc a{color:#94a3b8;text-decoration:none}.gd-toc a:hover{color:#60a5fa}
.gd-sec{margin-bottom:40px}
.gd-sec-hd{display:flex;align-items:center;gap:10px;margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid #334155}
.gd-h2{font-size:1.2rem;font-weight:700;font-family:-apple-system,sans-serif;color:#f1f5f9}
.gd-badge{display:inline-flex;align-items:center;background:#1e293b;border:1px solid #334155;border-radius:5px;padding:2px 10px;font-size:12px;font-family:-apple-system,sans-serif;font-weight:600;color:#94a3b8;white-space:nowrap}
.gd-badge.bl{border-color:#3b82f6;color:#60a5fa}.gd-badge.gr{border-color:#10b981;color:#34d399}
.gd-badge.am{border-color:#f59e0b;color:#fbbf24}.gd-badge.pu{border-color:#8b5cf6;color:#a78bfa}
.gd-badge.cy{border-color:#06b6d4;color:#22d3ee}.gd-badge.re{border-color:#ef4444;color:#f87171}
.gd-h3{font-size:.95rem;font-weight:600;font-family:-apple-system,sans-serif;color:#f1f5f9;margin:18px 0 5px}
.gd-h4{font-size:11px;text-transform:uppercase;letter-spacing:.5px;font-family:-apple-system,sans-serif;color:#64748b;font-weight:600;margin:14px 0 4px}
.gd-p{font-size:14px;color:#cbd5e1;line-height:1.7;margin-bottom:11px;font-family:-apple-system,sans-serif}
.gd-ul,.gd-ol{padding-left:20px;margin-bottom:11px}
.gd-li{font-size:14px;color:#cbd5e1;margin-bottom:4px;font-family:-apple-system,sans-serif;line-height:1.6}
.gd-b{color:#f1f5f9;font-weight:600}
.gd-code{background:#1e293b;border:1px solid #334155;border-radius:4px;padding:1px 6px;font-size:12px;font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums;color:#22d3ee}
.gd-callout{border-radius:8px;padding:11px 15px;margin:11px 0;border-left:3px solid;font-family:-apple-system,sans-serif;font-size:13px}
.gd-callout.tip{background:#0a1f1a;border-color:#34d399}.gd-callout.warn{background:#1c1407;border-color:#fbbf24}.gd-callout.info{background:#0f1f3a;border-color:#60a5fa}
.gd-clbl{font-size:11px;font-weight:700;text-transform:uppercase;margin-bottom:3px}
.gd-callout.tip .gd-clbl{color:#34d399}.gd-callout.warn .gd-clbl{color:#fbbf24}.gd-callout.info .gd-clbl{color:#60a5fa}
.gd-callout .gd-p{margin:0;color:#94a3b8}
.gd-table{width:100%;border-collapse:collapse;margin:11px 0;font-family:-apple-system,sans-serif;font-size:13px}
.gd-table th{text-align:left;padding:6px 10px;background:#1e293b;border-bottom:1px solid #334155;color:#64748b;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.gd-table td{padding:7px 10px;border-bottom:1px solid #1e293b;color:#cbd5e1;vertical-align:top}
.gd-table tr:last-child td{border-bottom:none}.gd-table td:first-child{color:#60a5fa;font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums}
.gd-hr{border:none;border-top:1px solid #334155;margin:28px 0}
@media(max-width:640px){.guide-inner{margin:0;border-radius:0;padding:20px 16px 40px}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="notif" id="notif"></div>
<div class="guide-modal" id="guideModal" onclick="if(event.target===this)closeGuide()">
  <div class="guide-inner" id="guideInner"></div>
</div>
<div class="guide-modal" id="bulkPriceModal" onclick="if(event.target===this)closeBulkPrices()">
  <div style="max-width:520px;margin:60px auto;background:#1e293b;border:1px solid #334155;border-radius:12px;padding:28px 32px" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
      <div style="font-size:15px;font-weight:700;font-family:-apple-system,sans-serif" id="bpu-title"></div>
      <button onclick="closeBulkPrices()" style="background:none;border:none;color:#64748b;font-size:18px;cursor:pointer">✕</button>
    </div>
    <div id="bpu-hint" style="font-size:11px;color:#64748b;margin-bottom:6px"></div>
    <div id="bpu-skip" style="font-size:11px;color:#475569;margin-bottom:14px"></div>
    <div id="bpu-body"></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button id="bpu-apply" onclick="applyBulkPrices()" style="flex:1;padding:8px;border-radius:6px;border:none;background:#1d4ed8;color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:-apple-system,sans-serif"></button>
      <button onclick="closeBulkPrices()" style="padding:8px 16px;border-radius:6px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:13px;cursor:pointer;font-family:-apple-system,sans-serif" id="bpu-cancel"></button>
    </div>
  </div>
</div>
<div class="guide-modal" id="settingsModal" onclick="if(event.target===this)closeSettings()">
  <div style="max-width:520px;margin:48px auto;background:#1e293b;border:1px solid #334155;border-radius:14px;padding:28px 32px;max-height:90vh;overflow-y:auto" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div style="font-size:16px;font-weight:700;font-family:-apple-system,sans-serif">⚙ Settings</div>
      <button onclick="closeSettings()" style="background:none;border:none;color:#64748b;font-size:18px;cursor:pointer">✕</button>
    </div>
    <div id="settings-body"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid #334155">
      <button onclick="closeSettings()" style="padding:8px 20px;border-radius:6px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:13px;cursor:pointer;font-family:-apple-system,sans-serif">Close</button>
    </div>
  </div>
</div>
<div class="guide-modal" id="syncModal" onclick="if(event.target===this)closeSyncModal()">
  <div id="syncModalBody" style="max-width:460px;margin:60px auto;background:#1e293b;border:1px solid #334155;border-radius:14px;padding:24px 26px" onclick="event.stopPropagation()"></div>
</div>
<div class="guide-modal" id="refreshReportModal" onclick="if(event.target===this)closeRefreshReport()">
  <div style="max-width:560px;margin:48px auto;background:#1e293b;border:1px solid #334155;border-radius:14px;padding:28px 32px;max-height:90vh;overflow-y:auto" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div id="rr-title" style="font-size:16px;font-weight:700;font-family:-apple-system,sans-serif"></div>
      <button onclick="closeRefreshReport()" style="background:none;border:none;color:#64748b;font-size:18px;cursor:pointer">✕</button>
    </div>
    <div id="rr-body"></div>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:20px;padding-top:16px;border-top:1px solid #334155">
      <button onclick="closeRefreshReport()" style="padding:8px 20px;border-radius:6px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:13px;cursor:pointer;font-family:-apple-system,sans-serif">Close</button>
    </div>
  </div>
</div>
</div>
<div class="guide-modal" id="ventajaModal" onclick="if(event.target===this)closeVentajaFiscal()">
  <div style="max-width:500px;margin:60px auto;background:#1e293b;border:1px solid #334155;border-radius:14px;padding:28px 32px" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">

// Always returns the three known entries in fixed order, filled from `saved` where present
function mergeOther(saved) {
  return defaultOther().map(def => { const sv = (saved||[]).find(o=>o && o.id===def.id); return sv ? {...def, ...sv} : def; });
}
// Replace the whole in-memory dataset from one saved object (missing parts become empty, never left over)
function applyDataset(d, fallbackPositions, fallbackOther) {
  d = d || {};
  positions     = Array.isArray(d.positions) ? d.positions : JSON.parse(JSON.stringify(fallbackPositions||[]));
  OTHER         = mergeOther(d.other || JSON.parse(JSON.stringify(fallbackOther||[])));
  CLOSED        = Array.isArray(d.closed) ? d.closed : [];
  TRASPASADO    = Array.isArray(d.traspasado) ? d.traspasado : [];
  benchmarkData = Array.isArray(d.benchmark) ? d.benchmark : [];
  targets       = (d.targets && typeof d.targets==='object') ? d.targets : {};
}

function daysSince(internalDateStr) {

}

// ─── XIRR ────────────────────────────────────────────────────────────────────
function solveXIRR(flows) {
  // Generic Newton-Raphson IRR solver over an arbitrary list of {t, v} cash
  // flows (t: ms timestamp, v: signed amount). Shared by per-position XIRR
  // and the aggregate portfolio XIRR below.
  if (!flows.length) return null;
  const t0 = flows[0].t;
  let rate = 0.1;
  for (let i = 0; i < 100; i++) {
    let npv = 0, dnpv = 0;
    for (const f of flows) {
      const yr = (f.t - t0) / (365.25 * 86400000);
      const denom = Math.pow(1 + rate, yr);
      npv  += f.v / denom;
      dnpv -= yr * f.v / (denom * (1 + rate));
    }
    if (Math.abs(npv) < 1e-6) break;
    if (Math.abs(dnpv) < 1e-10) break;
    rate -= npv / dnpv;
    if (rate < -0.999) rate = -0.999;
  }
  if (!isFinite(rate) || rate < -1) return null;
  // Sanity bound: XIRR above 1000% is almost always a numerical artifact
  // (e.g. very short holding period with a small price move). Suppress display.
  if (rate > 10) return null;
  return rate;
}

// Market value that left a position on a Traspaso Out. The transaction itself is
// recorded at average cost (p), so use the stored transfer value when present
// (mv, saved from now on), else the position's own price on/near that date,
// and only as a last resort the cost.
function trOutValue(p, t) {
  if (t.mv != null) return t.mv;
  const ts = parseD(t.d), win = 10*86400000;
  const ph = (p.priceHistory||[]).filter(h=>h.p>0).map(h=>({ts:parseD(h.d), p:h.p})).sort((a,b)=>a.ts-b.ts);
  const before = ph.filter(h=>h.ts<=ts), after = ph.filter(h=>h.ts>ts);
  if (before.length && ts-before[before.length-1].ts <= win) return t.q*before[before.length-1].p;
  if (after.length && after[0].ts-ts <= win) return t.q*after[0].p;
  return t.q*t.p;
}
// Signed cash flow of one transaction (negative = money in, positive = money out)
function txFlow(p, t) {
  const c = t.c||0;
  if (t.a === 'Buy' || t.a === 'Traspaso In') return -(t.q*t.p + c);
  if (t.a === 'Sell') return t.q*t.p - c;
  if (t.a === 'Traspaso Out') return trOutValue(p, t);
  if (t.a === 'Dividend') return t.p;   // dividend amount stored in p
  return null;
}
function calcXIRR(p) {
  // Build cash flows: buys are negative (outflow), sells positive (inflow)
  // Final CF: current value today as positive inflow
  const flows = [];
  for (const t of p.txs) {
    const ts = parseD(t.d);
    const fv = txFlow(p, t); if (fv !== null) flows.push({t: ts, v: fv});
  }
  if (!flows.length) return null;
  flows.push({t: Date.now(), v: cv(p)});
  return solveXIRR(flows);
}

function calcPortfolioXIRR(ytdOnly) {
  // Money-weighted return across ALL currently open positions, pooled into a
  // single set of cash flows (not an average of individual XIRRs, which would
  // be mathematically meaningless). Scope: open positions only — a position
  // that has been fully closed (sold out, or a redeemed PIAS) no longer
  // contributes here; its result lives in Realised P&L instead.
  //
  // ytdOnly mirrors the Jan-1 reconstruction used for YTD unrealised P&L
  // elsewhere: for a position held since before this year, its Jan-1 market
  // value (qty × price at Jan 1, NOT original cost) is injected as a synthetic
  // opening cash flow — exactly like "if I'd bought what I held, at market
  // price, on Jan 1". Real transactions before Jan 1 are excluded; real
  // transactions from Jan 1 onward count normally. A position opened this
  // year needs no synthetic seed — its real history already starts in-year.
  const jan1 = ytdOnly ? new Date(new Date().getFullYear(), 0, 1).getTime() : null;
  const flows = [];
  const incompleteNames = [];
  for (const p of positions) {
    if (!ytdOnly) {
      for (const t of p.txs) {
        const ts = parseD(t.d);
        const fv = txFlow(p, t); if (fv !== null) flows.push({t: ts, v: fv});
      }
      continue;
    }
    // Reconstruct qty as of Jan 1 by replaying only pre-Jan-1 transactions.
    let qtyJan1 = 0;
    [...(p.txs||[])].sort((a,b)=>parseD(a.d)-parseD(b.d))
      .filter(t=>parseD(t.d) < jan1)
      .forEach(t=>{
        if (t.a==='Buy'||t.a==='Traspaso In') qtyJan1 += t.q;
        else if (t.a==='Sell'||t.a==='Traspaso Out') qtyJan1 -= t.q;
      });
    if (qtyJan1 > 0) {
      const ph = (p.priceHistory||[]).filter(h=>h.p>0).sort((a,b)=>parseD(a.d)-parseD(b.d));
      const after = ph.filter(h=>parseD(h.d) >= jan1);
      const before = ph.filter(h=>parseD(h.d) < jan1);
      const startPrice = after.length ? after[0].p : (before.length ? before[before.length-1].p : null);
      if (startPrice == null) { incompleteNames.push(p.name); }
      else flows.push({t: jan1, v: -(qtyJan1 * startPrice)});
    }
    // Real transactions from Jan 1 onward, same as the all-time case.
    for (const t of p.txs) {
      const ts = parseD(t.d);
      if (ts < jan1) continue;
      const fv = txFlow(p, t); if (fv !== null) flows.push({t: ts, v: fv});
    }
  }
  if (!flows.length) return {xirr:null, incompleteNames};
  flows.sort((a,b)=>a.t-b.t);
  const totalNow = positions.reduce((s,p)=>s+cv(p),0);
  flows.push({t: Date.now(), v: totalNow});
  return {xirr: solveXIRR(flows), incompleteNames};
}

function totals() {
  const oI = positions.reduce((s,p)=>s+p.invested,0);
  const oV = positions.reduce((s,p)=>s+cv(p),0);
  const inc = state.includeInOverview;
  const piasActive = !(OTHER[1] && OTHER[1].redemption);   // redeemed PIAS is cashed out
  const xI = (inc.pension?OTHER[0].investedEUR:0) + (inc.pias&&piasActive?OTHER[1].investedEUR:0);
  const xV = (inc.pension?OTHER[0].currentEUR:0)  + (inc.pias&&piasActive?OTHER[1].currentEUR:0);
  const tI = oI + xI, tV = oV + xV;
  return {oI,oV,oP:oV-oI, tI,tV,tP:tV-tI, tPp:tI>0?(tV-tI)/tI:0};
}

// SVG donut
function donut(data, W, H) {
  const cx=W/2, cy=H/2, oR=H*.42, iR=H*.27;
  const tot = data.reduce((s,d)=>s+d.v,0);
  let ang = -90;
  const paths = data.map(d=>{
    const sw = (d.v/tot)*360;
    const a1 = ang*Math.PI/180, a2 = (ang+sw-1.5)*Math.PI/180;
    const la = sw>180?1:0;
    const X = (r,a)=>(cx+r*Math.cos(a)).toFixed(1), Y = (r,a)=>(cy+r*Math.sin(a)).toFixed(1);
    const amid = (ang + sw/2) * Math.PI/180;
    const path=`M${X(oR,a1)} ${Y(oR,a1)} A${oR} ${oR} 0 ${la} 1 ${X(oR,a2)} ${Y(oR,a2)} L${X(iR,a2)} ${Y(iR,a2)} A${iR} ${iR} 0 ${la} 0 ${X(iR,a1)} ${Y(iR,a1)}Z`;
    const pctLabel = (d.v/tot*100).toLocaleString(NL(),{minimumFractionDigits:1,maximumFractionDigits:1});
    const tx = (Math.cos(amid)*5).toFixed(1), ty = (Math.sin(amid)*5).toFixed(1);
    const hover = d.posId
      ? `onmouseover="this.setAttribute('transform','translate(${tx},${ty})');document.getElementById('donut-tip').textContent='${jsq(d.name)} · ${pctLabel}%';document.getElementById('donut-tip').style.opacity=1"
         onmouseout="this.removeAttribute('transform');document.getElementById('donut-tip').style.opacity=0"` : '';
    const click = d.posId ? `onclick="selectPos('${d.posId}')"` : '';
    ang+=sw;
    return `<path d="${path}" fill="${d.color}" ${click} ${hover} style="${d.posId?'cursor:pointer;transition:transform .12s':''}">
      <title>${esc(d.name)} — ${pctLabel}% · €${Math.round(d.v).toLocaleString('it-IT')}</title>
    </path>`;
  }).join('');
  return `<svg width="${W}" height="${H+22}" viewBox="0 0 ${W} ${H+22}" style="display:block;margin:0 auto;overflow:visible">
  ${paths}
  <text id="donut-tip" x="${cx}" y="${H+16}" text-anchor="middle" fill="#e2e8f0" font-size="11" font-family="-apple-system,sans-serif" font-weight="500" opacity="0" style="pointer-events:none"></text>
</svg>`;
}

        <div id="export-menu" style="display:none;position:absolute;top:calc(100% + 4px);right:0;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:4px;z-index:200;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.4)">
          <button onclick="exportData();document.getElementById('export-menu').style.display='none'" class="exp-item">📦 Backup <span style="color:#475569;font-weight:400">(.json)</span></button>
          <button onclick="exportAISummary();document.getElementById('export-menu').style.display='none'" class="exp-item">🤖 AI Summary <span style="color:#475569;font-weight:400">(.json)</span></button>
          <button onclick="exportReport();document.getElementById('export-menu').style.display='none'" class="exp-item">📄 Report <span style="color:#475569;font-weight:400">(.html)</span></button>
          <button onclick="exportExcel();document.getElementById('export-menu').style.display='none'" class="exp-item">📊 Excel <span style="color:#475569;font-weight:400">(.xlsx)</span></button>
        </div>
      </div>
      <button onclick="document.getElementById('importFile').click()" title="${T('importTitle')}" class="hdr-btn">↑ ${T('importBtn')}</button>
      <button onclick="resetData()" title="${T('clearBtn')}" class="hdr-btn danger">${T('clearBtn')}</button>
      <button id="refreshBtn" onclick="refreshPrices()" title="${T('refreshPrices')}" class="hdr-btn">${T('refreshPrices')}</button>
      <button onclick="openSettings()" title="Settings" class="hdr-btn">⚙ Settings</button>
      <button onclick="openGuide()" title="User Guide" class="hdr-btn">? Guide</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importData(this)">
  </div>
</div>
${tabs}
<div class="content">${sel ? renderDetail(sel) : state.tab==='overview' ? renderOverview(t) : state.tab==='positions' ? renderPositions() : state.tab==='closed' ? renderClosed() : state.tab==='analysis' ? renderAnalysis() : state.tab==='charts' ? renderCharts() : state.tab==='currency' ? renderCurrencyTab() : state.tab==='history' ? renderHistory() : renderAltro()}</div>`;

  if (state.editingId) {
    const el = document.getElementById('pi_'+state.editingId);
    if (el) { el.focus(); el.select(); }
  }
  if (state.editingOther) {
    const el = document.getElementById(`oi_${state.editingOther.id}_${state.editingOther.field}`);
    if (el) { el.focus(); el.select(); }
  }
  if (state.showAddTx) { const q = document.getElementById('tx_q'); if(q) q.focus(); }

  // Re-apply dirty indicator — render() rebuilds the save button so we must reapply
  if (unsaved) {
    const btn = document.getElementById('saveBtn');
    if (btn) {
      btn.style.background = '#1d4ed8';
      btn.style.borderColor = '#3b82f6';
      btn.style.color = '#fff';
      btn.textContent = '● ' + T('saveBtn');
    }
  }
}

// ─── OVERVIEW ────────────────────────────────────────────────────────────────

function renderOverview(t) {
  // Welcome state — no data yet
  if (!positions.length && !demoMode) {
    return `<div style="max-width:480px;margin:80px auto;text-align:center;padding:0 2rem">
      <div style="font-size:48px;margin-bottom:16px">📊</div>
      <div style="font-size:20px;font-weight:700;color:#f1f5f9;margin-bottom:8px">Welcome to Portfolio Tracker</div>
      <div style="font-size:14px;color:#64748b;line-height:1.7;margin-bottom:28px">No portfolio data yet. Import an existing backup to restore your data, or add your first position manually.</div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button onclick="document.getElementById('importFile').click()" style="padding:10px 22px;border-radius:8px;border:none;background:#1d4ed8;color:#fff;font-size:14px;font-weight:600;cursor:pointer">↑ Import backup</button>
        <button onclick="state.tab='positions';state.showAddPosition=true;render()" style="padding:10px 22px;border-radius:8px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:14px;font-weight:600;cursor:pointer">+ Add first position</button>
        <button onclick="toggleDemo()" style="padding:10px 22px;border-radius:8px;border:1px solid #334155;background:transparent;color:#94a3b8;font-size:14px;font-weight:600;cursor:pointer">▷ Try demo</button>
      </div>
    </div>`;
  }

  const pieD = positions.map((p,i)=>({v:cv(p),color:PIE_COLORS[i%6],name:p.name,posId:p.id}));
  pieD.sort((a,b)=>b.v-a.v);   // largest allocation first (colors stay tied to the position, not the rank)
  const curYear = new Date().getFullYear();
  const showYTD = state.unrealYearOnly;
  const closedYearFilter = c => {
    if (!showYTD) return true;
    if (!c.date) return false;
    return new Date(parseD(c.date)).getFullYear() === curYear;
  };
  const closedFiltered = CLOSED.filter(closedYearFilter);
  // A redeemed PIAS contributes a realised gain/loss (redemption amount − invested).
  const piaObj = OTHER.find(o=>o.id==='pias');
  const piasActive = !(piaObj && piaObj.redemption);   // redeemed PIAS is cashed out, excluded from unrealised
  const piasRedeemed = piaObj && piaObj.redemption
    ? {name:'PIAS BBVA', pl:(piaObj.redemption.amount - piaObj.investedEUR), date:piaObj.redemption.date, redeemed:true}
    : null;
  const piasRedeemedShown = piasRedeemed && (!showYTD ||
    (piasRedeemed.date && new Date(parseD(piasRedeemed.date)).getFullYear() === curYear));
  const realisedList = piasRedeemedShown ? [...closedFiltered, piasRedeemed] : [...closedFiltered];
  const realPL = realisedList.reduce((s,c)=>s+c.pl,0);
  const inc = state.includeInOverview;

  // YTD unrealised P&L = unrealized_today − unrealized_at_start_of_year.
  // Reconstruct each position's qty/avgFill as of Jan 1 by replaying txs, then
  // compute unrealized at the Jan-1 reference price. For positions opened this
  // year, state at Jan 1 is empty so YTD = full unrealized.
  const jan1 = new Date(curYear, 0, 1).getTime();
  const ytdData = positions.map(p => {
    const unrealToday = (p.price - p.avgFill) * p.qty;
    const firstTx = (p.txs||[]).map(t=>parseD(t.d)).sort((a,b)=>a-b)[0];
    const openedThisYear = firstTx ? new Date(firstTx).getFullYear() === curYear : true;
    if (openedThisYear) return {p, ytd:unrealToday}; // not held at Jan 1 → full unrealized is YTD

    // Held since prior year → reconstruct qty & invested as of Jan 1
    let qty=0, invested=0;
    [...(p.txs||[])].sort((a,b)=>parseD(a.d)-parseD(b.d))
      .filter(t=>parseD(t.d) < jan1)
      .forEach(t=>{
        if(t.a==='Buy'||t.a==='Traspaso In'){ qty+=t.q; invested+=t.q*t.p+(t.c||0); }
        else if(t.a==='Sell'||t.a==='Traspaso Out'){ if(qty>0){ invested=(invested/qty)*(qty-t.q); } qty-=t.q; }
      });
    if (qty <= 0) return {p, ytd:unrealToday};

    // Jan-1 reference price: first price on/after Jan 1, else last price before
    const ph = (p.priceHistory||[]).filter(h=>h.p>0).sort((a,b)=>parseD(a.d)-parseD(b.d));
    if (!ph.length) return {p, ytd:null};
    const after = ph.filter(h=>parseD(h.d) >= jan1);
    const before = ph.filter(h=>parseD(h.d) < jan1);
    const startPrice = after.length ? after[0].p : (before.length ? before[before.length-1].p : null);
    if (startPrice == null) return {p, ytd:null};

    const avgJan1 = invested/qty;
    const unrealStart = (startPrice - avgJan1) * qty;
    return {p, ytd: unrealToday - unrealStart};
  });

  // YTD for included OTHER assets (Pension/PIAS): currentEUR − value at year start (from history).
  // Their P&L change YTD = (current − invested) − (valueAtStart − invested) = current − valueAtStart.
  const otherYtd = (asset) => {
    if (!asset || !asset.history || !asset.history.length) return null;
    const hist = [...asset.history].sort((a,b)=>parseD(a.date)-parseD(b.date));
    // Pick the entry closest to Jan 1 in absolute terms (before or after).
    // Sporadic histories (e.g. pension) may have the nearest point in late
    // December, which is a better year-start proxy than a April reading.
    let startEntry = null, bestDist = Infinity;
    for (const h of hist) {
      const dist = Math.abs(parseD(h.date) - jan1);
      if (dist < bestDist) { bestDist = dist; startEntry = h; }
    }
    if (!startEntry) return null;
    // Guard: if the closest point is more than ~60 days from Jan 1, treat as missing
    if (bestDist > 60*24*60*60*1000) return null;
    const startVal = startEntry.eur != null ? startEntry.eur : startEntry.current;
    if (startVal == null) return null;
    const curVal = asset.currentEUR != null ? asset.currentEUR : asset.current;
    return curVal - startVal;
  };
  const ytdOtherData = [];
  ytdOtherData.push({asset:OTHER[0], ytd:otherYtd(OTHER[0])});
  ytdOtherData.push({asset:OTHER[1], ytd:otherYtd(OTHER[1])});

  const ytdTotal = ytdData.reduce((s,x)=>s + (x.ytd||0), 0)
                 + (inc.pension && ytdOtherData[0].ytd!=null ? ytdOtherData[0].ytd : 0)
                 + (inc.pias && piasActive && ytdOtherData[1].ytd!=null ? ytdOtherData[1].ytd : 0);
  const ytdComplete = ytdData.every(x => x.ytd !== null)
                   && (!inc.pension || ytdOtherData[0].ytd !== null)
                   && (!inc.pias || !piasActive || ytdOtherData[1].ytd !== null);
  const ytdIncompleteNames = [
    ...ytdData.filter(x=>x.ytd===null).map(x=>x.p.name),
    ...(inc.pension && ytdOtherData[0].ytd===null ? ['Pension Pot UK'] : []),
    ...(inc.pias && piasActive && ytdOtherData[1].ytd===null ? ['PIAS BBVA'] : []),
  ];
  const displayPL = showYTD ? ytdTotal : t.tP;
  const displayPLp = showYTD ? (t.tI>0 ? ytdTotal/t.tI : 0) : t.tPp;

  const stats = `<div class="g3">
  <div class="stat"><div class="stat-lbl">${T('totalInvested')}</div><div class="stat-val">€${e2(t.tI)}</div></div>
  <div class="stat"><div class="stat-lbl">${T('currentValue')}</div><div class="stat-val">€${e2(t.tV)}</div></div>
  <div class="stat">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
      <div class="stat-lbl" style="margin:0">${T('unrealisedPL')}</div>
      <div style="display:flex;gap:3px">
        <button onclick="state.unrealYearOnly=false;render()" style="padding:1px 6px;border-radius:4px;border:1px solid ${!showYTD?'#3b82f6':'#334155'};font-size:9px;font-weight:600;cursor:pointer;background:${!showYTD?'#1d4ed8':'transparent'};color:${!showYTD?'#fff':'#94a3b8'}">${T('allTime')}</button>
        <button onclick="state.unrealYearOnly=true;render()" style="padding:1px 6px;border-radius:4px;border:1px solid ${showYTD?'#3b82f6':'#334155'};font-size:9px;font-weight:600;cursor:pointer;background:${showYTD?'#1d4ed8':'transparent'};color:${showYTD?'#fff':'#94a3b8'}">${curYear}</button>
      </div>
    </div>
    <div class="stat-val ${displayPL>=0?'g':'r'}">${displayPL>=0?'+':'-'}€${e2(displayPL)}</div>
    <div class="stat-sub ${displayPL>=0?'g':'r'}">${pct(displayPLp)}${showYTD&&!ytdComplete?` <span style="color:#f59e0b" title="${T('ytdPartial')(ytdIncompleteNames)}">⚠</span>`:''}</div>
    ${showYTD && !ytdComplete ? `<div style="font-size:9px;color:#64748b;margin-top:2px">${T('ytdMarketOnly')}</div>` : ''}
    ${(()=>{ const r = calcPortfolioXIRR(showYTD); if (r.xirr===null) return '';
      const names = showYTD ? r.incompleteNames : [];
      const warn = names.length ? ` <span style="color:#f59e0b" title="${T('ytdPartial')(names)}">⚠</span>` : '';
      const label = showYTD ? `${T('portfolioXirr')} (${curYear})` : T('portfolioXirr');
      return `<div style="font-size:10px;color:#64748b;margin-top:4px;padding-top:4px;border-top:1px solid #1e293b" title="${T('portfolioXirrHint')}">${label}: <span class="mn" style="color:${r.xirr>=0?'#34d399':'#f87171'}">${pct(r.xirr)}</span>${warn}</div>`; })()}
  </div></div>`;

  const totalOpenVal = pieD.reduce((s,d)=>s+d.v,0);
  const fmt0 = v => Math.round(v).toLocaleString(NL());   // whole euros: this is an allocation summary, cents are noise
  const legend = pieD.map(d=>{
    const share = totalOpenVal>0 ? (d.v/totalOpenVal*100).toLocaleString(NL(),{minimumFractionDigits:1,maximumFractionDigits:1}) : '0.0';
    const pos = positions.find(q=>q.id===d.posId);
    const inv = pos ? pos.invested : 0;
    const pl = d.v - inv;
    return `<button onclick="selectPos('${d.posId}')" style="background:none;border:none;padding:0;width:100%;cursor:pointer;text-align:left" title="→ ${esc(d.name)}">
  <div class="leg" style="border-radius:4px;padding:3px 4px;transition:background .12s" onmouseover="this.style.background='#1e293b'" onmouseout="this.style.background='transparent'">
    <span class="leg-l" style="min-width:0"><span class="dot" style="background:${d.color}"></span><span style="color:#cbd5e1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(d.name)}</span></span>
    <span style="display:flex;gap:0;align-items:center;flex-shrink:0">
      <span class="mn" style="font-size:11px;color:#64748b;width:40px;text-align:right">${share}%</span>
      <span class="mn" style="font-size:11px;color:#94a3b8;width:64px;text-align:right">€${fmt0(d.v)}</span>
      <span class="mn" style="font-size:11px;color:#64748b;width:64px;text-align:right">€${fmt0(inv)}</span>
      <span class="mn" style="font-size:11px;width:70px;text-align:right;color:${pl>=0?'#34d399':'#f87171'}">${pl>=0?'+':'-'}€${fmt0(Math.abs(pl))}</span>
    </span>
  </div>
</button>`;
  }).join('');
  const legendHeader = `<div style="display:flex;justify-content:flex-end;padding:0 4px 3px;border-bottom:1px solid #1e293b;margin-bottom:3px">
    <span style="display:flex;flex-shrink:0;font-size:9px;color:#475569;text-transform:uppercase;letter-spacing:.04em">
      <span style="width:40px;text-align:right">%</span>
      <span style="width:64px;text-align:right">${T('alValue')}</span>
      <span style="width:64px;text-align:right">${T('alInvested')}</span>
      <span style="width:70px;text-align:right">P&L</span>
    </span>
  </div>`;

  // Toggle button helper
  const tog = (id) => {
    const on = inc[id];
    return `<button onclick="toggleOtherInc('${id}')" title="${on?T('includedInTotal'):T('excludedFromTotal')}"
      style="background:${on?'#064e3b':'#1e293b'};border:1px solid ${on?'#34d399':'#475569'};border-radius:4px;color:${on?'#34d399':'#64748b'};font-size:10px;font-weight:600;padding:2px 7px;cursor:pointer;white-space:nowrap;transition:all .15s">
      ${on?'✓ ON':'— OFF'}
    </button>`;
  };

  const pen=OTHER[0], pia=OTHER[1];
  const penYtdVal = ytdOtherData.find(x=>x.asset===OTHER[0])?.ytd;
  const piaYtdVal = ytdOtherData.find(x=>x.asset===OTHER[1])?.ytd;
  const penDisplayPL = showYTD && penYtdVal!=null ? penYtdVal : pen.plEUR;
  const piaDisplayPL = showYTD && piaYtdVal!=null ? piaYtdVal : pia.plEUR;
  const penPl=penDisplayPL>=0, piaPl=piaDisplayPL>=0;

  const bk = OTHER.find(o=>o.id==='bankinter');
  // Follow the same All-time / current-year toggle as the realised P&L above,
  // so the two "gross → net" blocks always cover the same period.
  // Bankinter payment dates come from a native <input type="date">, so they are
  // stored as ISO (YYYY-MM-DD) — unlike every other date in the app (DD/MM/YY).
  // parseD() expects the slash format and would throw on ISO strings, so these
  // use the native Date constructor instead, which parses ISO correctly.
  const bkPayments = bk ? (bk.payments||[]).filter(p =>
    !showYTD || (p.d && new Date(p.d).getFullYear() === curYear)) : [];
  const bkNet = bkPayments.reduce((s,p)=>s+p.net,0);
  const bkGross = bkPayments.reduce((s,p)=>s+p.gross,0);

  const posYtdTotal = ytdData.reduce((s,x)=>s+(x.ytd||0),0);
  const openPL = showYTD ? posYtdTotal : t.oP;
  // Net securities figure for the combined total: taxed only when there's a
  // gain to tax (a loss isn't taxed, so it stands as-is).
  const taxEntries = realisedList.map(c => ({pl:c.pl, year:yearOfDate(c.date)}));
  const realTax = sumTax(taxByYear(taxEntries));
  const secNetForTotal = realPL - realTax;
  const soldToday = showYTD ? null : taxIfSoldToday(taxEntries);

  const breakdown = `
<div style="font-size:10px;font-weight:700;color:#60a5fa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding-left:8px;border-left:3px solid #3b82f6">${T('unrealisedSection')}</div>
<div class="sum">
  <span class="m">${T('openPositions')}</span>
  <div class="sum-v"><span class="d">€${e2(t.oI)}</span><span>€${e2(t.oV)}</span><span class="${openPL>=0?'g':'r'}">${openPL>=0?'+':'-'}€${e2(openPL)}</span></div>
</div>
${soldToday && (openPL > 0 || soldToday.latent > 0) ? `<div style="text-align:right;margin-top:2px" title="${T('ifSoldTodayHint')}"><span style="font-size:10px;color:#475569;font-style:italic">${T('ifSoldToday')} ${openPL-soldToday.extra>=0?'+':'-'}€${e2(openPL - soldToday.extra)}</span></div>` : ''}
<hr>
<div class="sum" style="${!inc.pension?'opacity:.45':''}">
  <span class="m" style="display:flex;align-items:center;gap:6px">Pension Pot UK ${tog('pension')}</span>
  <div class="sum-v"><span class="d">€${e2(pen.investedEUR)}</span><span>€${e2(pen.currentEUR)}</span><span class="${penPl?'g':'r'}">${penPl?'+':'-'}€${e2(penDisplayPL)}</span></div>
</div>
${piaObj&&piaObj.redemption ? '' : `<div class="sum" style="${!inc.pias?'opacity:.45':''}">
  <span class="m" style="display:flex;align-items:center;gap:6px">PIAS BBVA ${tog('pias')}</span>
  <div class="sum-v"><span class="d">€${e2(pia.investedEUR)}</span><span>€${e2(pia.currentEUR)}</span><span class="${piaPl?'g':'r'}">${piaPl?'+':'-'}€${e2(piaDisplayPL)}</span></div>
</div>`}
<hr>
<div class="sum"><strong>${T('total')}</strong><span class="mn ${t.tP>=0?'g':'r'}" style="font-weight:700">${t.tP>=0?'+':'-'}€${e2(t.tP)}</span></div>
<div style="margin-top:16px;border-top:2px solid #334155;padding-top:12px">
  <div style="font-size:10px;font-weight:700;color:#a78bfa;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;padding-left:8px;border-left:3px solid #8b5cf6">${T('realisedPLSection')}${showYTD?` <span style="color:#475569;font-weight:400;text-transform:none;letter-spacing:normal">(${curYear})</span>`:''}</div>
  <div style="font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">${T('fromExits')}</div>
  ${realisedList.length ? Object.entries(realisedList.reduce((acc,c)=>{
    if(!acc[c.name]) acc[c.name]={pl:0, allPartial:true, redeemed:false};
    acc[c.name].pl += c.pl;
    if(!c.partial) acc[c.name].allPartial = false;
    if(c.redeemed) acc[c.name].redeemed = true;
    return acc;
  },{})).map(([name,{pl,allPartial,redeemed}])=>`<div class="sum"><span class="d">${name}${redeemed?` <span style="font-size:10px;color:#f59e0b">(${T('redeemedTag')})</span>`:allPartial?` <span style="font-size:10px;color:#60a5fa">(${T('partialSell')})</span>`:''}</span><span class="mn ${pl>=0?'g':'r'}">${pl>=0?'+':'-'}€${e2(pl)}</span></div>`).join('') : `<div style="font-size:11px;color:#475569;font-style:italic;padding:4px 0">${T('noRealisedYear')}</div>`}
  <div class="sum" style="margin-top:6px;border-top:1px solid #334155;padding-top:6px"><span class="d" style="color:#94a3b8">${T('totalRealised')}</span><span class="mn ${realPL>=0?'g':'r'}">${realPL>=0?'+':'-'}€${e2(realPL)}</span></div>
  ${(realPL > 0 || realTax > 0) ? `<div class="sum" style="margin-top:4px"><strong style="font-size:12px">${T('realisedNetShort')}</strong><span class="mn ${secNetForTotal>=0?'g':'r'}" style="font-weight:600">${secNetForTotal>=0?'+':'-'}€${e2(secNetForTotal)}</span></div>` : ''}
  ${bkGross > 0 ? `<div style="margin-top:12px;border-top:1px solid #1e293b;padding-top:10px">
    <div style="font-size:10px;font-weight:600;color:#94a3b8;text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px">${T('interestIncome')}${showYTD?` <span style="color:#475569;font-weight:400;text-transform:none;letter-spacing:normal">(${curYear})</span>`:''}</div>
    <div class="sum"><span class="d" style="color:#94a3b8">${T('bkGrossLabel')}</span><span class="mn" style="color:#94a3b8">€${e2(bkGross)}</span></div>
    <div class="sum" style="margin-top:4px"><strong style="font-size:12px">${T('bkNetLabel')}</strong><span class="mn g" style="font-weight:600">+€${e2(bkNet)}</span></div>
  </div>` : ''}
  ${(realPL !== 0 || bkGross > 0) ? `<div class="sum" style="margin-top:12px;border-top:2px solid #334155;padding-top:10px"><strong style="font-size:13px">${T('totalNetRealised')}</strong><span class="mn ${(secNetForTotal+bkNet)>=0?'g':'r'}" style="font-weight:700;font-size:14px">${(secNetForTotal+bkNet)>=0?'+':'-'}€${e2(Math.abs(secNetForTotal+bkNet))}</span></div>` : ''}
</div>`;

  const perf = [...positions].sort((a,b)=>{
    if (showYTD) {
      const ay = ytdData.find(x=>x.p.id===a.id), by = ytdData.find(x=>x.p.id===b.id);
      const ap = ay&&ay.ytd!=null&&a.invested>0?ay.ytd/a.invested:upp(a);
      const bp = by&&by.ytd!=null&&b.invested>0?by.ytd/b.invested:upp(b);
      return bp-ap;
    }
    return upp(b)-upp(a);
  }).map(p=>{
    const yd = ytdData.find(x=>x.p.id===p.id);
    const l = showYTD && yd && yd.ytd!=null ? yd.ytd : upl(p);

  return `${stats}

}

  const showFiscal = fiscalAvg!=null && Math.abs(fiscalAvg - p.avgFill) > 0.001;
  const infoCols = [[T('qty'),p.qty.toLocaleString(NL(),{minimumFractionDigits:4,maximumFractionDigits:4})],[T('avgCost'),`€${e2(p.avgFill)}`],[T('alInvested'),`€${e2(p.invested)}`],[T('currentValue'),`€${e2(v)}`],[T('xirr'),`<span style="color:${xirrColor};font-weight:700" title="${T('xirrTitle')}">${xirrStr}</span>`],...(totalDivs>0?[[T('divTotal'),`<span style="color:#fbbf24;font-weight:700">€${e2(totalDivs)}</span>`]]:[]),...(showFiscal?[[T('fiscalInvLabel'),`€${e2(p.fiscalInvested)}`],[T('fiscalPlLabel'),`<span style="color:${v-p.fiscalInvested>=0?'#34d399':'#f87171'};font-weight:600">€${e2(v-p.fiscalInvested)} (${p.fiscalInvested>0?((v/p.fiscalInvested-1)*100).toFixed(2):'0.00'}%)</span>`],[T('fiscalCostLabel'),`<span style="color:#a78bfa;font-weight:600" title="${T('fiscalCostTitle')}">€${e2(fiscalAvg)}</span>`]]:[])];

    </div>
  </div>` : '';

  const priceHistSection = (p.priceHistory && p.priceHistory.length) || showAddPH ? `
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <button onclick="state.showPriceHistory['${p.id}']=!state.showPriceHistory['${p.id}'];render()" style="background:none;border:none;color:#94a3b8;font-size:13px;font-weight:600;padding:0;display:flex;align-items:center;gap:5px;cursor:pointer">
      <span style="font-size:10px">${showPH?'▲':'▼'}</span> ${T('priceHistory')} (${(p.priceHistory||[]).length})
    </button>
    <button onclick="state.showAddPriceEntry=state.showAddPriceEntry==='${p.id}'?null:'${p.id}';state.addPriceForm={d:todayHTML(),p:''};render()" class="btn btn-bl" style="padding:4px 10px;font-size:11px">${showAddPH?'✕':T('addPriceEntry')}</button>
  </div>
  ${addPHForm}
  ${showPH ? '<div class="tbl-wrap" style="margin-top:12px"><table>' +
    '<thead><tr><th>'+T('date')+'</th><th class="R">'+T('currentPrice')+'</th><th class="R">'+T('posValue')+'</th><th class="R">P&L</th><th class="R">P&L %</th><th></th></tr></thead>' +
    '<tbody>' + [...p.priceHistory].map((h,i)=>({h,i})).reverse().map(({h,i})=>{
      const realIdx = i; // i is the actual index in p.priceHistory (oldest-first array)
      // Compute qty at the historical date based on transactions up to that date
      const hDate = parseD(h.d);
      // Reconstruct qty and invested at the historical date using average-cost method
      // (replaying txs in order). This matches the position header P&L, unlike the
      // naive buys−sells(at sell price) which double-counts realised gains.
      let hQty = 0, hInvested = 0;
      [...(p.txs||[])].sort((a,b)=>parseD(a.d)-parseD(b.d))
        .filter(t=>parseD(t.d)<=hDate)
        .forEach(t=>{
          if(t.a==='Buy'||t.a==='Traspaso In'){ hQty+=t.q; hInvested+=t.q*t.p+(t.c||0); }

        });
      const hv = h.p * hQty, hpl = hv - hInvested, hpos = hpl>=0;
      const isEd = eph && eph.id===p.id && eph.idx===realIdx;

        '</tr>';
      return '<tr>' +
        '<td class="d mn">'+h.d+'</td>' +
        '<td class="R mn">€'+h.p.toLocaleString(NL(),{minimumFractionDigits:4,maximumFractionDigits:4})+'</td>' +
        '<td class="R mn">€'+e2(hv)+'</td>' +
        '<td class="R mn '+(hpos?'g':'r')+'">'+(hpos?'+':'-')+'€'+e2(hpl)+'</td>' +
        '<td class="R mn '+(hpos?'g':'r')+'">'+(hInvested>0?pct(hpl/hInvested):'—')+'</td>' +
        '<td style="white-space:nowrap;text-align:right">' +
          '<button onclick="seph(\''+p.id+'\','+realIdx+',\''+h.d+'\',\''+h.p+'\')" style="background:none;border:none;color:#64748b;font-size:11px;padding:2px 5px;cursor:pointer">✎</button>' +
          '<button onclick="deph(\''+p.id+'\','+realIdx+')" style="background:none;border:none;color:#7f1d1d;font-size:11px;padding:2px 5px;cursor:pointer">✕</button>' +
        '</td></tr>';
    }).join('') +
    '</tbody></table></div>' : ''}
</div>` : `<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <div style="font-size:13px;font-weight:600;color:#94a3b8">${T('priceHistory')} (0)</div>
    <button onclick="state.showAddPriceEntry='${p.id}';state.addPriceForm={d:todayHTML(),p:''};render()" class="btn btn-bl" style="padding:4px 10px;font-size:11px">${T('addPriceEntry')}</button>
  </div>
  ${addPHForm}
</div>`;

  // Tags section
  const tags = p.tags || [];
  const isEditingTags = state.editingTagsFor === p.id;
  const allTags = [...new Set(positions.flatMap(x=>x.tags||[]))].sort();
  const primaryTag = p.primaryTag || null;

  const primaryRow = `<div style="margin-top:10px;padding-top:10px;border-top:1px solid #1e293b">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:6px">
      <span style="font-size:11px;font-weight:600;color:#94a3b8">★ ${T('primaryTag')}</span>
      <span style="font-size:10px;color:#475569">${T('primaryTagHint')}</span>
    </div>

// ─── IRPF TAX HELPER ─────────────────────────────────────────────────────────

// Calendar year of an internal date string (dd/mm/yy); 0 when missing or unreadable
function yearOfDate(d) {
  try { if (!d) return 0; const y = new Date(parseD(d)).getFullYear(); return isNaN(y) ? 0 : y; } catch(e) { return 0; }
}
// The IRPF savings base is computed per tax year: gains and losses of the same year
// offset each other, years are never pooled. entries: [{pl, year}]
function taxByYear(entries) {
  const years = {};
  entries.forEach(e => {
    const y = years[e.year] || (years[e.year] = {gross:0, pos:0, tax:0});
    y.gross += e.pl;
    if (e.pl > 0) y.pos += e.pl;
  });
  Object.values(years).forEach(y => { y.tax = calcIRPF(Math.max(0, y.gross)); });
  return years;
}
const sumTax = years => Object.values(years).reduce((s,y)=>s+y.tax, 0);
// Share of a year's tax charged to one realised entry: proportional to its gain (losses carry none)
function allocTax(e, years) {
  const y = years[e.year];
  return (y && y.pos > 0 && e.pl > 0) ? y.tax * e.pl / y.pos : 0;
}
// Extra tax if every open position were sold today, on top of what the current year already realised.
// Uses the fiscal cost basis (inherited through traspasos) when a position has one.
function taxIfSoldToday(entries) {
  const cy = new Date().getFullYear();
  const latent = positions.reduce((s,p)=> s + cv(p) - (p.fiscalInvested!=null ? p.fiscalInvested : p.invested), 0);
  const realisedNow = entries.filter(e=>e.year===cy).reduce((s,e)=>s+e.pl, 0);
  const extra = calcIRPF(Math.max(0, realisedNow + latent)) - calcIRPF(Math.max(0, realisedNow));
  return {latent, extra};
}
function calcIRPF(gain) {
  // Spanish savings-base (base del ahorro) brackets, 2026. Rates apply to the
  // gain band, not cumulative income: 19% ≤6k, 21% 6k–50k, 23% 50k–200k,
  // 27% 200k–300k, 30% >300k. Widths below are per-band (limit − previous).
  if (gain <= 0) return 0;
  let tax = 0;
  const brackets = [{width:6000,rate:.19},{width:44000,rate:.21},{width:150000,rate:.23},{width:100000,rate:.27},{width:Infinity,rate:.30}];
  let remaining = gain;
  for (const b of brackets) {
    if (remaining <= 0) break;
    const chunk = Math.min(remaining, b.width);
    tax += chunk * b.rate;
    remaining -= chunk;
  }
  return tax;
}

  // mobiliario in the base del ahorro — the SAME savings-income brackets as

  const closedEntries = CLOSED.map(c => ({pl:c.pl, year:yearOfDate(c.date), ref:c}));

  const taxYears = taxByYear(allTaxEntries);      // per tax year, gains and losses of the same year offset

        <button onclick="state.editingPayment=null;render()" style="background:#334155;border:none;border-radius:4px;color:#94a3b8;padding:3px 9px;font-size:11px;cursor:pointer">✕</button>
      </td></tr>`;
    return `<tr style="border-top:1px solid #1e293b">
      <td style="padding:7px 8px;font-size:12px;color:#94a3b8">${p.d}</td>
      <td style="padding:7px 8px;font-size:13px;font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums;color:#f1f5f9;text-align:right">€${p.gross.toLocaleString(NL(),{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td style="padding:7px 8px;font-size:13px;font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums;color:#34d399;text-align:right">€${p.net.toLocaleString(NL(),{minimumFractionDigits:2,maximumFractionDigits:2})}</td>
      <td style="padding:7px 8px;text-align:right;white-space:nowrap">
        <button onclick="state.editingPayment=${ri};render()" style="background:transparent;border:1px solid #334155;border-radius:4px;color:#64748b;padding:2px 7px;font-size:11px;cursor:pointer;margin-right:4px">✎</button>
        <button onclick="deleteBankinterPayment(${ri})" style="background:transparent;border:1px solid #7f1d1d;border-radius:4px;color:#f87171;padding:2px 7px;font-size:11px;cursor:pointer">✕</button>
      </td></tr>`;

  return `<div class="card" style="margin-top:14px">
  <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px">

      <div style="font-size:12px;color:#64748b;margin-top:3px">Bankinter · ${T('bankinterTotal')}: ${payments.length} payment${payments.length!==1?'s':''}</div>

  ${payments.length ? `<table style="width:100%;border-collapse:collapse">
    <thead><tr style="border-bottom:1px solid #334155">

  </table>` : `<div style="text-align:center;padding:20px;color:#475569;font-size:13px">No payments recorded yet.</div>`}
</div>`;
}

function addBankinterPayment() {
  const f = state.bankinterForm;
  const gross = parseFloat(f.gross), net = parseFloat(f.net);
  if (!f.d || isNaN(gross) || isNaN(net) || gross<=0) return;
  const bk = OTHER.find(o=>o.id==='bankinter');
  if (!bk) return;
  bk.payments = [...(bk.payments||[]), {d:f.d, gross, net}];
  state.bankinterForm = {d:todayHTML(), gross:'', net:''};
  markDirty(); render();
}
function saveBankinterPayment(idx) {
  const d = document.getElementById('ep_d')?.value;
  const gross = parseFloat(document.getElementById('ep_g')?.value);
  const net   = parseFloat(document.getElementById('ep_n')?.value);
  if (!d || isNaN(gross) || isNaN(net)) return;
  const bk = OTHER.find(o=>o.id==='bankinter');
  if (!bk) return;
  bk.payments[idx] = {d, gross, net};
  state.editingPayment = null;
  markDirty(); render();
}
function deleteBankinterPayment(idx) {
  if (!confirm(T('deletePayment'))) return;
  const bk = OTHER.find(o=>o.id==='bankinter');
  if (!bk) return;
  bk.payments.splice(idx, 1);
  markDirty(); render();
}

const CCY_COLORS = {EUR:'#3b82f6', USD:'#10b981', GBP:'#f59e0b', OTHER:'#8b5cf6'};
const CCY_NAMES  = {EUR:'ccyEUR', USD:'ccyUSD', GBP:'ccyGBP'};

function currencyBreakdown() {
  const buckets = {};
  for (const p of positions) {
    const raw = p.currency || 'EUR';
    const ccy = (p.hedged) ? 'EUR' : raw; // hedged counts as EUR exposure
    buckets[ccy] = (buckets[ccy] || 0) + cv(p);
  }
  // Pension pot is GBP
  buckets['GBP'] = (buckets['GBP'] || 0) + OTHER[0].currentEUR;
  return buckets;
}

function deleteTraspaso(idx) {
  if (idx<0 || idx>=TRASPASADO.length) return;
  const tr = TRASPASADO[idx];
  if (!confirm(`${T('deleteTraspasoConfirm')}\n\n${tr.name} → ${tr.toName||'—'} (${tr.date?fmtD(parseD(tr.date)):''})`)) return;
  TRASPASADO.splice(idx,1);
  markDirty();
  render();
}

function renderHistory() {
  // Fully-closed positions (with full lifecycle) and completed traspasos
  const closedFull = [...CLOSED].reverse();
  const traspasos = (typeof TRASPASADO !== 'undefined' ? [...TRASPASADO] : []).reverse();
  // A fully-redeemed PIAS is a closed investment too.
  const piaObj = OTHER.find(o=>o.id==='pias');
  const piaClosed = (piaObj && piaObj.redemption)
    ? {invested: piaObj.investedEUR, received: piaObj.redemption.amount, date: piaObj.redemption.date,
       pl: piaObj.redemption.amount - piaObj.investedEUR, start: piaObj.openedDate || ((piaObj.history&&piaObj.history.length)?piaObj.history[0].date:null)}
    : null;

  if (!closedFull.length && !traspasos.length && !piaClosed) {
    return `<div style="max-width:480px;margin:60px auto;text-align:center;color:#64748b">
      <div style="font-size:40px;margin-bottom:12px">📜</div>
      <div style="font-size:15px;color:#94a3b8;margin-bottom:6px">${T('historyEmpty')}</div>
      <div style="font-size:12px">${T('historyEmptyHint')}</div>
    </div>`;
  }

  // Helper: holding period from first buy tx to close date
  const holdingDays = (txs, closeDate) => {
    if (!txs || !txs.length) return null;
    const buys = txs.filter(t=>t.a==='Buy'||t.a==='Traspaso In').map(t=>parseD(t.d)).sort((a,b)=>a-b);
    if (!buys.length || !closeDate) return null;
    const ms = parseD(closeDate) - buys[0];
    return Math.round(ms / (1000*60*60*24));
  };
  const fmtDuration = days => {
    if (days==null) return '—';
    if (days < 60) return `${days} ${T('days')}`;
    const months = Math.round(days/30.44);
    if (months < 24) return `${months} ${T('months')}`;
    return `${(days/365.25).toFixed(1)} ${T('years')}`;
  };

  // ── Closed positions section ──
  const piaHeld = piaClosed ? fmtDuration(piaClosed.start ? Math.round((parseD(piaClosed.date)-parseD(piaClosed.start))/(1000*60*60*24)) : null) : '—';
  const piaRow = piaClosed ? `<tr style="border-top:1px solid #1e293b">
    <td style="padding:7px 8px"><div style="font-weight:600;color:#e2e8f0;display:flex;align-items:center;gap:6px">PIAS BBVA <span style="font-size:9px;font-weight:600;padding:1px 6px;border-radius:3px;background:#78350f;color:#fbbf24">${T('redeemedTag')}</span></div><div style="font-size:10px;color:#64748b">BBVA · €${e2(piaClosed.invested)} → €${e2(piaClosed.received)}</div></td>
    <td class="mn" style="padding:7px 8px;text-align:right;color:#475569">—</td>
    <td class="mn" style="padding:7px 8px;text-align:right;color:#475569">—</td>
    <td class="mn" style="padding:7px 8px;text-align:right;color:#475569">—</td>
    <td class="mn" style="padding:7px 8px;text-align:right;color:#94a3b8">${piaClosed.date?fmtD(parseD(piaClosed.date)):'—'}</td>
    <td style="padding:7px 8px;text-align:right;color:#94a3b8">${piaHeld}</td>
    <td class="mn" style="padding:7px 8px;text-align:right;font-weight:600;color:${piaClosed.pl>=0?'#34d399':'#f87171'}">${piaClosed.pl>=0?'+':'-'}€${e2(Math.abs(piaClosed.pl))}<div style="font-size:10px;font-weight:400">${pct(piaClosed.invested>0?piaClosed.pl/piaClosed.invested:0)}</div></td>
  </tr>` : '';
  const closedCount = closedFull.length + (piaClosed?1:0);
  const closedSection = (closedFull.length || piaClosed) ? `

            <th style="padding:6px 8px;text-align:right">${T('qty')}</th>

            <th style="padding:6px 8px;text-align:right">${T('exitPrice')}</th>
            <th style="padding:6px 8px;text-align:right">${T('closedOn')}</th>
            <th style="padding:6px 8px;text-align:right">${T('historyHeld')}</th>
            <th style="padding:6px 8px;text-align:right">P&amp;L</th>
          </tr></thead>
          <tbody>
            ${closedFull.map(c=>{
              const held = fmtDuration(holdingDays(c.txs, c.date));
              return `<tr style="border-top:1px solid #1e293b">
                <td style="padding:7px 8px"><div style="font-weight:600;color:#e2e8f0">${esc(c.name)}</div>${c.platform?`<div style="font-size:10px;color:#64748b">${c.platform}</div>`:''}</td>
                <td class="mn" style="padding:7px 8px;text-align:right">${e3(c.qty)}</td>
                <td class="mn" style="padding:7px 8px;text-align:right">€${e2(c.buy)}</td>

                <td class="mn" style="padding:7px 8px;text-align:right;color:#94a3b8">${c.date?fmtD(parseD(c.date)):'—'}</td>
                <td style="padding:7px 8px;text-align:right;color:#94a3b8">${held}</td>
                <td class="mn" style="padding:7px 8px;text-align:right;font-weight:600;color:${c.pl>=0?'#34d399':'#f87171'}">${c.pl>=0?'+':'-'}€${e2(c.pl)}<div style="font-size:10px;font-weight:400">${pct(c.plPct)}</div></td>
              </tr>`;
            }).join('')}${piaRow}
          </tbody>
        </table>

  // ── Traspasos section ──
  const traspasoSection = traspasos.length ? `
    <div class="card">
      <div class="card-ttl">${T('historyTraspasoTitle')} <span style="font-size:11px;color:#64748b;font-weight:400">(${traspasos.length})</span></div>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:12px">
          <thead><tr style="color:#64748b;text-align:left">
            <th style="padding:6px 8px">${T('traspasoFrom')}</th>
            <th style="padding:6px 8px">${T('traspasoTo')}</th>
            <th style="padding:6px 8px;text-align:right">${T('date')}</th>
            <th style="padding:6px 8px;text-align:right">${T('historyHeld')}</th>

          </tr></thead>
          <tbody>
            ${traspasos.map((tr,revIdx)=>{
              const realIdx = TRASPASADO.length - 1 - revIdx;
              const held = fmtDuration(holdingDays(tr.txs, tr.date));
              const hasVals = tr.invested!=null && tr.marketValue!=null;
              const latent = hasVals ? tr.marketValue - tr.invested : null;
              return `<tr style="border-top:1px solid #1e293b">
                <td style="padding:7px 8px;font-weight:600;color:#e2e8f0">${tr.name}</td>
                <td style="padding:7px 8px;color:#60a5fa">↩ ${tr.toName||'—'}</td>
                <td style="padding:7px 8px;text-align:right;color:#94a3b8">${tr.date?fmtD(parseD(tr.date)):'—'}</td>
                <td style="padding:7px 8px;text-align:right;color:#94a3b8">${held}</td>

        </table>
      </div>
      <div style="font-size:11px;color:#64748b;margin-top:10px">${T('historyTraspasoNote')}</div>
    </div>` : '';

  return closedSection + traspasoSection;
}

// ─── VENTAJA FISCAL (INDRA) ──────────────────────────────────────────────────

const VF_DEFAULTS = {
  sharesQty: 185,          // number of Indra shares received
  tradeValue: 9997.90,     // total trade value at grant
  tramo: 37,               // marginal IRPF rate %
  grossSalary: 58399.38,   // gross salary
  irpfFull: 14109.30,      // IRPF on full salary
  irpfReduced: 10664.50,   // IRPF on salary minus trade value
};

let vfInputs = {...VF_DEFAULTS};

function calcVF() {
  const { sharesQty, tradeValue, tramo, grossSalary, irpfFull, irpfReduced } = vfInputs;
  // Get current Indra price from positions
  const indra = positions.find(p=>p.id==='indra');
  const currentPrice = indra ? indra.price : 0;

  // Scenario 1 — flat marginal rate
  const s1Tax   = tradeValue * (tramo / 100);
  const s1Net   = tradeValue - s1Tax;
  const s1Price = sharesQty > 0 ? s1Net / sharesQty : 0;
  const s1Gain  = (currentPrice * sharesQty) - s1Net;
  const s1GainP = s1Net > 0 ? s1Gain / s1Net * 100 : 0;

  // Scenario 2 — actual IRPF difference
  const s2Tax   = irpfFull - irpfReduced;
  const s2Net   = tradeValue - s2Tax;
  const s2Price = sharesQty > 0 ? s2Net / sharesQty : 0;
  const s2Gain  = (currentPrice * sharesQty) - s2Net;
  const s2GainP = s2Net > 0 ? s2Gain / s2Net * 100 : 0;

  return { s1Tax, s1Net, s1Price, s1Gain, s1GainP,
           s2Tax, s2Net, s2Price, s2Gain, s2GainP,
           currentPrice };
}

function renderVFBody() {
  const r = calcVF();
  const indra = positions.find(p=>p.id==='indra');
  const inp = (id, val, step='0.01') =>
    `<input type="number" step="${step}" value="${val}"
      style="width:120px;background:#0f172a;border:1px solid #334155;border-radius:5px;padding:3px 7px;font-size:12px;color:#f1f5f9;font-family:ui-monospace,'Cascadia Code','SF Mono','JetBrains Mono',Consolas,monospace;font-variant-numeric:tabular-nums;text-align:right"

function applyBulkPrices() {
  let updated = 0;

  // Update positions — each uses its own date
  positions = positions.map(p => {
    const inp = document.getElementById('bpu_' + p.id);
    if (!inp || !inp.value.trim()) return p;
    const price = parseFloat(inp.value.replace(',','.'));
    if (isNaN(price) || price <= 0) return p;
    const dateInp = document.getElementById('bpu_date_' + p.id);
    const dateStr = htmlToInternal(dateInp ? dateInp.value : todayHTML());
    const ph = [...(p.priceHistory||[])];
    const idx = ph.findIndex(h=>h.d===dateStr);
    if (idx >= 0) ph[idx] = {d:dateStr, p:price}; else ph.push({d:dateStr, p:price});
    updated++;
    return syncCurrentPrice({...p, priceHistory:ph});
  });

  // Update benchmark
  const bmInp = document.getElementById('bpu_benchmark');
  if (bmInp && bmInp.value.trim()) {
    const bmPrice = parseFloat(bmInp.value.replace(',','.'));
    if (!isNaN(bmPrice) && bmPrice > 0) {
      const bmDateInp = document.getElementById('bpu_date_benchmark');
      const bmDateStr = htmlToInternal(bmDateInp ? bmDateInp.value : todayHTML());
      const idx = benchmarkData.findIndex(h=>h.d===bmDateStr);
      if (idx >= 0) benchmarkData[idx].p = bmPrice;
      else benchmarkData.push({d:bmDateStr, p:bmPrice});
      benchmarkData.sort((a,b)=>parseD(a.d)-parseD(b.d));
      updated++;
    }
  }

  if (updated > 0) {
    markDirty();
    const n = document.getElementById('notif');
    n.textContent = `${updated} price${updated!==1?'s':''} updated`;
    n.classList.add('show');
    setTimeout(()=>n.classList.remove('show'), 1800);
  }
  closeBulkPrices();
  render();
}

function updateTraspasoSuggestion() {
  const f = state.traspasoForm;
  const fromPos = positions.find(p=>p.id===f.fromId);
  if(!fromPos) return;
  const qtyOut     = parseFloat(f.qtyOut||0);
  const marketPrice= parseFloat(f.marketPrice||0);
  const priceB     = parseFloat(f.priceB||0);
  const fmt = (n,d) => isNaN(n)||n===0 ? '—' : n.toLocaleString(NL(),{minimumFractionDigits:d,maximumFractionDigits:d});

  const transferValue = qtyOut > 0 && marketPrice > 0 ? qtyOut * marketPrice : 0;
  const qtyIn         = transferValue > 0 && priceB > 0 ? transferValue / priceB : 0;
  const fiscalCost    = qtyIn > 0 ? (fromPos.avgFill * qtyOut) / qtyIn : 0;

  // Update computed display cells
  const set = (id, val) => { const el=document.getElementById(id); if(el) el.textContent=val; };
  set('tr-transfer-value', transferValue > 0 ? `€${fmt(transferValue,2)}` : '—');

  set('tr-fiscal-cost',    fiscalCost > 0 ? `€${fmt(fiscalCost,4)}` : '—');

  // Store computed values for applyTraspaso
  state.traspasoForm._qtyIn      = qtyIn;
  state.traspasoForm._fiscalCost = fiscalCost;
}

function applyTraspaso() {
  const f = state.traspasoForm;
  const qtyOut     = parseFloat(f.qtyOut||0);
  const marketPrice= parseFloat(f.marketPrice||0);
  const priceB     = parseFloat(f.priceB||0);
  const qtyIn      = f._qtyIn||0;
  const fiscalCost = f._fiscalCost||0;
  const fromPos = positions.find(p=>p.id===f.fromId);

  if(!f.toId||qtyOut<=0||marketPrice<=0||priceB<=0||qtyIn<=0){alert(T('txError'));return}
  if(qtyOut > fromPos.qty + 0.00001){alert(T('sellExceedsQty'));return}

  const d = htmlToInternal(f.date);
  const isTotalClose = Math.abs(qtyOut - fromPos.qty) < 0.00001;

  // Traspaso Out on source — reduce at avg cost (both real and fiscal use same basis here)
  const outTx = {d,a:'Traspaso Out',q:qtyOut,p:fromPos.avgFill,c:0,mv:parseFloat((qtyOut*marketPrice).toFixed(4))};
  if(isTotalClose){
    // Archive the full transaction history so it's not lost (for future FIFO/tax calc)
    TRASPASADO.push({
      name: fromPos.name,
      isin: fromPos.isin||'',
      date: d,
      toName: (positions.find(p=>p.id===f.toId)||{}).name || '',
      qty: qtyOut,
      invested: parseFloat(fromPos.invested.toFixed(4)),     // original cost basis
      marketValue: parseFloat((qtyOut*marketPrice).toFixed(4)), // market value at transfer
      avgCost: fromPos.avgFill,
      marketPrice: marketPrice,
      fiscalInvested: fromPos.fiscalInvested!=null ? fromPos.fiscalInvested : fromPos.invested,
      txs: [...fromPos.txs, outTx]
    });
    positions = positions.filter(p=>p.id!==f.fromId);
  } else {
    positions = positions.map(p=>{
      if(p.id!==f.fromId) return p;
      const nq = p.qty - qtyOut;
      const fInv = (p.fiscalInvested!=null ? p.fiscalInvested : p.invested);
      const nfInv = nq>0 ? (fInv/p.qty)*nq : 0; // reduce fiscal basis proportionally
      return {...p, qty:nq, invested:p.avgFill*nq, fiscalInvested:nfInv, txs:[...p.txs,outTx]};
    });
  }
  // Traspaso In on destination
  // avgFill (market) uses REAL purchase price (priceB) → matches MyInvestor
  // fiscalInvested uses inherited fiscal cost → for tax estimation
  positions = positions.map(p=>{
    if(p.id!==f.toId) return p;
    const nq = p.qty + qtyIn;
    const ni = p.invested + qtyIn*priceB;          // real invested (market)
    const na = ni/nq;                               // avg cost shown in UI
    const prevFiscal = (p.fiscalInvested!=null ? p.fiscalInvested : p.invested);
    const nfInv = prevFiscal + qtyIn*fiscalCost;    // fiscal invested
    return {...p, qty:nq, invested:ni, avgFill:na, fiscalInvested:nfInv, txs:[...p.txs,{d,a:'Traspaso In',q:qtyIn,p:priceB,fiscalCost:fiscalCost,c:0}]};
  });
  markDirty();
  closeTraspaso();
  state.selectedId = f.toId;
  render();
}

function closeShortcuts() {
  document.getElementById('shortcutsModal').classList.remove('open');
}

document.addEventListener('keydown', e => {
  // Don't fire when typing in an input/textarea
  const tag = document.activeElement.tagName;
  const typing = ['INPUT','TEXTAREA','SELECT'].includes(tag);

  // Esc always works
  if (e.key === 'Escape') {
    if (document.getElementById('ventajaModal').classList.contains('open')) { closeVentajaFiscal(); return; }
    if (document.getElementById('guideModal').classList.contains('open')) { closeGuide(); return; }
    if (document.getElementById('shortcutsModal').classList.contains('open')) { closeShortcuts(); return; }
    if (document.getElementById('refreshReportModal').classList.contains('open')) { closeRefreshReport(); return; }
    if (document.getElementById('syncModal').classList.contains('open')) { closeSyncModal(); return; }
    if (document.getElementById('settingsModal').classList.contains('open')) { closeSettings(); return; }
    if (document.getElementById('bulkPriceModal').classList.contains('open')) { closeBulkPrices(); return; }
    if (state.editingId) { ce(); return; }
    if (state.editingOther) { state.editingOther=null; render(); return; }
    if (state.showAddTx) { state.showAddTx=false; render(); return; }
    if (state.showAddPosition) { state.showAddPosition=false; render(); return; }
    if (state.editingNotes) { state.editingNotes=false; render(); return; }
    if (state.selectedId) { selectPos(null); return; }
    return;
  }
  if (typing) return;

  if (e.key === '?') { e.preventDefault(); openShortcuts(); return; }
  if (e.key.toLowerCase() === ',') { e.preventDefault(); openSettings(); return; }
  if (e.key.toLowerCase() === 's' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); saveData(); return; }
  if (e.key.toLowerCase() === 'g') { e.preventDefault(); document.getElementById('guideModal').classList.contains('open') ? closeGuide() : openGuide(); return; }
  if (e.key.toLowerCase() === 'e' && !e.ctrlKey && !e.metaKey) { e.preventDefault(); exportData(); return; }
  if (e.key.toLowerCase() === 'i') { e.preventDefault(); document.getElementById('importFile').click(); return; }
  if (e.key.toLowerCase() === 'd') { e.preventDefault(); toggleDemo(); return; }
});

<div class="gd-sec" id="g_intro">
