<div class="gd-sec" id="g_start">
  <div class="gd-sec-hd"><div class="gd-h2">Getting started</div></div>
  <ol class="gd-ol">
    <li class="gd-li">Open the app and go to the <span class="gd-b">Positions</span> tab.</li>
    <li class="gd-li">Use <span class="gd-b">✕ Clear</span> in the header to wipe all data and return to the welcome screen. Use Import to restore from a backup.</li>
    <li class="gd-li">Click into each position to access transaction history, price history, tags, notes, and currency.</li>
    <li class="gd-li">In the <span class="gd-b">Other</span> tab, update the Pension Pot and PIAS values.</li>
    <li class="gd-li">Click <span class="gd-b">↓ Export</span> to save a backup JSON file.</li>
  </ol>
  <div class="gd-callout tip"><div class="gd-clbl">💡 Tip</div><p class="gd-p">Try everything in Demo mode first before touching your real data. Demo mode has its own separate storage.</p></div>
</div>

<div class="gd-sec" id="g_overview">
  <div class="gd-sec-hd"><span class="gd-badge bl">Overview</span><div class="gd-h2">Overview tab</div></div>
  <p class="gd-p">The dashboard — the first thing you see when opening the app. Summarises the entire portfolio at a glance.</p>
  <div class="gd-h3">Summary cards</div>
  <ul class="gd-ul">
    <li class="gd-li"><span class="gd-b">Total invested</span> — cash put in across all included positions.</li>
    <li class="gd-li"><span class="gd-b">Current value</span> — current market value of those positions.</li>
    <li class="gd-li"><span class="gd-b">Unrealised P&amp;L</span> — current value minus invested, in € and %. Use the <span class="gd-b">All-time / current-year</span> toggle on the card to switch between the total P&amp;L since purchase and the year-to-date P&amp;L (see below).</li>
  </ul>
  <p class="gd-p">Use the <span class="gd-b">✓ ON / — OFF</span> toggles in the Portfolio Breakdown card to include or exclude the Pension Pot and PIAS from the summary figures.</p>
  <div class="gd-h3">All-time vs Year-to-date toggle</div>
  <p class="gd-p">A single <span class="gd-b">All-time / current-year</span> toggle in the Portfolio Breakdown card controls the entire Overview at once, switching between two views:</p>
  <ul class="gd-ul">
    <li class="gd-li"><span class="gd-b">All-time</span> — P&amp;L since first purchase for every position. This is the default.</li>
    <li class="gd-li"><span class="gd-b">Current year</span> — Year-to-date P&amp;L. For each open position, this measures the change in unrealised gain from 1 January to today. Positions opened this year show their full P&amp;L (since they didn't exist at year start). For positions held since a prior year (e.g. Quality Conservadora), the YTD is computed as: unrealised today − unrealised on 1 January, using the nearest price entry in your price history as the year-start reference. Pension Pot is included if it has a price entry within 60 days of 1 January. PIAS is excluded if its history starts after January. The Realised P&amp;L section filters to show only sells closed in the current calendar year.</li>
  </ul>
  <p class="gd-p">The same toggle also applies to the <span class="gd-b">Position performance</span> ranking — in YTD mode, positions are ranked by their year-to-date return instead of all-time return.</p>
  <div class="gd-callout info"><div class="gd-clbl">ℹ Accuracy of YTD</div><p class="gd-p">YTD accuracy depends on having a price entry near 1 January in your price history. If no entry exists within 60 days of 1 January, the position falls back to all-time P&amp;L and a <span style="color:#f59e0b">⚠</span> warning appears. For prior-year positions, add a weekly price log from December onwards to ensure accurate YTD calculations.</p></div>
  <div class="gd-h3">Open positions allocation</div>
  <p class="gd-p">A donut chart showing capital distribution. Each slice is <span class="gd-b">clickable</span> and navigates directly to that position's detail. Hover over a slice to see the name and percentage.</p>
  <div class="gd-h3">Position performance</div>
  <p class="gd-p">All open positions ranked by unrealised return, best to worst (or YTD return in current-year mode). Clickable to navigate to position detail.</p>
  <div class="gd-h3">Realised P&amp;L</div>
  <p class="gd-p">In the Portfolio Breakdown card, the Realised P&amp;L section sums the profit from closed sells, grouped by position. In All-time mode it shows every sell ever made; in current-year mode it shows only sells closed this calendar year — the figure relevant to this year's tax return. Below the total, a <span class="gd-b">Net (after est. IRPF)</span> line applies the same Spanish tax estimate used in the Realised tab (see <span class="gd-b">After-tax P&amp;L</span> below) — this is the figure that matters when weighing whether to close another position. Bankinter interest income is shown separately below, and follows the <span class="gd-b">same All-time / current-year toggle</span>, so both blocks always cover the same period; the net interest is shown in bold, matching the emphasis on the net realised figure above it.</p>
</div>

<div class="gd-sec" id="g_positions">
  <div class="gd-sec-hd"><span class="gd-badge gr">Positions</span><div class="gd-h2">Positions tab</div></div>
  <p class="gd-p">Lists all open positions. Each card shows qty, avg fill price (PMC), current price with staleness badge, value, P&amp;L, XIRR, TER, platform, and tags.</p>
  <div class="gd-h4">Staleness badge</div>
  <ul class="gd-ul">
    <li class="gd-li"><span class="gd-b" style="color:#34d399">Green</span> — updated today or within 3 days</li>
    <li class="gd-li"><span class="gd-b" style="color:#fbbf24">Orange</span> — 4–7 days old</li>
    <li class="gd-li"><span class="gd-b" style="color:#f87171">Red</span> — more than 7 days old</li>
  </ul>
  <div class="gd-h3">Position detail</div>
  <ul class="gd-ul">
    <li class="gd-li"><span class="gd-b">Header card</span> — qty, avg cost, invested, current value, XIRR, total dividends. Editable price + date.</li>
    <li class="gd-li"><span class="gd-b">Transaction history</span> — every buy, sell, and dividend with running totals (cumulative qty, avg fill, total invested). Rows are editable (✎) and deletable (✕).</li>
    <li class="gd-li"><span class="gd-b">Notes</span> — free text for investment thesis, reminders, entry rationale.</li>
    <li class="gd-li"><span class="gd-b">Tags</span> — add/remove tags, set the primary tag for rebalancing (see Analysis).</li>
    <li class="gd-li"><span class="gd-b">Price history</span> — collapsible table of all recorded prices, editable and deletable per row.</li>
  </ul>
  <div class="gd-h3">Transaction types</div>
  <ul class="gd-ul">
    <li class="gd-li"><span class="gd-b">Buy</span> — enter qty, price, commission. Updates qty, avg fill price, and invested.</li>
    <li class="gd-li"><span class="gd-b">Sell (partial)</span> — qty ≤ current holdings. Reduces qty, keeps avg fill price, adds entry to Realised tab.</li>
    <li class="gd-li"><span class="gd-b">Sell (total)</span> — qty equals current holdings. Closes the position and moves it to Realised.</li>
    <li class="gd-li"><span class="gd-b">Dividend</span> — enter total amount received. Does not affect qty or cost basis. Included in XIRR.</li>
  </ul>
  <div class="gd-h3">Traspaso (fund transfer)</div>
  <p class="gd-p">In Spain, fund-to-fund transfers (traspasos) are fiscally neutral — no IRPF is triggered at the time of transfer. The fiscal cost of the source fund is inherited by the destination fund. Use the <span class="gd-b">⇄ Traspaso</span> button in the transaction history of the source fund to open the traspaso modal.</p>
  <p class="gd-p">You only need to enter <strong>3 values</strong>:</p>
  <ul class="gd-ul">
    <li class="gd-li"><span class="gd-b">Units transferred out</span> — how many units you are moving from Fund A. Use the <span class="gd-b">All</span> button to fill in the full holding automatically for a complete transfer.</li>
    <li class="gd-li"><span class="gd-b">Market price at transfer</span> — the NAV of Fund A on the transfer date. Used to compute the transfer value.</li>
    <li class="gd-li"><span class="gd-b">Price / unit Fund B</span> — the NAV of Fund B on the transfer date. Used to compute units received.</li>
  </ul>
  <p class="gd-p">Everything else is calculated automatically: transfer value (units × market price), units received (transfer value ÷ price B), and inherited fiscal cost per unit. The traspaso creates a <span class="gd-b">↪ Out</span> transaction on Fund A and a <span class="gd-b">↩ In</span> transaction on Fund B, and <strong>does not generate any entry in the Realised tab</strong>.</p>
  <div class="gd-h3">Market cost vs fiscal cost</div>
  <p class="gd-p">After a traspaso, Fund B's <span class="gd-b">avg cost</span> is computed from the <span class="gd-b">real purchase price</span> (Fund B's NAV) — so it matches what your broker (e.g. MyInvestor) shows. Separately, the app tracks the <span class="gd-b" style="color:#a78bfa">fiscal cost</span> — the inherited cost basis that Hacienda uses to compute your capital gain on a future sale. When these two differ, a purple <span class="gd-b" style="color:#a78bfa">Fiscal cost</span> figure appears in the position detail header (hover it for an explanation).</p>
  <div class="gd-callout tip"><div class="gd-clbl">💡 Example</div><p class="gd-p">100 units of Fund A · avg cost €11,62 · market price at transfer €11,85 · Fund B price €5,00<br><br>
  → Transfer value: 100 × €11,85 = <strong>€1.185,00</strong><br>
  → Units received: €1.185,00 ÷ €5,00 = <strong>237 units</strong><br>
  → Fund B avg cost (market): <strong>€5,00</strong> (matches your broker)<br>
  → Fund B fiscal cost/unit: €11,62 × 100 ÷ 237 = <strong>€4,90</strong> (for tax)</p></div>
  <div class="gd-callout warn"><div class="gd-clbl">⚠ Tax note</div><p class="gd-p">The fiscal cost is what Hacienda considers the acquisition cost. When you eventually sell Fund B, your taxable gain will be calculated from the fiscal cost, not from the market avg cost shown in the card.</p></div>
</div>

<div class="gd-sec" id="g_realised">
  <div class="gd-sec-hd"><span class="gd-badge am">Realised</span><div class="gd-h2">Realised tab</div></div>
  <p class="gd-p">Tracks all exits — full closes and partial sells. Entries are <span class="gd-b">grouped by position</span>: the card header shows the combined P&L across all sells for that position. If there are multiple sells, click the <span class="gd-b">▶ arrow</span> to expand and see each individual transaction. The <span class="gd-b">Show after-tax (IRPF)</span> toggle shows net figures. Traspaso transactions do not appear here. A fully-redeemed <span class="gd-b">PIAS</span> also appears here as a dedicated card (orange border) with invested, amount received, date and realised result; its gain is included in the headline total but excluded from the IRPF estimate (different tax regime).</p>
  <div class="gd-h3">Interest income (Bankinter)</div>
  <p class="gd-p">At the bottom of the Realised tab, the Bankinter Interest-bearing Account section tracks monthly interest payments (gross and net). Add each payment with its date and amounts. These are kept separate from capital gains as they have different tax treatment in Spain.</p>
</div>

<div class="gd-sec" id="g_history">
  <div class="gd-sec-hd"><span class="gd-badge am">History</span><div class="gd-h2">History tab</div></div>
  <p class="gd-p">A historical archive of positions you no longer hold. Unlike the Realised tab (which focuses on P&L grouped by position), the History tab shows the full lifecycle of each exit.</p>
  <div class="gd-h3">Closed positions</div>
  <p class="gd-p">Positions sold completely (100%) appear here with quantity, entry and exit prices, close date, <span class="gd-b">holding period</span> (from first purchase to close), and final P&L. The holding period is computed from the saved transaction history. A fully-redeemed <span class="gd-b">PIAS</span> appears in this table too, marked with a badge: it has no per-unit quantity or prices (shown as "—"), but the subtitle shows invested → received, and the holding period is computed from the opening date entered at redemption.</p>
  <div class="gd-h3">Completed traspasos</div>
  <p class="gd-p">Fund transfers where the entire holding was moved appear here — showing the source fund, destination fund, date and holding period. They also show data that exists nowhere else in the app: the <span class="gd-b">invested</span> amount (original cost basis), the <span class="gd-b">market value</span> at the time of transfer, and the <span class="gd-b">latent gain/loss</span> (the difference — whether you transferred at a profit or loss). Since traspasos are fiscally neutral and don't appear in the Realised tab, this is the only place to review your transfer history.</p>
  <div class="gd-callout info"><div class="gd-clbl">ℹ Holding period and values availability</div><p class="gd-p">Holding period, invested amount, market value and latent gain/loss are only available for positions and traspasos completed after these features were added, since they require the full transaction history to be archived. Earlier entries show "—".</p></div>
</div>

<div class="gd-sec" id="g_other">
  <div class="gd-sec-hd"><span class="gd-badge pu">Other</span><div class="gd-h2">Other tab</div></div>
  <p class="gd-p">Manages assets that don't follow the standard buy/sell model: the UK Pension Pot (GBP) and PIAS BBVA.</p>
  <div class="gd-h3">Pension Pot UK</div>
  <p class="gd-p">Click ✎ on <span class="gd-b">Current value (£)</span> to update the GBP value and date. Click ✎ on <span class="gd-b">GBP/EUR Rate</span> to update the exchange rate. EUR value is calculated automatically as <code class="gd-code">GBP × rate</code>. The valuation history (▼ toggle) shows all historical snapshots — each row is editable and deletable.</p>
  <div class="gd-h3">PIAS BBVA</div>
  <p class="gd-p">Update <span class="gd-b">Current value</span> and <span class="gd-b">Total invested</span> when you receive a statement or make a contribution. The date of the last update is shown under the current value.</p>
  <div class="gd-h3">🏦 Liquidate (full redemption)</div>
  <p class="gd-p">When you fully redeem the PIAS, click <span class="gd-b">🏦 Liquidate (full redemption)</span> on its card. The form asks for the <span class="gd-b">amount received</span> (pre-filled with the current value — enter the actual net amount you received), the <span class="gd-b">opening date</span> (used to compute the holding period; pre-filled from the first valuation on record, correct it if the plan started earlier), and the <span class="gd-b">redemption date</span>. On confirm, the PIAS becomes a closed investment:</p>
  <ul class="gd-ul">
    <li class="gd-li">It <span class="gd-b">leaves the portfolio value</span> — no longer counted in totals or shown in the Portfolio Breakdown.</li>
    <li class="gd-li">Its realised gain/loss (amount received − invested) joins <span class="gd-b">Realised P&L</span> in the Overview, the <span class="gd-b">Realised tab</span> (dedicated card, orange border), and the <span class="gd-b">History tab</span> (row in the closed positions table with badge, dates and holding period).</li>
    <li class="gd-li">It <span class="gd-b">disappears from the Other tab</span>, exactly as a fully-sold position disappears from Positions. If you redeemed it by mistake, the <span class="gd-b">↩ Undo</span> button on its card in the Realised tab puts it back.</li>
  </ul>
  <div class="gd-callout warn"><div class="gd-clbl">⚠ PIAS taxation</div><p class="gd-p">A PIAS redeemed <span class="gd-b">as capital</span> (a lump sum) is taxed as <span class="gd-b">rendimiento del capital mobiliario</span> in the savings base — the <span class="gd-b">same 19/21/23% brackets as securities</span> — so its gain is <span class="gd-b">included in the IRPF estimate</span> together with your closed positions. The special exemption only applies to a different case: a PIAS held 5+ years and redeemed as a <span class="gd-b">lifetime annuity</span> (renta vitalicia), which this estimate does not model. Figures are an estimate — confirm with a tax adviser.</p></div>
</div>

<div class="gd-sec" id="g_analysis">
  <div class="gd-sec-hd"><span class="gd-badge cy">Analysis</span><div class="gd-h2">Analysis tab</div></div>
  <p class="gd-p">Slice your portfolio by tag groups or ad-hoc selections. Each group card shows: total invested, current value, weight, weighted avg TER, number of positions, P&amp;L, XIRR per position, and a target deviation bar if a target has been set.</p>
  <div class="gd-h3">Tags &amp; primary tags</div>
  <p class="gd-p">Tags are labels you assign to positions for grouping and analysis. A position can have multiple tags — but for <span class="gd-b">rebalancing purposes</span>, each position should count only once. This is solved with the <span class="gd-b">primary tag</span>: the single tag used to classify a position in the rebalancing calculator.</p>
  <div class="gd-callout tip"><div class="gd-clbl">💡 Best practice</div><p class="gd-p">Use one set of tags for asset class (e.g. <code class="gd-code">Equity</code>, <code class="gd-code">Conservative</code>, <code class="gd-code">Stock</code>) as primary tags, and another set for platform or geography as secondary tags. Set primary tag targets to sum to exactly 100%.</p></div>
  <p class="gd-p">To set a primary tag: open a position detail → scroll to the Tags card → click a tag in the <span class="gd-b">★ Primary tag</span> row. It turns gold. Positions without a primary tag are excluded from rebalancing and shown in a warning banner.</p>
  <div class="gd-h3">Target allocation</div>
  <p class="gd-p">Click any tag button in the Target allocation card to set a target %. The running <span class="gd-b">Σ</span> shows the sum of all targets — aim for exactly 100%. Each group card then shows a progress bar labelled <em>On target</em>, <em>Overweight</em>, or <em>Underweight</em>.</p>
  <div class="gd-h3">Rebalancing calculator</div>
  <p class="gd-p">Enter a cash amount in <span class="gd-b">Cash to invest</span>. The calculator groups positions by primary tag only (no double-counting), computes how much each tag needs to reach its target, scales suggestions proportionally if cash is less than needed, and shows deviation before → after.</p>
  <div class="gd-callout warn"><div class="gd-clbl">⚠ Note on convergence</div><p class="gd-p">Deviation only reaches zero if: every position has a primary tag, all targets sum to 100%, and the cash amount is large enough to fill all gaps simultaneously. With smaller amounts, you'll see a proportional improvement, not full convergence.</p></div>
  <div class="gd-h3">Ad-hoc mode</div>
  <p class="gd-p">Click <span class="gd-b">Ad-hoc</span> in the mode bar to select any combination of positions by clicking their chips. Useful for one-off comparisons without creating a tag.</p>
</div>

<div class="gd-sec" id="g_charts">
  <div class="gd-sec-hd"><span class="gd-badge bl">Charts</span><div class="gd-h2">Charts tab</div></div>
  <ul class="gd-ul">
    <li class="gd-li"><span class="gd-b">Time range</span> — use the <span class="gd-b">1M / 3M / 6M / 1Y / 3Y / All</span> buttons below the chart mode selector to zoom into a specific period. On the % change chart, the start of the selected window is rebased to 0% so you see performance within that period, not from inception.</li>
    <li class="gd-li"><span class="gd-b">Price % change</span> — all selected positions normalised to 0% from their first visible price in the selected range. Compare relative performance regardless of absolute price. White dashed line = S&amp;P 500 benchmark (if data entered).</li>
    <li class="gd-li"><span class="gd-b">Unrealised P&amp;L (€)</span> — P&amp;L evolution over time. With multiple positions selected, a Combined P&amp;L chart appears below.</li>
    <li class="gd-li"><span class="gd-b">Contributions</span> — cumulative invested (blue) vs estimated portfolio value (green). The gap is your unrealised gain over time. Filterable by position or tag.</li>
    <li class="gd-li"><span class="gd-b">Pension Pot</span> — GBP and EUR value over time, plus P&amp;L vs invested in euros.</li>
  </ul>
  <div class="gd-callout info"><div class="gd-clbl">ℹ Benchmark data</div><p class="gd-p">S&amp;P 500 benchmark data is entered manually via the benchmark management card below the Price % change chart. Add data points (date + index value) to build the reference line.</p></div>
</div>

<div class="gd-sec" id="g_currency">
  <div class="gd-sec-hd"><span class="gd-badge re">Currency</span><div class="gd-h2">Currency tab</div></div>
  <p class="gd-p">Shows FX exposure across EUR, USD, GBP, etc. Summary cards show value, % of portfolio, and FX risk label per currency. The table at the bottom lets you set the currency per position and mark it as <span class="gd-b">Hedged</span> — hedged positions count as EUR exposure regardless of their underlying currency.</p>
</div>

<div class="gd-sec" id="g_autofetch">
  <div class="gd-sec-hd"><div class="gd-h2">Tickers &amp; automatic price fetching</div></div>
  <p class="gd-p">Each position can have these fields in the <span class="gd-b">Tags card</span> of the position detail:</p>
  <ul class="gd-ul">
    <li class="gd-li"><span class="gd-b">📈 Yahoo Finance ticker</span> (e.g. <code class="gd-code">IDR.MC</code>, or <code class="gd-code">0P00000RN9.F</code> for a mutual fund) — used by the <span class="gd-b">↻ Refresh</span> button. Once set, the ticker also appears as a clickable badge in the position header, and as a <span class="gd-b">↗</span> link next to the field: both open the Yahoo Finance quote page in a new tab.</li>
    <li class="gd-li"><span class="gd-b">🔗 Info URL</span> — a free-text link to any webpage with information about the position (e.g. an FT fund page, Morningstar factsheet, fund provider page). Once set, a <span class="gd-b">🔗 Info ↗</span> badge appears in the position header for quick access. Useful for funds that are not on Yahoo Finance.</li>
  </ul>
  <div class="gd-callout tip"><div class="gd-clbl">💡 Finding the right Yahoo symbol</div><p class="gd-p">For stocks and ETFs, search the name on <a href="https://finance.yahoo.com" style="color:#60a5fa">finance.yahoo.com</a> — Madrid listings use <code class="gd-code">.MC</code>, Paris <code class="gd-code">.PA</code>, Milan <code class="gd-code">.MI</code>. For mutual funds (Vanguard, Fidelity, BBVA…), search your fund's <span class="gd-b">ISIN</span> instead of its name — Yahoo will surface a symbol starting with <code class="gd-code">0P</code>, which points to the official NAV. Some funds also show a second, exchange-listed result (e.g. an <code class="gd-code">.SG</code> Stuttgart quote) — that's a market price, not the NAV; prefer the <code class="gd-code">0P…</code> symbol so it matches what your broker reports. Confirm you picked the right share class by checking that the ISIN on the Yahoo page matches your broker's.</p></div>
  <div class="gd-h3">↻ Refresh button</div>
  <p class="gd-p">The <span class="gd-b">↻ Refresh</span> button in the header fetches current prices for every position that has the relevant ticker set for the active source (configured in <span class="gd-b">⚙ Settings → Price fetch source</span>):</p>
  <ul class="gd-ul">
    <li class="gd-li"><span class="gd-b">Yahoo</span> — uses the 📈 Yahoo ticker. Since Yahoo's API doesn't allow direct browser requests, the fetch is routed through a chain of public CORS proxies, tried in order until one responds; it remembers which proxy last worked and tries that one first next time. Works from a locally opened file, no API key needed. Covers stocks, ETFs, and mutual fund NAVs (including European exchanges and funds with no exchange listing).</li>
    <li class="gd-li"><span class="gd-b">Manual only</span> — disables ↻ Refresh; prices are entered by hand only.</li>
  </ul>
  <div class="gd-h3">My proxy URL (optional)</div>
  <p class="gd-p">Public CORS proxies are shared with everyone, so they get rate-limited and slow at busy times. If you run your own proxy — a free <span class="gd-b">Cloudflare Worker</span>, or a <span class="gd-b">Netlify Function</span> if you host the app there — paste its address in <span class="gd-b">⚙ Settings → My proxy URL</span>. The proxy must accept the target as a <code class="gd-code">?url=</code> query parameter and return the response with an <code class="gd-code">Access-Control-Allow-Origin</code> header.</p>
  <ul class="gd-ul">
    <li class="gd-li">Once set, it becomes the <span class="gd-b">first route tried</span> for every quote, and — being dedicated — it is not serialized like the shared proxies, so fetches run in parallel and finish in seconds.</li>
    <li class="gd-li">The public proxies stay in place as an <span class="gd-b">automatic fallback</span>: if your proxy is unreachable it is deprioritized after a couple of failures and the refresh continues without it. Clearing the field restores the previous behaviour exactly.</li>
    <li class="gd-li">Use <span class="gd-b">Test proxy</span> next to the field to check it with a single known quote before relying on it.</li>
  </ul>
  <p class="gd-p">Requests are sent two at a time (never all at once) with at most one in-flight request per proxy backend — public proxies queue concurrent hits, so serializing them avoids self-inflicted timeouts. Every attempt has a hard <span class="gd-b">timeout</span> (8s; 4s quick probes for proxies that have been hanging; two passes in the final patient round — 12s then 24s per proven route — because a loaded proxy behaves like a lottery: a fresh attempt often succeeds instantly where a long single wait dies). Each proxy route has a session <span class="gd-b">health score</span>: successes move it up, timeouts move it down, and routes are always tried healthiest-first — so a dead proxy stops wasting time after a couple of failures, without ever being fully excluded. Failed positions are retried automatically: once after a short pause, and once more after a longer backoff for rate-limit-type failures. Positions with no ticker set for the active source are simply skipped.</p>
  <div class="gd-h3">Live status panel</div>
  <p class="gd-p">While a refresh runs, a small panel in the bottom-right corner shows one line per position with its live state — ○ queued, ◐ fetching, ✓ done (with the price), ⟳ retrying, ✗ failed — plus the current phase (fetching / retrying failed / waiting Ns). If a refresh ever feels slow, this panel tells you exactly what it's doing; it disappears when the refresh completes. The <span class="gd-b">✕ Cancel</span> button in the panel header stops the refresh immediately: prices already fetched are kept, pending positions are reported as <span class="gd-b">cancelled</span>, and a new refresh can be started right away. Clicking ↻ Refresh while one is already running does nothing (no accidental double refresh). If you press ↻ Refresh within <span class="gd-b">15 minutes</span> of the last successful refresh, a confirmation asks whether to proceed — fund NAVs update once a day and Yahoo's exchange quotes are ~15-min delayed, so back-to-back refreshes bring nothing new and only risk tripping the proxies' rate limits.</p>
  <div class="gd-h3">↻ Price refresh report</div>
  <p class="gd-p">After each refresh, a report opens listing every fetched position with its price, valuation date, and result:</p>
  <ul class="gd-ul">
    <li class="gd-li"><span class="gd-b gd-badge" style="background:#34d39922;color:#34d399;border:1px solid #34d39944">new</span> — no price existed yet for that date; the fetched value was added to the price history.</li>
    <li class="gd-li"><span class="gd-b" style="color:#60a5fa">updated</span> — a previously auto-fetched price for that same date was refreshed with the new value (typical for a listed stock/ETF refreshed more than once in the same day).</li>
    <li class="gd-li"><span class="gd-b" style="color:#f59e0b">kept manual</span> — a price you entered by hand already existed for that date. Manual entries always take precedence and are never overwritten by a fetch, even if the fetched value differs (e.g. your broker's 4-decimal NAV vs. Yahoo's 2-decimal figure) — the note under the badge shows both values so you can compare.</li>
    <li class="gd-li"><span class="gd-b" style="color:#2dd4bf">skipped</span> — the position is a mutual fund (0P… symbol) whose NAV cannot have changed since the last check, so no request is made. This happens when either you already hold the newest NAV that can exist yet (nothing has been published since), or you checked it less than two hours ago. In every other case the fund IS fetched again — including later the same day, so a NAV published during the afternoon is picked up by an evening refresh. Every attempt also carries a unique cache-busting parameter, so a proxy can never replay a stored response — including a stored failure such as a 408. Exception: if the stored NAV is older than ~2 business days, it is NOT skipped — a stale value like that usually means a proxy served a cached copy, so the position is re-fetched with a cache-busting request to reach Yahoo for real.</li>
    <li class="gd-li"><span class="gd-b" style="color:#f87171">failed</span> — the fetch didn't succeed, with a short reason. <span class="gd-b">"No price in response"</span> usually means the ticker/symbol is wrong; <span class="gd-b">"Network blocked (proxy rate limit?)"</span> means the proxies are temporarily overloaded — wait a minute and press ↻ Refresh again; <span class="gd-b">"HTTP 408"</span> means the proxy itself answered but its own request to Yahoo timed out (the proxy is alive, its route to Yahoo isn't).</li>
  </ul>
  <p class="gd-p">The date shown is the quote's actual <span class="gd-b">valuation date</span>, not necessarily today — mutual fund NAVs are typically published one or two business days late, so a fund refreshed today may show a date from earlier in the week. This is expected and matches what you'd see on the fund's own factsheet.</p>
  <div class="gd-h3">🧾 Diagnostic log</div>
  <p class="gd-p">At the bottom of the report, <span class="gd-b">Show log</span> expands a timestamped trace of every attempt: symbol, route used (direct / corsproxy / allorigins-q1 / allorigins-q2 / codetabs), outcome, and duration in milliseconds — plus lines noting when a route gets deprioritized. The <span class="gd-b">⧉</span> button copies the whole log to the clipboard. If a refresh misbehaves, this log pinpoints which proxy is the bottleneck; the same lines are also printed to the browser console.</p>
  <div class="gd-h3">✎ Update prices — bulk modal</div>
  <p class="gd-p">In the <span class="gd-b">Positions</span> tab, click <span class="gd-b">✎ Update prices</span> to open a modal listing all positions and the S&P 500 benchmark. For each row, the current price is shown as a placeholder. Fill in only the values you want to update — empty fields are skipped. A <span class="gd-b">↗</span> link next to each position opens the Yahoo Finance page, and a <span class="gd-b">↗ ^GSPC</span> link opens the S&P 500 index page. Press Tab to move between fields, Enter to jump to the next, Apply to save all at once.</p>
  <div class="gd-h3">S&P 500 benchmark</div>
  <p class="gd-p">The S&P 500 level is fetched automatically by <span class="gd-b">↻ Refresh</span> along with your positions (symbol <code class="gd-code">^GSPC</code>), and appears in the report as <span class="gd-b">S&P 500 (benchmark)</span>. Points you entered by hand are never overwritten, exactly like position prices. In the <span class="gd-b">Charts</span> tab, the benchmark card shows all data points with week-over-week % change. Use <span class="gd-b">+ Add point</span> to enter new values manually, ✎ to edit an existing entry, and ✕ to delete. The <span class="gd-b">S&P 500 ↗</span> link in the card title opens the Yahoo Finance page for <code class="gd-code">^GSPC</code>. Note: the S&P 500 index value is in <em>points</em> (currently ~7,200), not euros or dollars.</p>
  <div class="gd-callout warn"><div class="gd-clbl">⚠ Don't forget to save</div><p class="gd-p">A refresh updates prices in memory only — press <span class="gd-b">● Save</span> afterwards, or the fetched prices are lost on reload and the next refresh will treat the same dates as brand new.</p></div>
</div>

<div class="gd-sec" id="g_settings">
  <div class="gd-sec-hd"><div class="gd-h2">Settings</div></div>
  <p class="gd-p">Click <span class="gd-b">⚙ Settings</span> in the header (or press <kbd style="background:#1e293b;border:1px solid #475569;border-radius:4px;padding:1px 6px;font-family:monospace;font-size:12px;color:#94a3b8">,</kbd>) to open the settings panel. Changes are saved immediately to browser storage — they are device-specific and not included in the Export JSON.</p>
  <ul class="gd-ul">
    <li class="gd-li"><span class="gd-b">Number format</span> — choose between <span class="gd-b">European</span> (1.234,56 — dot thousands, comma decimal) and <span class="gd-b">Anglo</span> (1,234.56 — comma thousands, dot decimal). Applies to all displayed values across the app. Note: input fields always use a dot as decimal separator regardless of this setting — type <code class="gd-code">11.75</code> not <code class="gd-code">11,75</code>.</li>
    <li class="gd-li"><span class="gd-b">Language</span> — switch between EN, IT, ES.</li>
    <li class="gd-li"><span class="gd-b">Price fetch source</span> — Yahoo (auto-fetch, no API key needed) or Manual only.</li>
    <li class="gd-li"><span class="gd-b">My proxy URL</span> — optional address of your own CORS proxy; see the auto-fetch section.</li>
    <li class="gd-li"><span class="gd-b">Staleness thresholds</span> — how many days before the price badge turns orange or red.</li>
    <li class="gd-li"><span class="gd-b">App subtitle</span> — the small text below "Portfolio Tracker" in the header.</li>
    <li class="gd-li"><span class="gd-b">Keyboard shortcuts</span> — reference list at the bottom of the panel.</li>
  </ul>
</div>

<div class="gd-sec" id="g_xirr">
  <div class="gd-sec-hd"><div class="gd-h2">Understanding XIRR</div></div>
  <p class="gd-p">XIRR is the annualised return that accounts for both the size <em>and timing</em> of every cash flow. It answers: <em>"what annual interest rate would a savings account need to offer for me to end up with the same result?"</em></p>
  <div class="gd-h3">How it is computed</div>
  <p class="gd-p">Cash flows used: every Buy (negative), every Sell (positive), every Dividend (positive), plus today's market value as a final positive cash flow. The Newton-Raphson algorithm finds the rate that makes the net present value of all flows equal to zero.</p>
  <div class="gd-h3">How to interpret it</div>
  <ul class="gd-ul">
    <li class="gd-li"><span class="gd-b">XIRR &gt; simple P&amp;L %</span> — money was deployed recently, so annualised it looks bigger</li>
    <li class="gd-li"><span class="gd-b">XIRR &lt; simple P&amp;L %</span> — position has been open a long time</li>
    <li class="gd-li"><span class="gd-b">Negative XIRR</span> — currently underwater</li>
  </ul>
  <div class="gd-h4">Practical benchmarks</div>
  <table class="gd-table">
    <thead><tr><th>XIRR</th><th>Context</th></tr></thead>
    <tbody>
      <tr><td>&lt; 0%</td><td>Losing money</td></tr>
      <tr><td>0–3%</td><td>Below inflation</td></tr>
      <tr><td>3–5%</td><td>Roughly inflation-level</td></tr>
      <tr><td>5–8%</td><td>Decent — in line with conservative equity long-run averages</td></tr>
      <tr><td>8–12%</td><td>Good — historical S&amp;P 500 average territory</td></tr>
      <tr><td>&gt; 12%</td><td>Strong — verify it's not just a very short holding period</td></tr>
    </tbody>
  </table>
  <div class="gd-callout warn"><div class="gd-clbl">⚠ Short holding periods</div><p class="gd-p">For positions opened less than 6 months ago, XIRR can look extremely large and volatile — a 5% gain over 3 weeks annualises to ~100%. Use XIRR as directional information only for new positions, and as a reliable metric after at least 6 months.</p></div>
</div>

<div class="gd-sec" id="g_irpf">
  <div class="gd-sec-hd"><span class="gd-badge am">Realised</span><div class="gd-h2">After-tax P&amp;L (IRPF)</div></div>
  <p class="gd-p">In the Realised tab, click <span class="gd-b">Show after-tax (IRPF)</span> to see your P&amp;L figures net of estimated Spanish capital gains tax. The button is in the top-right of the summary card.</p>
  <div class="gd-h3">How the tax is calculated</div>
  <p class="gd-p">The app applies the Spanish IRPF capital gains tax brackets to the total realised gain — closed positions plus a redeemed PIAS, if any (see <span class="gd-b">⚠ PIAS taxation</span> in the Other tab section for why the PIAS gain belongs in this base):</p>
  <table class="gd-table">
    <thead><tr><th>Gain bracket</th><th>Rate</th></tr></thead>
    <tbody>
      <tr><td>Up to €6,000</td><td>19%</td></tr>
      <tr><td>€6,001 – €50,000</td><td>21%</td></tr>
      <tr><td>€50,001 – €200,000</td><td>23%</td></tr>
      <tr><td>€200,001 – €300,000</td><td>27%</td></tr>
      <tr><td>Above €300,000</td><td>30%</td></tr>
    </tbody>
  </table>
  <p class="gd-p">When the toggle is on, the summary card shows gross P&amp;L, estimated tax amount, and net P&amp;L. Each individual trade also shows its estimated net P&amp;L.</p>
  <div class="gd-callout warn"><div class="gd-clbl">⚠ Disclaimer</div><p class="gd-p">This is an estimate only. Actual tax depends on your total annual capital gains across all assets, your personal circumstances, offsetting losses, and other factors. Always consult a tax advisor (asesor fiscal) for official declarations.</p></div>
</div>

<div class="gd-sec" id="g_shortcuts">

  <p class="gd-p">Shortcuts work when focus is not inside an input field. The full list is also shown in <span class="gd-b">⚙ Settings</span>.</p>

</div>

<div class="gd-sec" id="g_data">
  <div class="gd-sec-hd"><div class="gd-h2">Data &amp; backups</div></div>
  <p class="gd-p">All portfolio data is stored in your browser's <span class="gd-b">localStorage</span>, tied to the exact URL or file path. Renaming or moving the file, clearing browser data, or switching browsers starts a fresh storage slot with no data.</p>
  <div class="gd-h3">Save vs Export — what's the difference</div>
  <ul class="gd-ul">
    <li class="gd-li"><span class="gd-b">Save</span> (button or <kbd style="background:#1e293b;border:1px solid #475569;border-radius:3px;padding:1px 5px;font-family:monospace;font-size:12px">S</kbd>) — writes your data to this browser's localStorage. Fast, automatic, but local only. The button turns blue when there are unsaved changes.</li>
    <li class="gd-li"><span class="gd-b">Export ▾</span> — dropdown with three options:
      <ul style="margin-top:6px;margin-left:16px;list-style:none">
        <li style="margin-bottom:4px">📦 <span class="gd-b">Backup</span> — full JSON containing all positions, transactions, price histories, pension history, closed trades, benchmark data and tag targets. Use this to restore your data in a new session.</li>
        <li style="margin-bottom:4px">🤖 <span class="gd-b">AI Summary</span> — clean JSON with only the data relevant for portfolio analysis (no internal IDs or UI state). Paste directly into a Claude conversation for investment advice.</li>
        <li style="margin-bottom:4px">📊 <span class="gd-b">Excel</span> — <code class="gd-code">.xlsx</code> file with 5 sheets: <em>Positions</em> (all open positions with metrics), <em>Transactions</em> (full history sorted by date), <em>Realised</em> (closed positions with P&L), <em>Other assets</em> (Pension Pot, PIAS, Bankinter summary), <em>Interest payments</em> (Bankinter payment detail). Useful for custom calculations in Excel or Google Sheets.</li> Contains: portfolio summary, open positions (qty, avg cost, current value, P&amp;L, XIRR), other assets (Pension Pot, PIAS), realised P&amp;L, and interest income. Open in any browser and press <kbd style="background:#1e293b;border:1px solid #475569;border-radius:3px;padding:1px 5px;font-family:monospace;font-size:11px;color:#94a3b8">Ctrl+P</kbd> to save as PDF. Uses the number format and language set in Settings.</li>
      </ul>
    </li>
    <li class="gd-li"><span class="gd-b">Import</span> — restores from a previously exported JSON file, replacing all current data (with confirmation). Also saves immediately to localStorage.</li>
  </ul>
  <div class="gd-callout warn"><div class="gd-clbl">⚠ If you ever open this file from more than one place</div><p class="gd-p">Data lives in localStorage, tied to the exact file path or URL — the local file, a copy on another device, and a future Netlify deployment would each have <em>completely separate</em> storage. Changes in one are not visible in the others. To keep devices in sync automatically, turn on Cloud sync in Settings (encrypted, through a private GitHub repository); otherwise Export from one → Import on the other. Always keep an up-to-date Export JSON as a backup.</p></div>
  <div class="gd-callout tip"><div class="gd-clbl">💡 Recommended workflow (current: local file)</div><p class="gd-p">You're running this as a local HTML file, with your own proxy handling the Yahoo CORS restriction (see <span class="gd-b">My proxy URL</span> above). Open it, make changes, <span class="gd-b">Save</span>. Export regularly to keep a JSON backup — if the file is ever lost, moved, or opened somewhere new, that export is what restores everything. If you later deploy to Netlify, the same rule applies: pick one location as primary and Export/Import to keep the other in sync.</p></div>
</div>

<div class="gd-sec" id="g_demo">
  <div class="gd-sec-hd"><div class="gd-h2">Demo mode</div></div>
  <p class="gd-p">Click <span class="gd-b">Demo</span> in the tab bar. The interface shifts to an amber theme with a ⬡ DEMO MODE banner. Demo mode uses completely separate storage with four fictional positions. All changes are saved separately. Click <span class="gd-b">Exit Demo</span> to return to your real portfolio.</p>
  <p class="gd-p">Use it to: test buy/sell/dividend/close workflows, experiment with tags and targets, explore the rebalancing calculator, or show the app to someone without exposing your real data.</p>
</div>

<div class="gd-sec" id="g_tips">
  <div class="gd-sec-hd"><div class="gd-h2">Workflow tips</div></div>
  <div class="gd-h3">Weekly maintenance routine</div>
  <ul class="gd-ul">
    <li class="gd-li">Click <span class="gd-b">✎ Update prices</span> in the Positions tab — use the Yahoo ↗ links to look up each price, fill them in, Apply.</li>
    <li class="gd-li">Add the latest S&P 500 value in Charts → benchmark card (read from the <span class="gd-b">S&P 500 ↗</span> link).</li>
    <li class="gd-li">If using Netlify as primary, press <kbd style="background:#1e293b;border:1px solid #475569;border-radius:3px;padding:1px 5px;font-family:monospace;font-size:12px">S</kbd> to save, then Export for backup.</li>
    <li class="gd-li">Update the Pension Pot GBP value and FX rate when you receive a statement.</li>
  </ul>
  <div class="gd-h3">Getting the most from Analysis</div>
  <ul class="gd-ul">
    <li class="gd-li">Assign a <span class="gd-b">primary tag</span> to every position using an asset-class scheme (e.g. Equity, Conservative, Stock).</li>
    <li class="gd-li">Set target % for each primary tag in the Target allocation card — ensure they sum to 100%.</li>
    <li class="gd-li">Use the <span class="gd-b">Rebalancing calculator</span> when you have new cash — enter the amount, see where to put it.</li>
    <li class="gd-li">Use secondary tags (platform, geography) for filtering without affecting rebalancing.</li>
  </ul>
  <div class="gd-h3">Reading the charts</div>
  <ul class="gd-ul">
    <li class="gd-li"><span class="gd-b">Price % change</span> — best for comparing positions. All normalised to 0%, so different price scales don't matter. The white dashed line is the S&amp;P 500 benchmark.</li>
    <li class="gd-li"><span class="gd-b">Contributions</span> — shows cumulative invested vs portfolio value over time. Filter by tag to isolate a segment.</li>
    <li class="gd-li"><span class="gd-b">Unrealised P&amp;L</span> — evolution of your gain in euros. With multiple positions, a combined line appears below.</li>
  </ul>
  <div class="gd-hr"></div>
  <p class="gd-p" style="text-align:center;color:#475569;font-size:12px">Portfolio Tracker · Personal use</p>
</div>`;

function toggleExportMenu() {
  const m = document.getElementById('export-menu');
  if (!m) return;

function exportAISummary() {
  const today = todayHTML();
  const pen = OTHER.find(o=>o.id==='pension') || {};
  const pia = OTHER.find(o=>o.id==='pias') || {};
  const bk  = OTHER.find(o=>o.id==='bankinter') || {payments:[]};
  const bkNet   = (bk.payments||[]).reduce((s,p)=>s+p.net,0);
  const bkGross = (bk.payments||[]).reduce((s,p)=>s+p.gross,0);

  // Realised grouped by position
  const realisedByName = CLOSED.reduce((acc,c)=>{
    if(!acc[c.name]) acc[c.name]={pl:0, count:0};
    acc[c.name].pl += c.pl; acc[c.name].count++;
    return acc;
  },{});
  // A fully-redeemed PIAS is a realised result too — fold it in so the summary's
  // realised total matches what the app shows in the Overview.
  const piaRedeemed = pia.redemption ? (pia.redemption.amount - (pia.investedEUR||0)) : null;
  if (piaRedeemed !== null) realisedByName['PIAS BBVA'] = {pl: piaRedeemed, count: 1};

  const openPositions = positions.map(p => {
    const x = calcXIRR(p);
    return {
      name: p.name,
      full_name: p.fullName||'',
      isin: p.isin||'',
      type: p.type||'',
      platform: p.platform||'',
      currency: p.currency||'EUR',
      qty: parseFloat(p.qty.toLocaleString(NL(),{minimumFractionDigits:4,maximumFractionDigits:4})),
      avg_cost: parseFloat(p.avgFill.toFixed(4)),
      invested_eur: parseFloat(p.invested.toFixed(2)),
      current_price: p.priceHistory?.length ? parseFloat(p.priceHistory[p.priceHistory.length-1]?.p?.toFixed(4)||0) : null,
      current_value_eur: parseFloat(cv(p).toFixed(2)),
      unrealized_pl_eur: parseFloat(upl(p).toFixed(2)),
      unrealized_pl_pct: p.invested>0 ? parseFloat((upl(p)/p.invested*100).toFixed(2)) : 0,
      xirr_pct: x !== null ? parseFloat((x*100).toFixed(2)) : null,
      ter_pct: p.er||0,
      tags: p.tags||[],
      primary_tag: p.primaryTag||null,
    };
  });

  const t = totals();

  const summary = {
    export_date: today,
    currency: 'EUR',
    portfolio_summary: {
      total_invested: parseFloat(t.tI.toFixed(2)),
      current_value: parseFloat(t.tV.toFixed(2)),
      unrealized_pl: parseFloat(t.tP.toFixed(2)),
      unrealized_pl_pct: parseFloat((t.tPp*100).toFixed(2)),
      open_positions_count: positions.length,
    },
    open_positions: openPositions,
    realised_pl: {
      total: parseFloat((CLOSED.reduce((s,c)=>s+c.pl,0) + (piaRedeemed||0)).toFixed(2)),
      by_position: Object.entries(realisedByName).map(([name,v])=>({
        name, total_pl: parseFloat(v.pl.toFixed(2)), transactions: v.count
      }))
    },
    other_assets: {
      pension_pot_uk: {
        platform: pen.platform||'',
        current_value_gbp: pen.currentGBP||0,
        current_value_eur: pen.currentEUR||0,
        invested_gbp: pen.investedGBP||0,
        invested_eur: pen.investedEUR||0,
        unrealized_pl_eur: parseFloat(((pen.currentEUR||0)-(pen.investedEUR||0)).toFixed(2)),
        gbp_eur_rate: pen.fx||0,
      },
      pias_bbva: pia.redemption ? {
        status: 'fully_redeemed',
        platform: pia.platform||'',
        invested_eur: pia.investedEUR||0,
        redeemed_on: pia.redemption.date,
        opened_on: pia.openedDate||null,
        amount_received_eur: parseFloat((pia.redemption.amount||0).toFixed(2)),
        realized_pl_eur: parseFloat(((pia.redemption.amount||0)-(pia.investedEUR||0)).toFixed(2)),
        note: 'Fully redeemed — no longer part of portfolio value; realised result is counted in realised_pl.',
      } : {
        status: 'active',
        platform: pia.platform||'',
        invested_eur: pia.investedEUR||0,
        current_value_eur: pia.currentEUR||0,
        unrealized_pl_eur: parseFloat(((pia.currentEUR||0)-(pia.investedEUR||0)).toFixed(2)),
      }
    },
    interest_income: {
      source: 'Bankinter Interest-bearing Account',
      total_gross: parseFloat(bkGross.toFixed(2)),
      total_net: parseFloat(bkNet.toFixed(2)),
      payments_count: (bk.payments||[]).length,
      payments: (bk.payments||[]).map(p=>({date:p.d, gross:p.gross, net:p.net}))
    }
  };

  const blob = new Blob([JSON.stringify(summary, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `portfolio_ai_summary_${today}.json`;
  a.click();
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const d = JSON.parse(e.target.result);
      if (!d.positions || !Array.isArray(d.positions)) throw new Error('bad format');
      if (!confirm(T('importConfirm'))) { input.value=''; return; }
      applyDataset(d, [], []);   // an imported file replaces everything; parts it lacks become empty
      if (d.lang)      { lang = d.lang; localStorage.setItem('pt_lang', lang); }
      if (d.settings && d.settings.customProxy && !(settings.customProxy||'').trim()) { settings.customProxy = String(d.settings.customProxy).trim(); saveSettings(); }
      loadError = false;   // an explicit import replaces whatever was unreadable
      const saved = saveData();
      state.tab = 'overview'; state.selectedId = null;
      render();
      if (saved) {
        const n = document.getElementById('notif');
        n.textContent = T('importSuccess');
        n.classList.add('show');
        setTimeout(() => n.classList.remove('show'), 2500);
      }
    } catch(err) {
      alert(T('importError'));
    }
    input.value = '';
  };
  reader.readAsText(file);
}

// price edit
function se(id,val){state.editingId=id;state.editVal=val;render()}
function ce(){state.editingId=null;render()}
function cp(id){
  const price=parseFloat(state.editVal.replace(',','.'));
  if(!isNaN(price)&&price>0){
    const date = htmlToInternal(todayHTML());
    positions=positions.map(p=>{
      if(p.id!==id) return p;
      const ph=[...(p.priceHistory||[])];
      const idx=ph.findIndex(h=>h.d===date);
      if(idx>=0) ph[idx]={d:date,p:price}; else ph.push({d:date,p:price});
      return {...p,price,priceHistory:ph};
    });
    markDirty();
  }
  state.editingId=null; render();
}

// tx form
function tf(k,v){state.txForm[k]=v;if(k==='a')render()}
function ct(){
  const f=state.txForm;
  const d = f.d ? htmlToInternal(f.d) : htmlToInternal(todayHTML());
  const pos = positions.find(p=>p.id===state.selectedId);
  if(!pos) return;

  // Dividend — only needs amount (stored in price field, qty=1)
  if(f.a==='Dividend'){
    const amount=parseFloat(f.p.replace(',','.'));
    if(isNaN(amount)||amount<=0){alert(T('txError'));return}
    const newTx={d,a:'Dividend',q:1,p:amount,c:0};
    positions=positions.map(p=>{
      if(p.id!==state.selectedId) return p;
      return{...p,txs:[...p.txs,newTx]};
    });
    markDirty();
    state.showAddTx=false;
    state.txForm={a:'Buy',d:todayHTML(),q:'',p:'',c:'0'};
    render();
    return;
  }

  const qty=parseFloat(f.q.replace(',','.')), price=parseFloat(f.p.replace(',','.')||'0'), comm=parseFloat(f.c.replace(',','.')||'0');
  if(isNaN(qty)||qty<=0){alert(T('txError'));return}
  if(isNaN(price)||price<=0){alert(T('txError'));return}

  // Sell validation
  if(f.a==='Sell'){
    if(qty>pos.qty+0.00001){alert(T('sellExceedsQty')+` (${T('qty')}: ${pos.qty.toFixed(4)})`);return}

    const isTotalClose = Math.abs(qty - pos.qty) < 0.00001;
    const sid = 'sell_'+Date.now()+'_'+Math.floor(Math.random()*1e6);   // links this sale to its Realised entry
    const newTx = {d, a:'Sell', q:qty, p:price, c:comm, sid};
    const cost = pos.avgFill * qty;
    const proceeds = qty * price - comm;
    const pl = proceeds - cost;
    const plPct = pl / cost;

    if(isTotalClose){
      // Add to CLOSED — preserve full transaction history for future FIFO/tax calc
      CLOSED = [...CLOSED, {
        name: pos.name,
        isin: pos.isin||'',
        type: pos.type||'',
        platform: pos.platform||'',
        qty: pos.qty,
        buy: pos.avgFill,
        sell: price,
        cost: parseFloat((pos.avgFill * pos.qty).toFixed(4)),
        proceeds: parseFloat(proceeds.toFixed(4)),
        pl: parseFloat(pl.toFixed(4)),
        plPct: parseFloat(plPct.toFixed(6)),
        date: d,
        fiscalInvested: pos.fiscalInvested!=null ? pos.fiscalInvested : pos.invested,
        txs: [...pos.txs, newTx]
      }];
      // Remove from positions
      positions = positions.filter(p=>p.id!==state.selectedId);
      markDirty();
      state.showAddTx=false;
      state.txForm={a:'Buy',d:'',q:'',p:'',c:'0'};
      state.selectedId=null;
      state.tab='closed';
      render();
      // Brief notification
      const n=document.getElementById('notif');
      n.textContent=T('positionClosed');
      n.classList.add('show');
      setTimeout(()=>n.classList.remove('show'),2500);
      return;
    }

    // Partial sell
    const partialEntry = {
      sid, posId: pos.id,
      name: pos.name,
      qty,
      buy: pos.avgFill,
      sell: price,
      cost: parseFloat((pos.avgFill * qty).toFixed(4)),
      proceeds: parseFloat(proceeds.toFixed(4)),
      pl: parseFloat(pl.toFixed(4)),
      plPct: parseFloat(plPct.toFixed(6)),
      date: d,
      partial: true
    };
    CLOSED = [...CLOSED, partialEntry];
    positions = positions.map(p=>{
      if(p.id!==state.selectedId) return p;
      const nq = p.qty - qty;
      const ni = p.avgFill * nq;
      const fInv = (p.fiscalInvested!=null ? p.fiscalInvested : p.invested);
      const nfInv = p.qty>0 ? (fInv/p.qty)*nq : 0;
      return {...p, qty:nq, invested:ni, fiscalInvested:nfInv, txs:[...p.txs, newTx]};
    });
    markDirty();
    state.showAddTx=false;
    state.txForm={a:'Buy',d:'',q:'',p:'',c:'0'};
    render();
    return;
  }

  // Buy
  positions=positions.map(p=>{
    if(p.id!==state.selectedId) return p;
    const newTx={d,a:'Buy',q:qty,p:price,c:comm};
    const nq=p.qty+qty, ni=p.invested+qty*price+comm, na=ni/nq;
    const prevFiscal = (p.fiscalInvested!=null ? p.fiscalInvested : p.invested);
    const nfInv = prevFiscal + qty*price + comm; // normal buy: fiscal cost = real cost
    return{...p,qty:nq,invested:ni,avgFill:na,fiscalInvested:nfInv,txs:[...p.txs,newTx]};
  });
  markDirty();
  state.showAddTx=false;
  state.txForm={a:'Buy',d:todayHTML(),q:'',p:'',c:'0'};
  render();
}

// other products edit
function seo(id,field,val){state.editingOther={id,field,val:String(val),date:todayHTML()};render()}
function pko(e,id,field){if(e.key==='Enter')cpo(id,field);if(e.key==='Escape'){state.editingOther=null;render()}}
function cpo(id,field){
  const eo=state.editingOther;
  const val=parseFloat(eo.val.replace(',','.'));
  if(isNaN(val)||val<0){state.editingOther=null;render();return}
  const date = htmlToInternal(eo.date||todayHTML());
  OTHER=OTHER.map(o=>{
    if(o.id!==id) return o;
    const updated={...o,[field]:val};
    if(id==='pension'){
      updated.currentEUR=updated.currentGBP*updated.fx;
      updated.plEUR=updated.currentEUR-updated.investedEUR;
      updated.plPct=updated.plEUR/updated.investedEUR;
      const hist=[...(o.history||[])];
      // update or add entry for this date
      const idx=hist.findIndex(h=>h.date===date);
      const entry={date,gbp:updated.currentGBP,fx:updated.fx,eur:updated.currentEUR};
      if(idx>=0) hist[idx]=entry; else hist.push(entry);
      updated.history=hist;
    }
    if(id==='pias'){
      updated.plEUR=updated.currentEUR-updated.investedEUR;
      updated.plPct=updated.plEUR/updated.investedEUR;
      updated.lastUpdated=date;
      const hist=[...(o.history||[])];
      const idx=hist.findIndex(h=>h.date===date);
      const entry={date,invested:updated.investedEUR,current:updated.currentEUR};
      if(idx>=0) hist[idx]=entry; else hist.push(entry);
      updated.history=hist;
    }
    return updated;
  });
  markDirty();
  state.editingOther=null;
  render();
}

  const f = state.redeemForm; if(!f) return;
  const amount = parseFloat(String(f.amount).replace(',','.'));
  if(isNaN(amount) || amount<0){ alert(T('redeemInvalid')); return; }
  const date = htmlToInternal(f.d||todayHTML());
  const opened = f.start ? htmlToInternal(f.start) : null;
  OTHER = OTHER.map(o => o.id==='pias' ? {...o, openedDate: opened || o.openedDate || null, redemption:{date, amount}} : o);

function undoRedeemPias(){
  if(!confirm(T('undoRedeemConfirm'))) return;
  OTHER = OTHER.map(o => { if(o.id!=='pias') return o; const c={...o}; delete c.redemption; return c; });
  markDirty(); render();
}

function syncOtherCurrentValue() {
  // After any history change, sync pension current values to most recent entry
  OTHER = OTHER.map(o => {
    if (o.id !== 'pension' || !o.history || !o.history.length) return o;
    const sorted = [...o.history].sort((a,b)=>parseD(b.date)-parseD(a.date));
    const latest = sorted[0];
    return {
      ...o,
      currentGBP: latest.gbp,
      fx: latest.fx,
      currentEUR: latest.eur,
      plEUR: latest.eur - o.investedEUR,
      plPct: (latest.eur - o.investedEUR) / o.investedEUR
    };
  });
}

function savePensionEntry() {
  const f = state.addPriceForm;
  const gbp = parseFloat(f.p.replace(',','.'));
  const fx  = parseFloat((f.fx||'').replace(',','.'));
  if (!f.d || isNaN(gbp) || gbp <= 0 || isNaN(fx) || fx <= 0) return;
  const date = htmlToInternal(f.d);
  const eur  = parseFloat((gbp * fx).toFixed(2));
  OTHER = OTHER.map(o => {
    if (o.id !== 'pension') return o;
    const hist = [...(o.history||[])];
    const idx  = hist.findIndex(h=>h.date===date);
    if (idx >= 0) hist[idx] = {date, gbp, fx, eur};
    else hist.push({date, gbp, fx, eur});
    hist.sort((a,b)=>parseD(a.date)-parseD(b.date));
    return {...o, history: hist};
  });
  syncOtherCurrentValue();
  markDirty();
  state.showAddPriceEntry = null;
  state.addPriceForm = {d:todayHTML(), p:'', fx:''};
  render();
}

// history edit/delete
function seh(id,idx,date,gbp,fx){state.editingHistory={id,idx,date,gbp:String(gbp),fx:String(fx)};render()}
function deh(id,idx){
  if(!confirm(T('deleteRow'))) return;
  OTHER=OTHER.map(o=>{
    if(o.id!==id) return o;
    const h=[...o.history]; h.splice(idx,1);
    return {...o,history:h};
  });
  syncOtherCurrentValue();
  markDirty(); render();
}
function ceh(id){
  const eh=state.editingHistory;
  const gbp=parseFloat(eh.gbp.replace(',','.')), fx=parseFloat(eh.fx.replace(',','.'));
  if(isNaN(gbp)||isNaN(fx)||!eh.date){state.editingHistory=null;render();return}
  OTHER=OTHER.map(o=>{
    if(o.id!==id) return o;
    const h=[...o.history];
    h[eh.idx]={date:eh.date,gbp,fx,eur:parseFloat((gbp*fx).toFixed(2))};
    return {...o,history:h};
  });
  syncOtherCurrentValue();
  markDirty(); state.editingHistory=null; render();
}

function groupStats(grpPositions) {
  const inv = grpPositions.reduce((s,p)=>s+p.invested,0);
  const val = grpPositions.reduce((s,p)=>s+cv(p),0);
  const pl  = val - inv;
  const plP = inv>0 ? pl/inv : 0;
  const totVal = positions.reduce((s,p)=>s+cv(p),0);
  const wt  = totVal>0 ? val/totVal : 0;
  const ter = inv>0 ? grpPositions.reduce((s,p)=>s+p.er*(p.invested/inv),0) : 0;
  return {inv,val,pl,plP,wt,ter};
}

// ─── REBALANCING CALCULATOR ──────────────────────────────────────────────────

function renderRebalCalc() {
  const hasTgts = Object.keys(targets).length > 0;
  const cash = parseFloat(state.rebalCash||0);

  const header = `<div id="rebal_card" class="card" style="margin-top:14px;border-color:#334155">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="font-size:13px;font-weight:600">${T('rebalCalc')}</div>
  </div>`;

  if (!hasTgts) {
    return `<div id="rebal_card" class="card" style="margin-top:14px;border-color:#334155">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <div style="font-size:13px;font-weight:600">${T('rebalCalc')}</div>
  </div>
  <div style="font-size:12px;color:#64748b">${T('rebalNoTargets')}</div>
</div>`;
  }

  const totVal = positions.reduce((s,p)=>s+cv(p),0);
  const newTotVal = totVal + cash;

  // Only count each position once — under its primaryTag
  // Positions with no primaryTag are excluded from rebalancing
  const tagResult = Object.entries(targets).filter(([,tgt])=>tgt>0).map(([tag,tgt])=>{
    const grp = positions.filter(p=>p.primaryTag===tag);
    if (!grp.length) return null;
    const curVal = grp.reduce((s,p)=>s+cv(p),0);
    const targetVal = newTotVal * tgt/100;
    const needed = Math.max(0, targetVal - curVal);
    const curPct = totVal>0 ? curVal/totVal*100 : 0;
    return {tag, tgt, curVal, targetVal, needed, curPct, grp};
  }).filter(Boolean);

  const totalNeeded = tagResult.reduce((s,r)=>s+r.needed,0);
  const scaleFactor = totalNeeded > cash && cash > 0 ? cash/totalNeeded : 1;

  // Now compute newPct using the actual scaled allocation
  tagResult.forEach(r=>{
    const alloc = r.needed * scaleFactor;
    r.newPct = newTotVal>0 ? (r.curVal + alloc) / newTotVal * 100 : 0;
  });

  const rows = tagResult.map(r=>{
    const alloc = r.needed * scaleFactor;
    const devBefore = r.curPct - r.tgt;
    const devAfter  = r.newPct - r.tgt;
    const posDevBef = devBefore>=0, posDevAft = devAfter>=0;
    if (alloc < 0.01) return `<tr>
      <td style="font-weight:500">${r.tag}</td>
      <td class="R d">€${e2(r.curVal)}</td>
      <td class="R d">${r.tgt.toFixed(1)}%</td>
      <td class="R d">${r.curPct.toFixed(1)}%</td>
      <td class="R" style="color:#64748b">—</td>
      <td class="R ${posDevBef?'':'g'}" style="color:${Math.abs(devBefore)<1?'#34d399':posDevBef?'#f59e0b':'#60a5fa'}">${devBefore>0?'+':''}${devBefore.toFixed(1)}%</td>
    </tr>`;
    // suggest buy per position proportional to their current weight in group
    const grpVal = r.grp.reduce((s,p)=>s+cv(p),0);
    const posSuggestions = r.grp.map(p=>{
      const posShare = grpVal>0 ? cv(p)/grpVal : 1/r.grp.length;
      const posAlloc = alloc * posShare;
      const units = p.price>0 ? posAlloc/p.price : 0;
      if(posAlloc<0.01) return '';
      return `<div style="font-size:11px;color:#94a3b8;margin-top:3px">↳ ${esc(p.name)}: ${T('rebalBuy')} ~${units.toFixed(2)} ${T('rebalUnits')} (€${e2(posAlloc)})</div>`;
    }).join('');
    return `<tr>
      <td style="font-weight:500">${r.tag}${posSuggestions?`<div>${posSuggestions}</div>`:''}</td>
      <td class="R d">€${e2(r.curVal)}</td>
      <td class="R d">${r.tgt.toFixed(1)}%</td>
      <td class="R d">${r.curPct.toFixed(1)}%</td>
      <td class="R" style="color:#34d399;font-weight:600">€${e2(alloc)}</td>
      <td class="R" style="color:${Math.abs(devBefore)<1?'#34d399':posDevBef?'#f59e0b':'#60a5fa'}">${devBefore>0?'+':''}${devBefore.toFixed(1)}% → <span style="color:${Math.abs(devAfter)<1?'#34d399':posDevAft?'#f59e0b':'#60a5fa'}">${devAfter>0?'+':''}${devAfter.toFixed(1)}%</span></td>
    </tr>`;
  }).join('');

  const unassigned = positions.filter(p=>!p.primaryTag);
  const unassignedNote = unassigned.length
    ? `<div style="font-size:11px;color:#f59e0b;margin-bottom:10px;background:#1c1407;padding:7px 10px;border-radius:6px;border-left:2px solid #f59e0b">⚠ ${unassigned.length} position${unassigned.length>1?'s':''} without primary tag (excluded): ${unassigned.map(p=>p.name).join(', ')}</div>`
    : '';

  const cashInput = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px">
    <label style="font-size:12px;color:#94a3b8;white-space:nowrap">${T('rebalCash')}:</label>
    <input id="rebal_cash" class="p-inp" style="width:120px!important" placeholder="0.00" value="${state.rebalCash||''}" oninput="state.rebalCash=this.value;renderRebalOnly()">
    ${cash>0?`<span style="font-size:11px;color:#64748b">Distributing €${e2(cash)} across ${tagResult.filter(r=>r.needed>0.01).length} tags</span>`:''}
  </div>`;

  return header + unassignedNote + cashInput + (cash>0?`
  <div class="tbl-wrap"><table>
    <thead><tr><th>${T('groupTitle')}</th><th class="R">${T('currentValue')}</th><th class="R">${T('targetWeight')}</th><th class="R">${T('currentWeight')}</th><th class="R">${T('rebalAmount')}</th><th class="R">${T('deviation')}</th></tr></thead>
    <tbody>${rows}</tbody>
    <tfoot><tr style="border-top:2px solid #334155">
      <td style="font-weight:600;padding:8px 10px">${T('total')}</td>
      <td class="R mn">€${e2(totVal)}</td>
      <td class="R"></td><td class="R"></td>
      <td class="R mn" style="color:#34d399;font-weight:700">€${e2(tagResult.reduce((s,r)=>s+r.needed*scaleFactor,0))}</td>
      <td class="R"></td>
    </tr></tfoot>
  </table></div>` : `<div style="font-size:12px;color:#64748b">Enter an amount above to see suggestions.</div>`) + '</div>';
}

function addTag(id, tag) {
  const t = tag.trim();
  if (!t) return;
  positions = positions.map(p => {
    if (p.id !== id) return p;
    const tags = [...new Set([...(p.tags||[]), t])];
    return {...p, tags};
  });
  state.tagInput = '';
  markDirty(); render();
}
function removeTag(id, tag) {
  positions = positions.map(p => {
    if (p.id !== id) return p;
    const tags = (p.tags||[]).filter(t=>t!==tag);
    // Clear primaryTag if removed tag was primary
    const primaryTag = p.primaryTag === tag ? null : p.primaryTag;
    return {...p, tags, primaryTag};
  });
  markDirty(); render();
}
function setPrimaryTag(id, tag) {
  positions = positions.map(p => p.id!==id ? p : {...p, primaryTag: tag});
  markDirty(); render();
}
function openEditPos(id){
  const p=positions.find(x=>x.id===id); if(!p) return;
  state.editPos={id, name:p.name||'', fullName:p.fullName||'', isin:p.isin||'', type:p.type||'Fund', platform:p.platform||'', er:String(p.er??0)};
  render();
}
function epf(k,v){ if(state.editPos) state.editPos[k]=v; }
function cancelEditPos(){ state.editPos=null; render(); }
function saveEditPos(){
  const f=state.editPos; if(!f) return;
  const name=f.name.trim(), isin=f.isin.trim().toUpperCase();
  const er=parseFloat(String(f.er).replace(',','.')||'0');
  if(!name||!isin||isNaN(er)||er<0){alert(T('missingFields')); return;}
  positions=positions.map(p=>p.id!==f.id?p:{...p, name, fullName:f.fullName.trim()||name, isin, type:f.type, platform:f.platform.trim()||'—', er});
  CLOSED = CLOSED.map(c => (c.posId===f.id && c.name!==name) ? {...c, name} : c);   // keep Realised grouped under the new name
  state.editPos=null; markDirty(); render();
}
function setTicker(id, val) {

}
function setTickerAndRender(id, val) {
  positions = positions.map(p => p.id!==id ? p : {...p, ticker: val.trim().toUpperCase()});

function setInfoUrl(id, val) {

}
function setInfoUrlAndRender(id, val) {
  setInfoUrl(id, val); render();
}

// Quick health check for a user-supplied proxy: fetches one known quote and
// reports what came back, so a wrong URL is caught here and not mid-refresh.
async function testCustomProxy(btn) {
  const base = (settings.customProxy||'').trim();
  if (!base) return;
  const original = btn.textContent;
  btn.textContent = 'Testing…'; btn.disabled = true;
  const target = 'https://query1.finance.yahoo.com/v8/finance/chart/AAPL?interval=1d&range=1d&_cb=' + Date.now();
  const url = base + (base.includes('?') ? '&' : '?') + 'url=' + encodeURIComponent(target);
  const t0 = performance.now();
  let ok = false, msg = '';
  try {
    const res = await fetchWithTimeout(url, 15000);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const px = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
    if (!px) throw new Error('response has no price — is the ?url= parameter supported?');
    ok = true; msg = `AAPL ${px} in ${Math.round(performance.now()-t0)}ms`;
  } catch (e) {
    msg = e.message || String(e);
  }
  btn.disabled = false;
  btn.textContent = ok ? '✓ OK' : '✗ Failed';
  btn.style.color = ok ? '#34d399' : '#f87171';
  btn.style.borderColor = ok ? '#34d399' : '#f87171';
  alert(ok ? `Proxy works — ${msg}` : `Proxy test failed:\n\n${msg}`);
  setTimeout(()=>{ btn.textContent = original; btn.style.color=''; btn.style.borderColor=''; }, 4000);
}

function saveSettings() {
  try { localStorage.setItem('pt_settings', JSON.stringify(settings)); } catch(e) {}
}

// ── bytes / base64 ──
function b64enc(u8) {

}

// ── crypto ──

  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64dec(saltB64), iterations:iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);

}
async function syncEncrypt(obj, pass, saltB64) {

  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));

  let d;

}

// ── GitHub Contents API ──
function ghUrl(p) { return 'https://api.github.com/repos/' + syncRepo() + (p || ''); }
function ghFile() { return '/contents/' + syncPath().split('/').map(encodeURIComponent).join('/'); }
async function ghFetch(url, opts = {}, ms = 20000) {
  const ac = new AbortController(), t = setTimeout(() => ac.abort(), ms);
  try {
    return await fetch(url, {...opts, signal:ac.signal, cache:'no-store',
      headers:{Authorization:'Bearer ' + (settings.ghToken||'').trim(), Accept:'application/vnd.github+json', ...(opts.headers||{})}});

    throw syncErr('net', e && e.name === 'AbortError' ? 'timeout' : '');

}
function ghCheck(res) {
  if (res.ok) return;
  if (res.status === 401) throw syncErr('auth');
  if (res.status === 403 || res.status === 429) {
    if (res.status === 429 || res.headers.get('x-ratelimit-remaining') === '0') throw syncErr('rate');
    throw syncErr('auth');

  throw syncErr('http', res.status);
}
async function ghRead() {
  const url = ghUrl(ghFile());
  const res = await ghFetch(url);
  if (res.status === 404) {
    const r2 = await ghFetch(ghUrl(''));
    ghCheck(r2);          // repo missing / no access / bad token end up here
    return null;          // the repo exists, the file does not exist yet
  }
  ghCheck(res);
  const j = await res.json();
  if (Array.isArray(j) || j.type !== 'file') throw syncErr('format');
  let text;
  if (j.encoding === 'base64' && j.content) text = new TextDecoder().decode(b64dec(j.content));
  else {   // files over 1 MB come without inline content
    const r3 = await ghFetch(url, {headers:{Accept:'application/vnd.github.raw+json'}});
    ghCheck(r3);
    text = await r3.text();

}
async function ghWrite(text, sha) {
  const body = {message:'sync ' + new Date().toISOString(), content:b64enc(new TextEncoder().encode(text))};
  if (sha) body.sha = sha;
  const res = await ghFetch(ghUrl(ghFile()), {method:'PUT', body:JSON.stringify(body), headers:{'Content-Type':'application/json'}}, 30000);
  if (res.status === 409 || res.status === 422) throw syncErr('conflict');
  ghCheck(res);
  const j = await res.json();
  return j.content.sha;
}

async function syncNow(opts = {}) {

  if (s) s.innerHTML = syncConfigured() ? syncStatusLineHTML() : `<span style="color:#64748b">${esc(SY('off'))}</span>`;
  if (syncConfigured()) syncNow({manual:true});
}
