// ── Refresh diagnostics ──
// _refreshLog collects timestamped attempt-level entries for the current refresh
// (also mirrored to the console). Shown in the report modal under "Log".
let _refreshLog = [];
function rlog(msg) {
  const t = new Date();
  const ts = `${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}:${String(t.getSeconds()).padStart(2,'0')}.${String(t.getMilliseconds()).padStart(3,'0')}`;
  const line = `[${ts}] ${msg}`;
  _refreshLog.push(line);
  console.log('%c↻ ' + line, 'color:#60a5fa');
}

// fetch with a hard timeout: public proxies sometimes hold the connection open
// without answering, and the browser's default fetch can hang for minutes —
// that's what makes a refresh look "stuck". 8s per attempt, then move on.
const FETCH_TIMEOUT_MS = 8000;
// ── Refresh cancellation ──
// _refreshCtl exists while a refresh is running (also serves as re-entrancy
// guard). cancelRefresh() aborts every in-flight request immediately; prices
// already fetched are kept, the rest are reported as "cancelled".
let _refreshCtl = null;
function cancelRefresh(){
  if (!_refreshCtl || _refreshCtl.cancelled) return;
  _refreshCtl.cancelled = true;
  _refreshCtl.controllers.forEach(c=>{ try{c.abort();}catch(e){} });
  rlog('refresh cancelled by user');
  rsPhase(T('rsCancelling'));
}

async function fetchWithTimeout(url, ms = FETCH_TIMEOUT_MS) {
  const ctrl = new AbortController();
  if (_refreshCtl) _refreshCtl.controllers.add(ctrl);
  const timer = setTimeout(() => ctrl.abort(), ms);
  try { return await fetch(url, {signal: ctrl.signal}); }
  catch (e) {
    if (e.name === 'AbortError') {
      if (_refreshCtl && _refreshCtl.cancelled) throw new Error('cancelled');
      throw new Error(`timeout ${ms/1000}s`);
    }
    throw e;
  }
  finally { clearTimeout(timer); if (_refreshCtl) _refreshCtl.controllers.delete(ctrl); }
}

// Yahoo Finance quote via the public chart endpoint. Yahoo does not send CORS
// headers, so a direct browser fetch is blocked; we fall back through public
// CORS proxies (each returns Access-Control-Allow-Origin: *, which also works
// from a local file:// page whose origin is "null"). Covers EU exchanges
// (e.g. IDR.MC, ETFs on .MI/.PA) and mutual funds (Yahoo "0P..." symbols),
// and mutual funds that have no exchange listing.
//
// Route scheduling (session only) — learned from real-world failure logs:
//  - HEALTH SCORE per route instead of a binary blacklist: success +1 (max 3),
//    timeout −2, other failure −1 (min −3). Routes are tried in score order,
//    so the healthiest route is always first, but a struggling route is never
//    fully excluded (a binary blacklist collapses when everything has a bad
//    moment at cold start, and then stops helping entirely).
//  - ADAPTIVE TIMEOUT: routes with score ≤ −2 get a short probe (they've been
//    hanging; don't spend 8s on them again), healthy/unknown routes get the
//    full budget. The final retry round gets a much larger budget because
//    proxies like allorigins QUEUE requests under load — responses that take
//    3–7s are real successes, not dead connections.
//  - PER-ROUTE LOCK: at most one in-flight request per route. Hitting the same
//    proxy with parallel requests makes it queue both (observed: two parallel
//    calls both time out; a single call returns in 10ms).
//  - query1/query2 are two separate Yahoo hosts: when a proxy's path to query1
//    is throttled for one URL, the same proxy via query2 often still works.
let _yahooRouteHint = null;
const _routeHealth = {};   // name -> score (-3..3)
const _routeEverOK = {};   // name -> true once it has answered this session
const _routeBusy = {};     // host -> bool (in-flight lock)
function routeScore(n){ return _routeHealth[n] ?? 0; }
function routeReport(n, outcome){
  const prev = routeScore(n);
  let s = prev;
  if (outcome === 'ok') s = Math.min(3, (s < 0 ? 0 : s) + 1);      // recovery is fast
  else if (outcome === 'timeout') s = Math.max(-3, s - 2);
  else s = Math.max(-3, s - 1);
  _routeHealth[n] = s;
  if (prev > -2 && s <= -2) rlog(`route ${n} deprioritized (unresponsive — will use short probes)`);
}
const LOCK_WAIT_MAX_MS = 12000;   // never block silently on a busy backend
async function withRouteLock(key, fn){
  // A dedicated proxy handles concurrency fine — serializing is only needed for
  // shared public proxies that queue parallel requests.
  if (key === 'myproxy') return fn(0);
  let waited = 0;
  while (_routeBusy[key]) {                        // serialize same-backend calls
    await new Promise(r=>setTimeout(r, 120));
    if ((waited += 120) >= LOCK_WAIT_MAX_MS) throw new Error('lock busy');  // give up → try next route
  }
  _routeBusy[key] = true;
  try { return await fn(waited); } finally { _routeBusy[key] = false; }
}
// Lock per BACKEND HOST, not per route: allorigins-q1 and -q2 are different
// routes but the same proxy backend — hitting it with two parallel requests
// makes it queue both (observed: paired timeouts, while single calls succeed).
function routeHost(name){ return name.startsWith('allorigins') ? 'allorigins' : name; }

// Cache buster. CORS proxies cache responses BY URL — and they cache FAILURES
// too: an observed 408 came back in 4ms right after the same URL had produced a
// real 408 22s earlier, i.e. a cached negative reply. So the buster has two
// parts: a per-run value (stops day-old quotes being served as fresh) plus a
// per-attempt nonce that is bumped after a cache-suspect failure and on every
// re-roll pass, so each retry is a genuinely new request rather than a replay
// of the proxy's stored failure. Yahoo ignores unknown query params.
let _yahooCacheBuster = 0;
const BENCHMARK_TICKER = '^GSPC';     // S&P 500 index on Yahoo Finance

function yahooRoutes(symbol, nonce = 0) {
  const q = host => `https://${host}/v8/finance/chart/${encodeURIComponent(symbol)}?interval=1d&range=1d&_cb=${_yahooCacheBuster}-${nonce}`;
  const t1 = q('query1.finance.yahoo.com'), t2 = q('query2.finance.yahoo.com');
  const mine = (settings.customProxy||'').trim();
  const myRoute = mine ? [{name:'myproxy', url: mine + (mine.includes('?') ? '&' : '?') + 'url=' + encodeURIComponent(t1)}] : [];
  return [...myRoute,
    {name:'direct',        url: t1},
    {name:'corsproxy',     url: 'https://corsproxy.io/?url=' + encodeURIComponent(t1)},
    {name:'allorigins-q1', url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent(t1)},
    {name:'allorigins-q2', url: 'https://api.allorigins.win/raw?url=' + encodeURIComponent(t2)},
    {name:'codetabs',      url: 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(t1)},
  ];
}

const PROBE_TIMEOUT_MS = 4000;        // for routes that have been hanging
// Any route on this backend host has answered this session?
function hostEverOK(name){
  const h = routeHost(name);
  return Object.keys(_routeEverOK).some(n=>_routeEverOK[n] && routeHost(n)===h);
}

// A proxy-side timeout (408) or gateway error means the proxy answered but its
// own fetch to Yahoo failed — and that answer may be cached. Retrying the exact
// same URL would just replay it, so these bump the nonce.
const CACHE_SUSPECT_RE = /HTTP (408|409|429|5\d\d)/;
// Per-symbol nonce, persisted across rounds of the same refresh: the patient
// round must not restart at 0 and replay the URLs round 1 already burned.
const _symbolNonce = {};

async function fetchYahoo(symbol, budgetMs = FETCH_TIMEOUT_MS, passes = 1) {
  let nonce = _symbolNonce[symbol] || 0;
  const bumpNonce = () => { nonce++; _symbolNonce[symbol] = nonce; return yahooRoutes(symbol, nonce); };
  let routes = yahooRoutes(symbol, nonce);
  const isLongRound = passes > 1 || budgetMs > FETCH_TIMEOUT_MS;
  let lastErr;
  for (let pass = 0; pass < passes; pass++) {
    if (_refreshCtl && _refreshCtl.cancelled) throw new Error('cancelled');
    if (pass > 0) routes = bumpNonce();   // fresh URLs for the re-roll
    // Order by health score (desc); the last-good route wins ties.
    let names = routes.map(r=>r.name)
      .sort((a,b)=>(routeScore(b)-routeScore(a)) || (a===_yahooRouteHint?-1:0) || (b===_yahooRouteHint?1:0));
    if (_yahooRouteHint && routeScore(_yahooRouteHint) >= 0)
      names = [_yahooRouteHint, ...names.filter(n=>n!==_yahooRouteHint)];
    // Your own proxy is dedicated (no shared rate limits): prefer it while healthy.
    if (names.includes('myproxy') && routeScore('myproxy') >= 0)
      names = ['myproxy', ...names.filter(n=>n!=='myproxy')];
    // Skip floor-scored routes ONLY if their backend has never answered this
    // session. A proven backend (e.g. allorigins) behaves like a lottery under
    // load — a fresh attempt can succeed instantly right after a hung one — so
    // its variants must never be excluded. Never-proven hangers (a dead proxy)
    // are skipped once floored, as probing them only wastes time.
    const alive = names.filter(n=>routeScore(n) > -3 || hostEverOK(n));
    if (alive.length >= 2) names = alive;
    if (pass > 0) {                            // re-roll pass: only proven backends
      const proven = names.filter(n=>hostEverOK(n));
      if (proven.length) names = proven;
    }
    for (const name of names) {
      if (_refreshCtl && _refreshCtl.cancelled) throw new Error('cancelled');
      const route = routes.find(r=>r.name===name);
      // Budget per attempt:
      //  - normal rounds: full budget for healthy/unknown routes, 4s probe for
      //    routes that have been hanging (score ≤ −2);
      //  - patient round: under load a proxy behaves like a lottery — every
      //    observed success lands either instantly or within ~8s, while long
      //    single waits tend to die with a server-side close. So instead of one
      //    huge wait we make TWO passes: 12s per proven route on pass 1, 24s on
      //    pass 2 (the re-roll usually hits a healthy worker). Never-proven
      //    routes get one bounded 8s shot.
      const tmo = isLongRound
        ? (_routeEverOK[name] || hostEverOK(name) ? (pass === 0 ? 12000 : 24000) : 8000)
        : (routeScore(name) <= -2 ? PROBE_TIMEOUT_MS : budgetMs);
      let tFetch0 = 0;
      try {
        const res = await withRouteLock(routeHost(name), (lockWaited)=>{
          if (lockWaited > 500) rlog(`${symbol} · waited ${(lockWaited/1000).toFixed(1)}s for ${routeHost(name)} lock`);
          tFetch0 = performance.now();               // time the FETCH only, not the lock wait
          return fetchWithTimeout(route.url, tmo);
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const meta = data?.chart?.result?.[0]?.meta;
        const px = meta && (meta.regularMarketPrice ?? meta.previousClose);
        if (!px || px <= 0) throw new Error('No price in response (check the Yahoo symbol)');
        _yahooRouteHint = name;
        _routeEverOK[name] = true;
        routeReport(name, 'ok');
        rlog(`${symbol} via ${name} → OK ${px} (${Math.round(performance.now()-tFetch0)}ms)`);
        // regularMarketTime is the actual valuation time (unix seconds). For mutual
        // funds this is the NAV date, which can lag a few days behind today.
        return {price: px, ts: meta.regularMarketTime ? meta.regularMarketTime*1000 : null};
      } catch (e) {
        if (/^cancelled$/.test(e.message||'')) throw e;   // no log spam, no score penalty
        if (/^lock busy$/.test(e.message||'')) {          // couldn't get the backend in time — try next route, no penalty
          rlog(`${symbol} via ${name} → ${routeHost(name)} busy ${LOCK_WAIT_MAX_MS/1000}s, skipping`);
          lastErr = e; continue;
        }
        const ms = tFetch0 ? Math.round(performance.now()-tFetch0) : 0;
        rlog(`${symbol} via ${name} → ${e.message}${ms?` (${ms}ms)`:''}`);
        routeReport(name, /timeout/i.test(e.message||'') ? 'timeout' : 'fail');
        if (CACHE_SUSPECT_RE.test(e.message||'')) routes = bumpNonce();   // proxy may cache this failure
        lastErr = e;
      }
    }
    if (pass < passes - 1) rlog(`${symbol}: pass ${pass+1} exhausted — re-rolling proven routes`);
  }
  // "Failed to fetch" is the browser's opaque network/CORS error — with public
  // proxies it almost always means rate limiting. Say so instead of the raw text.
  if (lastErr && /failed to fetch|networkerror|load failed/i.test(lastErr.message||''))
    throw new Error('Network blocked (proxy rate limit?) — wait a minute and retry');
  throw lastErr || new Error('All fetch attempts failed');
}

// Run async fn over items with limited concurrency (gentle on free CORS proxies).
async function mapLimited(items, limit, fn) {
  const out = new Array(items.length);
  let next = 0;
  async function worker() {
    while (next < items.length) {
      const i = next++;
      try { out[i] = {status:'fulfilled', value: await fn(items[i], i)}; }
      catch (e) { out[i] = {status:'rejected', reason: e}; }
      await new Promise(r=>setTimeout(r, 250));   // small gap between requests
    }
  }
  await Promise.all(Array.from({length: Math.min(limit, items.length)}, worker));
  return out;
}

// ── Live refresh status panel (fixed, bottom-right) ──
const _rs = {items: new Map(), phase: ''};
function rsEnsureEl() {
  let el = document.getElementById('refreshStatus');
  if (!el) {
    el = document.createElement('div');
    el.id = 'refreshStatus';
    el.style.cssText = 'position:fixed;right:16px;bottom:16px;z-index:9999;background:#1e293b;border:1px solid #334155;border-radius:10px;padding:12px 14px;min-width:250px;max-width:330px;box-shadow:0 8px 24px rgba(0,0,0,.5);font-size:12px';
    document.body.appendChild(el);
  }
  return el;
}
function rsInit(names) {
  _rs.items = new Map(names.map(n=>[n,{state:'queued', detail:''}]));
  _rs.phase = '';
  rsRender();
}
function rsSet(name, state, detail='') { if(_rs.items.has(name)){ _rs.items.set(name,{state,detail}); rsRender(); } }
function rsPhase(text) { _rs.phase = text; rsRender(); }
function rsRender() {
  const el = rsEnsureEl();
  const icon = s => s==='queued'?'<span style="color:#475569">○</span>'
    : s==='fetching'?'<span style="color:#60a5fa">◐</span>'
    : s==='ok'?'<span style="color:#34d399">✓</span>'
    : s==='retry'?'<span style="color:#f59e0b">⟳</span>'
    : '<span style="color:#f87171">✗</span>';
  const rows = [..._rs.items.entries()].map(([n,{state,detail}])=>
    `<div style="display:flex;justify-content:space-between;gap:10px;padding:2px 0">
      <span style="color:#cbd5e1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px">${icon(state)} ${n}</span>
      <span class="mn" style="color:#94a3b8;white-space:nowrap;font-size:11px">${detail}</span>
    </div>`).join('');
  el.innerHTML = `<div style="font-weight:700;color:#e2e8f0;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px">
      <span>↻ ${T('refreshing')}</span>
      <span style="display:flex;align-items:center;gap:8px">
        <span style="font-size:11px;color:#f59e0b;font-weight:400">${_rs.phase}</span>
        <button onclick="cancelRefresh()" title="${T('rsCancel')}" style="background:none;border:1px solid #334155;color:#94a3b8;font-size:11px;padding:2px 8px;border-radius:5px;cursor:pointer">✕ ${T('rsCancel')}</button>
      </span>
    </div>${rows}`;
}
function rsDone() {
  const el = document.getElementById('refreshStatus');
  if (el) el.remove();
  _rs.items = new Map(); _rs.phase = '';
}


async function refreshPrices() {
  if (_refreshCtl) return;                       // a refresh is already running
  if (settings.fetchSource === 'manual') { alert(T('fetchManualMode')); return; }
  // Anti-double-refresh: fund NAVs update once a day and Yahoo's EU exchange
  // quotes are ~15-min delayed, so re-fetching within 15 minutes brings nothing
  // new — and back-to-back refreshes are what trip the proxies' per-IP limits.
  const _lastOK = +(localStorage.getItem('pt_lastRefreshOK')||0);
  if (_lastOK && Date.now()-_lastOK < 15*60*1000) {
    const mins = Math.max(1, Math.round((Date.now()-_lastOK)/60000));
    if (!confirm(LANGS[lang].refreshSoonConfirm(mins))) return;
  }
  const candidates = positions.filter(p => p.ticker);
  if (!candidates.length) { alert(T('fetchNoYahooTickers')); return; }
  // Fund NAVs (Yahoo "0P…" symbols) publish once per business day: if we already
  // fetched a fund TODAY (calendar day — a rolling 24h window would drift later
  // every day) there is nothing new to get, so skip it. Safeguard: if the entry
  // from that fetch was deleted by hand, re-fetch. Stocks/ETFs always fetch.
  const isFundTicker = t => /^0P/i.test(t||'');
  // Business days from a NAV date to today (weekends excluded).
  const bizDaysSince = dStr => {
    const from = new Date(parseD(dStr)); from.setHours(12,0,0,0);
    const to = new Date(); to.setHours(12,0,0,0);
    let c = 0;
    while (from < to) { from.setDate(from.getDate()+1); const wd = from.getDay(); if (wd!==0 && wd!==6) c++; if (c>30) break; }
    return c;
  };
  // Most recent business day strictly before today: the freshest NAV a daily
  // fund could plausibly have published by now.
  // Normalised to midnight so it compares like-for-like with parseD().
  const lastBizDay = (()=>{ const d=new Date(); d.setHours(0,0,0,0);
    do { d.setDate(d.getDate()-1); } while (d.getDay()===0 || d.getDay()===6); return d.getTime(); })();
  const FUND_RECHECK_MS = 2*60*60*1000;   // re-check a fund's NAV after this long
  // Skip rules for daily-NAV funds — "already fetched today" is NOT enough: a
  // fund fetched at 10:00 may publish a newer NAV during the afternoon, and a
  // later refresh must be able to pick it up. So we skip only when either
  //   (a) we already hold the newest NAV that can exist yet, or
  //   (b) we checked very recently (guards against rapid repeat refreshes).
  const skippedFunds = [], withTicker = [];
  candidates.forEach(p => {
    const laf = p.lastAutoFetch;
    const entry = laf && (p.priceHistory||[]).find(h=>h.d===laf.d);
    let reason = null;
    if (isFundTicker(p.ticker) && laf && entry) {
      const agoMs = Date.now() - laf.t;
      if (parseD(entry.d) >= lastBizDay) reason = 'latest';                 // nothing newer can exist yet
      else if (agoMs < FUND_RECHECK_MS && bizDaysSince(entry.d) <= 2)       // (stale NAV never counts as "recent")
        reason = {kind:'recent', mins: Math.max(1, Math.round(agoMs/60000))};
    }
    if (reason) skippedFunds.push({p, entry, reason}); else withTicker.push(p);
  });
  // The S&P 500 benchmark is an index quote like any other symbol, so it rides
  // along as a synthetic task: same throttling, retries, status panel, report.
  const BM_ID = '__benchmark__';
  withTicker.push({id: BM_ID, name: T('benchmarkLine'), ticker: BENCHMARK_TICKER});

  const report = [];   // {name, price, date, status:'added'|'updated'|'kept'|'failed'|'skipped'|'cancelled', extra?}
  skippedFunds.forEach(({p, entry, reason}) => report.push({name:p.name, price:entry.p, date:entry.d, status:'skipped',
    extra: reason==='latest' ? T('rrSkippedLatest') : LANGS[lang].rrSkippedRecent(reason.mins)}));
  const btn = document.getElementById('refreshBtn');
  if (btn) { btn.textContent = T('refreshing'); btn.disabled = true; }
  let updated = 0;
  const failures = [];
  const today = htmlToInternal(todayHTML());
  const tStart = performance.now();

  _refreshLog = [];
  Object.keys(_routeHealth).forEach(k=>delete _routeHealth[k]);   // fresh route health per refresh
  Object.keys(_routeEverOK).forEach(k=>delete _routeEverOK[k]);
  _refreshCtl = {cancelled:false, controllers:new Set()};
  _yahooCacheBuster = Date.now();
  Object.keys(_symbolNonce).forEach(k=>delete _symbolNonce[k]);
  rlog(`refresh started · source=${settings.fetchSource} · ${withTicker.length} positions · timeout ${FETCH_TIMEOUT_MS/1000}s/attempt`);
  if (!(settings.customProxy||'').trim()) rlog('no personal proxy set (Settings → Worker URL) — only public proxies will be tried, which are often down or rate-limited');
  rsInit(withTicker.map(p=>p.name));
  rsPhase(T('rsRound1'));

  // Fetch with limited concurrency (public CORS proxies rate-limit bursts),
  // then retry failures once after a pause — transient limits usually clear.
  let done = 0;
  const mkFetch = (tmo, passes=1) => async p => {
    if (_refreshCtl && _refreshCtl.cancelled) { rsSet(p.name,'failed',T('rrCancelled')); throw new Error('cancelled'); }
    rsSet(p.name, 'fetching', '…');
    try {
      const q = await fetchYahoo(p.ticker, tmo, passes);
      done++;
      rsSet(p.name, 'ok', '€'+q.price.toLocaleString(NL(),{maximumFractionDigits:4}));
      if (btn) btn.textContent = `${T('refreshing')} ${Math.min(done, withTicker.length)}/${withTicker.length}`;
      return {id: p.id, price: q.price, ts: q.ts};
    } catch(e) {
      rsSet(p.name, 'failed', (e.message||'').slice(0,26));
      throw e;
    }
  };
  const doFetch = mkFetch(FETCH_TIMEOUT_MS);
  const doFetchLong = mkFetch(30000, 2);   // patient round: two lottery passes (12s then 24s on proven routes)
  let results = await mapLimited(withTicker, 2, doFetch);
  // Retry strategy — saturation-aware. Timeout-type failures mean the proxy is
  // QUEUED, not down: quick 4s re-probes both fail (shorter than the queue) and
  // deepen the queue further. So: non-timeout failures get one quick retry;
  // timeout-type failures go straight to the patient round (long budget,
  // one at a time), which is what actually succeeds under load.
  const isSaturation = r => /Network blocked|timeout/i.test(r?.reason?.message||'');
  const hasTimeouts = idxs => idxs.some(i=>/timeout/i.test(results[i]?.reason?.message||''));
  let failedIdx = results.map((r,i)=>r.status==='rejected'?i:-1).filter(i=>i>=0);
  // Retry unless it looks like real offline: everything failed AND nothing even
  // timed out (instant network errors everywhere). Saturation (timeouts present)
  // is retryable even at 0/N — the proxy is alive, just overloaded.
  if (!(_refreshCtl && _refreshCtl.cancelled) && failedIdx.length && (failedIdx.length < withTicker.length || hasTimeouts(failedIdx))) {
    const quickIdx = failedIdx.filter(i=>!isSaturation(results[i]));
    const satCount = failedIdx.length - quickIdx.length;
    rlog(`round 1 done: ${withTicker.length-failedIdx.length}/${withTicker.length} ok — ${quickIdx.length} quick-retry, ${satCount} saturation-type (patient round)`);
    if (quickIdx.length) {
      rsPhase(T('rsRetry'));
      quickIdx.forEach(i=>rsSet(withTicker[i].name,'retry',''));
      await new Promise(r=>setTimeout(r, 1500));
      const retry = await mapLimited(quickIdx.map(i=>withTicker[i]), 1, doFetch);
      retry.forEach((r,k)=>{ results[quickIdx[k]] = r; });
    }
    // Patient round: everything still failed, with a long budget per attempt.
    failedIdx = results.map((r,i)=>r.status==='rejected' ? i : -1).filter(i=>i>=0);
    if (!(_refreshCtl && _refreshCtl.cancelled) && failedIdx.length && (failedIdx.length < withTicker.length || hasTimeouts(failedIdx))) {
      rlog(`${failedIdx.length} still failing — backing off 8s, then patient round (30s budget)`);
      failedIdx.forEach(i=>rsSet(withTicker[i].name,'retry',''));
      for (let s=8; s>0 && !(_refreshCtl && _refreshCtl.cancelled); s--) {  // visible countdown
        rsPhase(`${T('rsWait')} ${s}s`);
        if (btn) btn.textContent = `⏳ ${s}s…`;
        await new Promise(r=>setTimeout(r, 1000));
      }
      rsPhase(T('rsRetry'));
      if (btn) btn.textContent = T('refreshing');
      const retry2 = await mapLimited(failedIdx.map(i=>withTicker[i]), 1, doFetchLong);
      retry2.forEach((r,k)=>{ results[failedIdx[k]] = r; });
    }
  }
  rlog(`refresh finished in ${((performance.now()-tStart)/1000).toFixed(1)}s`);

  results.forEach((r, i) => {
    if (r.status === 'fulfilled') {
      const {id, price, ts} = r.value;
      // Use the quote's real valuation date (fund NAVs can lag days behind today);
      // fall back to today if the API gave no timestamp.
      const qDate = ts ? htmlToInternal(new Date(ts).toISOString().slice(0,10)) : today;
      if (id === BM_ID) {                       // benchmark: separate store, same rules
        const bi = benchmarkData.findIndex(h => h.d === qDate);
        if (bi >= 0) {
          if (benchmarkData[bi].src) {          // only overwrite auto-fetched points
            benchmarkData[bi] = {d:qDate, p:price, src:'auto'};
            report.push({name:T('benchmarkLine'), price, date:qDate, status:'updated'});
          } else {
            report.push({name:T('benchmarkLine'), price:benchmarkData[bi].p, date:qDate, status:'kept',
                         extra:LANGS[lang].rrKeptNote(benchmarkData[bi].p, price)});
          }
        } else {
          benchmarkData.push({d:qDate, p:price, src:'auto'});
          benchmarkData.sort((a,b)=>parseD(a.d)-parseD(b.d));
          report.push({name:T('benchmarkLine'), price, date:qDate, status:'added'});
        }
        updated++;
        return;
      }
      positions = positions.map(p => {
        if (p.id !== id) return p;
        const ph = [...(p.priceHistory||[])];
        const idx = ph.findIndex(h=>h.d===qDate);
        if (idx >= 0) {
          // Same-date conflict: overwrite only auto-fetched entries (src flag).
          // Entries without src are manual (e.g. 4-decimal NAVs from MyInvestor)
          // and take precedence over Yahoo's 2-decimal values — keep them.
          // A same-day entry equal to a Buy/Traspaso In price is just the purchase seed, not a hand-typed quote
          const isBuySeed = !ph[idx].src && (p.txs||[]).some(t=>(t.a==='Buy'||t.a==='Traspaso In') && t.d===qDate && Math.abs(t.p-ph[idx].p)<1e-9);
          if (ph[idx].src || isBuySeed) {
            ph[idx] = {d:qDate, p:price, src:'auto'};
            report.push({name:p.name, price, date:qDate, status:'updated'});
          } else {
            report.push({name:p.name, price:ph[idx].p, date:qDate, status:'kept', extra:LANGS[lang].rrKeptNote(ph[idx].p, price)});
          }
        } else {
          ph.push({d:qDate, p:price, src:'auto'});
          ph.sort((a,b)=>parseD(a.d)-parseD(b.d));
          report.push({name:p.name, price, date:qDate, status:'added'});
        }
        return syncCurrentPrice({...p, priceHistory:ph, lastAutoFetch:{t:Date.now(), d:qDate}});
      });
      updated++;
    } else {
      const msg = r.reason && r.reason.message ? r.reason.message : String(r.reason);
      if (/^cancelled$/.test(msg)) {
        report.push({name:withTicker[i].name, price:null, date:null, status:'cancelled'});
      } else {
        failures.push(`${withTicker[i].name}: ${msg}`);
        report.push({name:withTicker[i].name, price:null, date:null, status:'failed', extra:msg});
      }
    }
  });

  if (updated > 0) markDirty();

  if (btn) {
    btn.disabled = false;
    btn.style.borderColor = updated > 0 ? '#34d399' : '#f87171';
    btn.style.color = updated > 0 ? '#34d399' : '#f87171';
    btn.textContent = updated > 0 ? `✓ ${updated}/${withTicker.length}` : T('refreshError');
    setTimeout(() => {
      if (btn) { btn.style.borderColor=''; btn.style.color=''; btn.textContent=T('refreshPrices'); }
    }, 3000);
  }

  const n = document.getElementById('notif');
  const _cx = _refreshCtl && _refreshCtl.cancelled;
  n.textContent = _cx ? LANGS[lang].refreshCancelledMsg(updated)
                : updated > 0 ? LANGS[lang].refreshSuccess(updated) : T('refreshError');
  n.style.background = _cx ? '#78350f' : updated > 0 ? '#065f46' : '#7f1d1d';
  n.classList.add('show');
  setTimeout(()=>{n.classList.remove('show'); n.style.background='';}, 2500);

  // Diagnostics: log per-position failures; if nothing worked from a local file,
  // surface the HTTPS hint (some proxies still work from file://, so we try first).
  if (failures.length) console.warn('Price refresh failures:\n' + failures.join('\n'));
  if (updated === 0 && location.protocol === 'file:') alert(T('refreshLocalFile'));

  const wasCancelled = _refreshCtl && _refreshCtl.cancelled;
  if (updated > 0 && !wasCancelled) { try{ localStorage.setItem('pt_lastRefreshOK', String(Date.now())); }catch(e){} }
  _refreshCtl = null;
  rsDone();
  render();
  if (wasCancelled) rlog('refresh ended after cancellation');
  showRefreshReport(report);
}

// ─── TX EDIT / DELETE ────────────────────────────────────────────────────────

function recomputePos(txs) {
  // Replays the transaction list (average-cost method). Dividends change neither
  // quantity nor cost basis. The fiscal basis is rebuilt too, as long as every
  // Traspaso In carries its inherited fiscal cost; otherwise it is left untouched.
  let qty=0, invested=0, fiscal=0, fiscalKnown=true;
  for (const t of txs) {
    const c = t.c||0;
    if (t.a==='Buy') { qty+=t.q; invested+=t.q*t.p+c; fiscal+=t.q*t.p+c; }
    else if (t.a==='Traspaso In') {
      qty+=t.q; invested+=t.q*t.p+c;
      if (t.fiscalCost!=null) fiscal+=t.q*t.fiscalCost+c; else fiscalKnown=false;
    }
    else if (t.a==='Sell'||t.a==='Traspaso Out') {
      const k = qty>t.q ? (qty-t.q)/qty : 0;
      invested*=k; fiscal*=k; qty=Math.max(0,qty-t.q);
    }
  }
  const out = {qty, invested, avgFill: qty>0?invested/qty:0};
  if (fiscalKnown) out.fiscalInvested = fiscal;
  return out;
}

// ── Keeping Realised in step with the sales of a position ──────────────────
// A partial sale writes one entry into CLOSED (tx.sid == entry.sid). When a sale is
// edited or deleted that entry must follow, otherwise Realised P&L stays stale.
const newSid = () => 'sell_'+Date.now()+'_'+Math.floor(Math.random()*1e6);

// Before an edit: link sales recorded before sid existed to their CLOSED entry
// (same position name, date and quantity, still unlinked). Anything that cannot be
// matched unambiguously is marked 'legacy' and left alone — never duplicated.
function linkLegacySales(posId) {
  const p = positions.find(x=>x.id===posId); if (!p) return;
  let touched = false;
  const txs = p.txs.map(t => {
    if (t.a!=='Sell' || t.sid) return t;
    const cands = CLOSED.filter(c => c.partial && !c.sid && c.name===p.name && c.date===t.d && Math.abs(c.qty-t.q)<1e-6);
    if (cands.length===1) {
      const sid = newSid() + '_L';
      CLOSED = CLOSED.map(c => c===cands[0] ? {...c, sid, posId:p.id} : c);
      touched = true;
      return {...t, sid};
    }
    touched = true;
    return {...t, sid:'legacy'};
  });
  if (touched) positions = positions.map(x => x.id===posId ? {...x, txs} : x);
}

// After an edit: rebuild the CLOSED entries of this position from its transaction list
function syncRealisedFor(posId) {
  const p = positions.find(x=>x.id===posId); if (!p) return;
  let qty=0, invested=0;
  const wanted = {};   // sid -> entry
  p.txs.forEach(t => {
    if (t.a==='Buy' || t.a==='Traspaso In') { qty+=t.q; invested+=t.q*t.p+(t.c||0); return; }
    if (t.a==='Dividend') return;
    const avg = qty>0 ? invested/qty : 0;
    if (t.a==='Sell' && t.sid && t.sid!=='legacy') {
      const cost = avg*t.q, proceeds = t.q*t.p-(t.c||0), pl = proceeds-cost;
      wanted[t.sid] = {sid:t.sid, posId:p.id, name:p.name, qty:t.q, buy:avg, sell:t.p,
        cost:parseFloat(cost.toFixed(4)), proceeds:parseFloat(proceeds.toFixed(4)), pl:parseFloat(pl.toFixed(4)),
        plPct:parseFloat((cost>0?pl/cost:0).toFixed(6)), date:t.d, partial:true};
    }
    // Sell and Traspaso Out both leave at average cost
    const k = qty>t.q ? (qty-t.q)/qty : 0;
    invested*=k; qty=Math.max(0,qty-t.q);
  });
  const used = new Set();
  const next = [];
  CLOSED.forEach(c => {
    if (c.posId===p.id && c.partial && c.sid) {
      if (wanted[c.sid]) { next.push({...c, ...wanted[c.sid]}); used.add(c.sid); }
      // else: its sale was deleted or is no longer a sale → drop the entry
    } else next.push(c);
  });
  Object.keys(wanted).forEach(sid => { if (!used.has(sid)) next.push(wanted[sid]); });
  CLOSED = next;
}

function editTx(posId, idx) {
  const p = positions.find(x=>x.id===posId);
  if (!p) return;
  const t = p.txs[idx];
  state.editingTx = {posId, idx, d:t.d, a:t.a, q:String(t.q), p:String(t.p), c:String(t.c)};
  render();
}

function saveTx(posId, idx) {
  const et = state.editingTx;
  const q=parseFloat(et.q.replace(',','.')), pr=parseFloat(et.p.replace(',','.')), c=parseFloat(et.c.replace(',','.')||'0');
  if (isNaN(q)||isNaN(pr)||q<=0||pr<=0) { alert(T('txError')); return; }
  const d = et.d || htmlToInternal(todayHTML());
  linkLegacySales(posId);
  positions = positions.map(p => {
    if (p.id !== posId) return p;
    const txs = [...p.txs];
    txs[idx] = {...txs[idx], d, a:et.a, q, p:pr, c};   // keep extra fields (fiscalCost, mv, sid)
    if (et.a!=='Traspaso In') delete txs[idx].fiscalCost;
    if (et.a!=='Traspaso Out') delete txs[idx].mv;
    if (et.a!=='Sell') delete txs[idx].sid;
    else if (!txs[idx].sid) txs[idx].sid = newSid();
    return {...p, txs, ...recomputePos(txs)};
  });
  syncRealisedFor(posId);
  state.editingTx = null;
  markDirty(); render();
}

function deleteTx(posId, idx) {
  const p = positions.find(x=>x.id===posId);
  if (!p) return;
  if (p.txs.length === 1) { alert(T('deleteTxLast')); return; }
  if (!confirm(T('deleteTxConfirm'))) return;
  linkLegacySales(posId);
  positions = positions.map(pos => {
    if (pos.id !== posId) return pos;
    const txs = pos.txs.filter((_,i)=>i!==idx);
    return {...pos, txs, ...recomputePos(txs)};
  });
  syncRealisedFor(posId);
  state.editingTx = null;
  markDirty(); render();
}

// ─── CHARTS ──────────────────────────────────────────────────────────────────

const CHART_COLORS = ['#3b82f6','#10b981','#f59e0b','#8b5cf6','#ef4444','#06b6d4','#f472b6','#a3e635','#fb923c','#e879f9'];

function parseD(str) {
  // dd/mm/yy or dd/mm/yyyy
  const p = str.split('/');
  const y = p[2].length===2 ? 2000+parseInt(p[2]) : parseInt(p[2]);
  return new Date(y, parseInt(p[1])-1, parseInt(p[0])).getTime();
}

function fmtD(ts) {
  const d = new Date(ts);
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${String(d.getFullYear()).slice(-2)}`;
}

function handleChartZoom(e, padL, cW) {
  e.preventDefault();
  const svg = e.currentTarget;
  const rect = svg.getBoundingClientRect();
  const frac = Math.max(0, Math.min(1, (e.clientX - rect.left - padL) / cW));
  const xMin0 = +svg.dataset.xmin, xMax0 = +svg.dataset.xmax, span0 = +svg.dataset.span;
  const cur = (state.chartZoom && state.chartZoom.scale > 1) ? state.chartZoom : {scale:1, center:.5};
  const delta = e.deltaY > 0 ? 0.8 : 1.25;
  const newScale = Math.max(1, Math.min(20, cur.scale * delta));
  const visSpan0 = span0 / cur.scale;
  const xAtCursor = xMin0 + span0 * cur.center - visSpan0/2 + frac * visSpan0;
  const newVisSpan = span0 / newScale;
  let newCenter = (xAtCursor - xMin0 + newVisSpan/2) / span0;
  newCenter = Math.max(0, Math.min(1, newCenter));
  state.chartZoom = {scale: newScale, center: newCenter};
  render();
}

// ---- Pan (drag-to-scroll when zoomed) — direct manipulation ----
// During the drag we translate the data group 1:1 with the cursor (so the chart
// "sticks" to the mouse), clipped to the plot area by a FIXED outer clip group.
// On release we convert the drag into a new center and re-render once.
//
// Smoothness: the translate is applied via CSS transform (GPU-composited, no
// layout/repaint of the SVG) and synced to the display with requestAnimationFrame,
// so we paint at most once per frame no matter how fast mousemove fires.
//
// 1:1 mapping: SVG viewBox is 700 wide at width:100%, so rect.width screen-px == 700
// viewBox units; the plot area cW viewBox units == screenCW = rect.width*cW/700 px.
// Translating the group by `dx` screen-px == dx*(cW/screenCW) viewBox units.
let _chartPan = null;
let _panRAF = null;

function handleChartMouseDown(e, padL, cW) {
  if (!(state.chartZoom && state.chartZoom.scale > 1)) return; // pan only when zoomed
  if (e.button !== 0) return;                                  // left button only
  e.preventDefault();
  const svg = e.currentTarget;
  const rect = svg.getBoundingClientRect();
  const screenCW = rect.width * (cW / 700);
  const xMin0 = +svg.dataset.xmin, xMax0 = +svg.dataset.xmax, span0 = +svg.dataset.span;
  const visSpan = span0 / state.chartZoom.scale;
  // Reconstruct the rendered window EXACTLY as lineChart() does (same clamping)
  let xStart = xMin0 + span0 * state.chartZoom.center - visSpan/2;
  let xEnd   = xStart + visSpan;
  if (xStart < xMin0) { xStart = xMin0; xEnd = xStart + visSpan; }
  if (xEnd   > xMax0) { xEnd = xMax0;   xStart = xEnd - visSpan; }
  const body = svg.querySelector('.panbody');
  if (body) {
    body.style.willChange = 'transform';   // promote to its own GPU layer for the drag
    body.style.transformBox = 'view-box';  // CSS translate units == viewBox units
  }
  _chartPan = { startX: e.clientX, lastDx: 0, pendingDx: 0, moved: false,
                xStart, xEnd, visSpan, span0, xMin0, xMax0, cW, screenCW, body };
  document.body.style.cursor = 'grabbing';
  document.body.style.userSelect = 'none';
}

function _paintPan() {
  _panRAF = null;
  if (!_chartPan || !_chartPan.body) return;
  const tx = _chartPan.pendingDx * (_chartPan.cW / _chartPan.screenCW); // px -> viewBox units
  _chartPan.body.style.transform = 'translate(' + tx.toFixed(2) + 'px,0)';
  _chartPan.lastDx = _chartPan.pendingDx;
}

function handleChartMouseMove(e) {
  if (!_chartPan) return;
  e.preventDefault();
  let dx = e.clientX - _chartPan.startX;
  // Clamp the drag so we never pan past the data ends (no blank beyond the edges).
  const dxRightMax = (_chartPan.xStart - _chartPan.xMin0) / _chartPan.visSpan * _chartPan.screenCW;
  const dxLeftMax  = -((_chartPan.xMax0 - _chartPan.xEnd) / _chartPan.visSpan * _chartPan.screenCW);
  dx = Math.max(dxLeftMax, Math.min(dxRightMax, dx));
  _chartPan.pendingDx = dx;
  _chartPan.moved = true;
  if (!_panRAF) _panRAF = requestAnimationFrame(_paintPan); // one paint per frame
}

function handleChartMouseUp(e) {
  if (!_chartPan) return;
  if (_panRAF) { cancelAnimationFrame(_panRAF); _panRAF = null; }
  document.body.style.cursor = '';
  document.body.style.userSelect = '';
  const { moved, pendingDx, xStart, visSpan, screenCW, span0, xMin0, xMax0, body } = _chartPan;
  _chartPan = null;
  if (body) { body.style.willChange = ''; }
  if (!moved) return;                                   // click without drag: nothing to commit
  // Drag right (dx>0) reveals EARLIER dates -> xStart decreases.
  let newXStart = xStart - (pendingDx / screenCW) * visSpan;
  newXStart = Math.max(xMin0, Math.min(xMax0 - visSpan, newXStart));
  const newCenter = (newXStart + visSpan/2 - xMin0) / span0;
  state.chartZoom = {...state.chartZoom, center: Math.max(0, Math.min(1, newCenter))};
  render();                                             // single re-render: snaps axes/labels
}

document.addEventListener('mousemove', handleChartMouseMove);
document.addEventListener('mouseup', handleChartMouseUp);

function lineChart(series, {W=700, H=280, yFmt=v=>v.toFixed(1), zeroLine=false, yUnit='', chartId='chart'}={}) {
  const PAD = {t:24, r:24, b:44, l:68};
  const cW = W-PAD.l-PAD.r, cH = H-PAD.t-PAD.b;

  const validSeries = series.filter(s=>s.pts&&s.pts.length>0);
  if (!validSeries.length) return `<div style="height:${H}px;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:13px">${T('noData')}</div>`;

  // Scroll-wheel zoom: state.chartZoom = {scale, center} where scale>=1, center in [0,1]
  const zoom = (state.chartZoom && state.chartZoom.scale > 1) ? state.chartZoom : {scale:1, center:0.5};

  const allPtsX = [...new Set(validSeries.flatMap(s=>s.pts.map(p=>p.x)))].sort((a,b)=>a-b);
  const xMin0 = allPtsX[0], xMax0 = allPtsX[allPtsX.length-1];
  const span0 = xMax0 - xMin0 || 1;

  // Apply zoom: visible window is span0/scale wide, centered on center
  const visSpan = span0 / zoom.scale;
  let xStart = xMin0 + span0 * zoom.center - visSpan/2;
  let xEnd   = xStart + visSpan;
  // Clamp
  if (xStart < xMin0) { xStart = xMin0; xEnd = xStart + visSpan; }
  if (xEnd   > xMax0) { xEnd = xMax0;   xStart = xEnd - visSpan; }

  const zoomedSeries = validSeries.map(s=>({...s, pts:s.pts.filter(p=>p.x>=xStart&&p.x<=xEnd)}));
  const allX = [...new Set(zoomedSeries.flatMap(s=>s.pts.map(p=>p.x)))].sort((a,b)=>a-b);
  if (!allX.length) return `<div style="height:${H}px;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:13px">${T('noData')}</div>`;

  const allY = zoomedSeries.flatMap(s=>s.pts.map(p=>p.y));
  let yMin = Math.min(...allY), yMax = Math.max(...allY);
  if (zeroLine) { yMin = Math.min(yMin,0); yMax = Math.max(yMax,0); }
  const yPad = (yMax-yMin)*0.08 || 1;
  yMin -= yPad; yMax += yPad;
  const yRange = yMax-yMin;
  const winSpan = (xEnd - xStart) || 1;          // visible date window width
  // Map x by the WINDOW (not by filtered extremes) so a given date keeps a stable
  // screen position while panning; points outside the window fall outside the plot
  // area and are hidden by the clip — this lets a live drag reveal real neighbour data.
  const sx = x => PAD.l + ((x-xStart)/winSpan)*cW;
  const sy = y => PAD.t + cH - ((y-yMin)/yRange)*cH;

  const yTicks = 5;
  const grid = Array.from({length:yTicks+1},(_,i)=>{
    const y = yMin + yRange*i/yTicks, yy = sy(y);
    return `<line x1="${PAD.l}" y1="${yy.toFixed(1)}" x2="${PAD.l+cW}" y2="${yy.toFixed(1)}" stroke="#1e293b" stroke-width="1"/>
<text x="${PAD.l-8}" y="${(yy+4).toFixed(1)}" text-anchor="end" fill="#64748b" font-size="10" font-family="monospace">${yFmt(y)}${yUnit}</text>`;
  }).join('');

  const zl = (zeroLine && yMin<0 && yMax>0)
    ? `<line x1="${PAD.l}" y1="${sy(0).toFixed(1)}" x2="${PAD.l+cW}" y2="${sy(0).toFixed(1)}" stroke="#475569" stroke-width="1" stroke-dasharray="4,3"/>`
    : '';

  const xStep = Math.max(1, Math.ceil(allX.length/7));
  const xLabels = allX.filter((_,i)=>i%xStep===0||i===allX.length-1).map(x=>
    `<text x="${sx(x).toFixed(1)}" y="${PAD.t+cH+18}" text-anchor="middle" fill="#64748b" font-size="9" font-family="monospace">${fmtD(x)}</text>`
  ).join('');

  const lines = validSeries.map(s=>{
    const sorted = [...s.pts].sort((a,b)=>a.x-b.x);
    if (sorted.length===1) {
      const p = sorted[0];
      return `<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="4" fill="${s.color}"><title>${s.label} · ${fmtD(p.x)}: ${yFmt(p.y)}${yUnit}</title></circle>`;
    }
    const d = sorted.map((p,i)=>`${i?'L':'M'}${sx(p.x).toFixed(1)},${sy(p.y).toFixed(1)}`).join(' ');
    const dots = sorted.map(p=>`<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.y).toFixed(1)}" r="3.5" fill="${s.color}" stroke="#0f172a" stroke-width="1.5"><title>${s.label} · ${fmtD(p.x)}: ${yFmt(p.y)}${yUnit}</title></circle>`).join('');
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}`;
  }).join('');

  const axes = `<line x1="${PAD.l}" y1="${PAD.t}" x2="${PAD.l}" y2="${PAD.t+cH}" stroke="#334155" stroke-width="1"/>
<line x1="${PAD.l}" y1="${PAD.t+cH}" x2="${PAD.l+cW}" y2="${PAD.t+cH}" stroke="#334155" stroke-width="1"/>`;

  // Navigation: scrollbar when zoomed, hint when not
  const scrollPos = zoom.scale > 1
    ? Math.max(0, Math.min(100, (zoom.center - 0.5 / zoom.scale) / (1 - 1/zoom.scale) * 100))
    : 50;

  const zoomHint = zoom.scale > 1
    ? `<div style="margin-top:6px">
        <div style="display:flex;align-items:center;gap:8px">
          <span style="font-size:10px;color:#475569;white-space:nowrap">${fmtD(xMin0)}</span>
          <input type="range" min="0" max="100" step="0.5" value="${scrollPos.toFixed(1)}"
            oninput="(function(v){
              const s=state.chartZoom.scale, frac=v/100;
              const newCenter=frac*(1-1/s)+0.5/s;
              state.chartZoom={scale:s,center:Math.max(0,Math.min(1,newCenter))};
              render();
            })(+this.value)"
            style="flex:1;accent-color:#60a5fa;cursor:pointer">
          <span style="font-size:10px;color:#475569;white-space:nowrap">${fmtD(xMax0)}</span>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:3px">
          <span style="font-size:10px;color:#64748b">Showing: ${fmtD(xStart)} – ${fmtD(xEnd > xMax0 ? xMax0 : xEnd)}</span>
          <button onclick="state.chartZoom={scale:1,center:.5};render()" style="font-size:10px;color:#60a5fa;background:none;border:none;cursor:pointer;padding:2px 6px">&#8635; Reset (${zoom.scale.toFixed(1)}&times;)</button>
        </div>
      </div>`
    : `<div style="font-size:10px;color:#475569;text-align:right;margin-top:4px">Scroll to zoom</div>`;

  const clipId = 'clip-' + chartId + '-' + Math.random().toString(36).slice(2,8);
  return `<div style="position:relative">
<svg id="${chartId}" data-xmin="${xMin0}" data-xmax="${xMax0}" data-span="${span0}" width="100%" viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="display:block;overflow:visible;cursor:${zoom.scale>1?'grab':'zoom-in'}" onwheel="handleChartZoom(event,${PAD.l},${cW})" onmousedown="handleChartMouseDown(event,${PAD.l},${cW})">
<defs><clipPath id="${clipId}"><rect x="${PAD.l}" y="${PAD.t-8}" width="${cW}" height="${cH+16}"/></clipPath></defs>
<rect width="${W}" height="${H}" fill="transparent"/>
${grid}${zl}${axes}${xLabels}<g clip-path="url(#${clipId})"><g class="panbody">${lines}</g></g>
</svg>
${zoomHint}
</div>`;
}

function renderCharts() {
  // initialise selection to all positions
  if (!state.chartSel) state.chartSel = new Set(positions.map(p=>p.id));

  const modes = [
    {id:'pct',  label:T('chartPct')},
    {id:'pl',   label:T('chartPL')},
    {id:'contrib', label:T('chartContrib')},
    {id:'pension', label:T('chartPension')},
  ];

  const ranges = ['YTD','1M','3M','6M','1Y','3Y','All'];
  const rangeCutoff = () => {
    const r = state.chartRange;
    if (!ranges.includes(r) || r === 'All') return 0;   // unknown ⇒ show everything
    const now = new Date();
    if (r==='YTD') { now.setMonth(0); now.setDate(1); now.setHours(0,0,0,0); return now.getTime(); }
    if (r==='1M') now.setMonth(now.getMonth()-1);
    else if (r==='3M') now.setMonth(now.getMonth()-3);
    else if (r==='6M') now.setMonth(now.getMonth()-6);
    else if (r==='1Y') now.setFullYear(now.getFullYear()-1);
    else if (r==='3Y') now.setFullYear(now.getFullYear()-3);
    return now.getTime();
  };
  const filterRange = pts => { const c=rangeCutoff(); return c ? pts.filter(p=>p.x>=c) : pts; };
  // For % charts: after filtering, re-normalise so the first visible point = 0%
  const rebase = pts => { if (!pts.length) return pts; const b=pts[0].y; return pts.map(p=>({...p,y:p.y-b})); };

  const modeBar = `<div style="display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap">
    ${modes.map(m=>`<button onclick="state.chartMode='${m.id}';state.chartZoom={scale:1,center:.5};render()" style="padding:6px 14px;border-radius:6px;border:none;font-size:12px;font-weight:600;cursor:pointer;background:${state.chartMode===m.id?'#1d4ed8':'#334155'};color:${state.chartMode===m.id?'#fff':'#94a3b8'}">${m.label}</button>`).join('')}
  </div>
  <div style="display:flex;gap:4px;margin-bottom:16px">
    ${ranges.map(r=>`<button onclick="state.chartRange='${r}';state.chartZoom={scale:1,center:.5};render()" style="padding:4px 10px;border-radius:5px;border:1px solid ${state.chartRange===r?'#60a5fa':'#334155'};font-size:11px;font-weight:600;cursor:pointer;background:${state.chartRange===r?'rgba(96,165,250,0.15)':'transparent'};color:${state.chartRange===r?'#60a5fa':'#64748b'}">${r}</button>`).join('')}
  </div>`;

  // ── Contributions timeline chart ──────────────────────────────────────────
  if (state.chartMode === 'contrib') {
    // Filter state — reuse chartSel for positions, add contribTag for tag filter
    if (!state.chartSel) state.chartSel = new Set(positions.map(p=>p.id));
    const allTags = [...new Set(positions.flatMap(p=>p.tags||[]))].sort();

    // Filter chips — tags and positions separated
    const posChips = `<div style="margin-bottom:12px">
      ${allTags.length ? `<div style="margin-bottom:8px">
        <div style="font-size:10px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">Filter by tag</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px">
          ${allTags.map((tg,i)=>{
            const tagIds = positions.filter(p=>(p.tags||[]).includes(tg)).map(p=>p.id);
            const allOn = tagIds.every(id=>state.chartSel.has(id));
            return `<button onclick="toggleContribTag('${jsq(tg)}')" style="padding:3px 10px;border-radius:4px;border:1px solid ${CHART_COLORS[i%10]};font-size:11px;font-weight:600;cursor:pointer;background:${allOn?CHART_COLORS[i%10]:'transparent'};color:${allOn?'#000':CHART_COLORS[i%10]}">${esc(tg)}</button>`;
          }).join('')}
        </div>
      </div>` : ''}
      <div>
        <div style="font-size:10px;font-weight:600;color:#475569;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px">Filter by position</div>
        <div style="display:flex;flex-wrap:wrap;gap:5px">
          <button onclick="state.chartSel=new Set(positions.map(p=>p.id));render()" style="padding:3px 10px;border-radius:4px;border:1px solid #475569;font-size:11px;font-weight:600;cursor:pointer;background:${state.chartSel.size===positions.length?'#475569':'transparent'};color:${state.chartSel.size===positions.length?'#fff':'#94a3b8'}">All</button>
          ${positions.map((p,i)=>{
            const on=state.chartSel.has(p.id);
            return `<button onclick="toggleChartSel('${p.id}')" style="padding:3px 10px;border-radius:4px;border:1px solid ${CHART_COLORS[i%10]};font-size:11px;font-weight:600;cursor:pointer;background:${on?CHART_COLORS[i%10]:'transparent'};color:${on?'#000':CHART_COLORS[i%10]}">${esc(p.name)}</button>`;
          }).join('')}
        </div>
      </div>
    </div>`;

    const selected = positions.filter(p=>state.chartSel.has(p.id));

    // Build all unique dates from selected positions only
    const cutoff = rangeCutoff();
    const allDates = [...new Set([
      ...selected.flatMap(p=>(p.priceHistory||[]).map(h=>parseD(h.d))),
      ...selected.flatMap(p=>p.txs.map(t=>parseD(t.d))),
    ])].sort((a,b)=>a-b).filter(x=>!cutoff||x>=cutoff);

    if (!allDates.length) return modeBar + posChips + `<div class="card"><p style="color:#64748b">${T('noData')}</p></div>`;

    // Cumulative invested at each date — selected only
    const investedPts = allDates.map(x=>{
      let total=0;
      selected.forEach(p=>{
        p.txs.forEach(t=>{
          const ts=parseD(t.d);
          if(ts<=x){
            if(t.a==='Buy'||t.a==='Traspaso In') total+=t.q*t.p+t.c;
            else if(t.a==='Sell'||t.a==='Traspaso Out') total-=p.avgFill*t.q;
          }
        });
      });
      return {x,y:Math.max(0,total)};
    });

    // Portfolio value at each date — selected only
    const valuePts = allDates.map(x=>{
      let total=0;
      selected.forEach(p=>{
        let qty=0;
        p.txs.forEach(t=>{
          if(parseD(t.d)<=x){
            if(t.a==='Buy'||t.a==='Traspaso In') qty+=t.q;
            else if(t.a==='Sell'||t.a==='Traspaso Out') qty-=t.q;
          }
        });
        qty = Math.max(0,qty);
        if(qty===0) return;
        const ph=(p.priceHistory||[]).map(h=>({x:parseD(h.d),p:h.p})).sort((a,b)=>a.x-b.x);
        const match=[...ph].reverse().find(h=>h.x<=x);
        const price = match ? match.p : p.avgFill;
        total += qty * price;
      });
      return {x,y:total};
    });

    const investedSeries={label:T('contribInvested'),color:'#60a5fa',pts:investedPts};
    const valueSeries={label:T('contribValue'),color:'#34d399',pts:valuePts};
    const legend=[investedSeries,valueSeries].map(s=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12px"><span style="display:inline-block;width:14px;height:3px;background:${s.color};border-radius:2px"></span><span style="color:#cbd5e1">${s.label}</span></span>`).join('');
    const subtitle = selected.length < positions.length ? `${selected.map(p=>p.name).join(', ')}` : 'All positions';

    return `${modeBar}
<div class="card">
  <div style="font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:4px">${T('chartContrib')}</div>
  <div style="font-size:11px;color:#64748b;margin-bottom:10px">Cumulative invested vs estimated portfolio value — ${subtitle}</div>
  ${posChips}
  <div style="margin-bottom:10px">${legend}</div>
  ${lineChart([investedSeries,valueSeries],{yFmt:v=>'€'+e2(v)})}
</div>`;
  }

  // ── Pension Pot chart ──────────────────────────────────────────────────────
  if (state.chartMode === 'pension') {
    const pen = OTHER[0];
    if (!pen.history || pen.history.length < 2) return modeBar + `<div class="card"><p style="color:#64748b">${T('noData')}</p></div>`;

    const seriesEUR = {label:T('pensionEUR'), color:'#3b82f6', pts: filterRange(pen.history.map(h=>({x:parseD(h.date), y:h.eur})))};
    const seriesGBP = {label:T('pensionGBP'), color:'#10b981', pts: filterRange(pen.history.map(h=>({x:parseD(h.date), y:h.gbp})))};
    const seriesPL  = {label:'P&L (€)', color:'#f59e0b', pts: filterRange(pen.history.map(h=>({x:parseD(h.date), y:h.eur - pen.investedEUR})))};

    const legend = (ss) => ss.map((s,i)=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px;font-size:12px"><span style="display:inline-block;width:14px;height:3px;background:${s.color};border-radius:2px"></span><span style="color:#cbd5e1">${s.label}</span></span>`).join('');

    return `${modeBar}
<div class="card">
  <div style="font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:4px">${T('pensionEUR')} & ${T('pensionGBP')}</div>
  <div style="margin-bottom:10px">${legend([seriesEUR,seriesGBP])}</div>
  ${lineChart([seriesEUR,seriesGBP],{yFmt:v=>`€/£${e2(v)}`})}
</div>
<div class="card" style="margin-top:14px">
  <div style="font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:4px">P&L vs Invested (€)</div>
  <div style="margin-bottom:10px">${legend([seriesPL])}</div>
  ${lineChart([seriesPL],{yFmt:v=>(v>=0?'+':'')+e2(v),yUnit:'€',zeroLine:true})}
</div>`;
  }

  // ── Position filter chips ─────────────────────────────────────────────────
  const selChips = `<div style="margin-bottom:14px">
    <div style="font-size:11px;color:#64748b;margin-bottom:6px">${T('chartSelectHint')}</div>
    <div style="display:flex;flex-wrap:wrap;gap:5px">
      <button onclick="state.chartSel=new Set(positions.map(p=>p.id));render()" style="padding:3px 10px;border-radius:4px;border:1px solid #475569;font-size:11px;font-weight:600;cursor:pointer;background:${state.chartSel.size===positions.length?'#475569':'transparent'};color:${state.chartSel.size===positions.length?'#fff':'#94a3b8'}">All</button>
      ${positions.map((p,i)=>{
        const on=state.chartSel.has(p.id);
        return `<button onclick="toggleChartSel('${p.id}')" style="padding:3px 10px;border-radius:4px;border:1px solid ${CHART_COLORS[i%10]};font-size:11px;font-weight:600;cursor:pointer;background:${on?CHART_COLORS[i%10]:'transparent'};color:${on?'#000':CHART_COLORS[i%10]}">${esc(p.name)}</button>`;
      }).join('')}
    </div>
  </div>`;

  const selected = positions.filter((p,i)=>state.chartSel.has(p.id));

  // ── Price % change chart ───────────────────────────────────────────────────
  if (state.chartMode === 'pct') {
    const series = selected.map((p,i)=>{
      const ph = (p.priceHistory||[]).filter(h=>h.p>0);
      if (!ph.length) return null;
      const sorted = [...ph].sort((a,b)=>parseD(a.d)-parseD(b.d));
      const base = sorted[0].p;
      const pts = filterRange(sorted.map(h=>({x:parseD(h.d), y:((h.p-base)/base)*100})));
      if (!pts.length) return null;
      return {
        label: p.name,
        color: CHART_COLORS[positions.indexOf(p)%10],
        pts: rebase(pts)
      };
    }).filter(Boolean);

    // Benchmark series — normalised, filtered and rebased
    let bmSeries = null;
    if (state.showBenchmark && benchmarkData.length >= 2) {
      const sorted = [...benchmarkData].sort((a,b)=>parseD(a.d)-parseD(b.d));
      const base = sorted[0].p;
      const pts = filterRange(sorted.map(h=>({x:parseD(h.d), y:((h.p-base)/base)*100})));
      if (pts.length >= 2) bmSeries = {
        label: T('benchmarkLine'),
        color: '#ffffff',
        pts: rebase(pts),
        dashed: true
      };
    }

    const allSeries = bmSeries ? [...series, bmSeries] : series;
    const legend = allSeries.map(s=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px;margin-bottom:4px;font-size:12px"><span style="display:inline-block;width:14px;height:2px;background:${s.color};border-radius:2px;${s.dashed?'border-top:2px dashed '+s.color+';background:none':''}"></span><span style="color:#cbd5e1">${s.label}</span></span>`).join('');

    // Benchmark management card
    const bmForm = `<div class="card" style="margin-top:14px">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <div style="font-size:13px;font-weight:600">${T('benchmark')} — <a href="https://finance.yahoo.com/quote/%5EGSPC/" target="_blank" style="color:#60a5fa;text-decoration:none">S&P 500 ↗</a></div>
    <button onclick="state.showBenchmark=!state.showBenchmark;render()" style="padding:4px 10px;border-radius:5px;border:none;font-size:11px;font-weight:600;cursor:pointer;background:${state.showBenchmark?'#064e3b':'#334155'};color:${state.showBenchmark?'#34d399':'#94a3b8'}">${state.showBenchmark?T('hideBenchmark'):T('showBenchmark')}</button>
  </div>
  <div style="font-size:11px;color:#64748b;margin-bottom:10px">${T('benchmarkHint')}</div>
  <div style="display:flex;gap:6px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
    <div style="width:150px">${dateInput('bm_d', state.benchmarkForm.d, 'state.benchmarkForm.d=this.value', 'font-size:11px!important;padding:3px 6px!important;width:100%!important')}</div>
    <input class="p-inp" style="width:110px!important" placeholder="${T('benchmarkValue')}" value="${state.benchmarkForm.p}" oninput="state.benchmarkForm.p=this.value" onkeydown="if(event.key==='Enter')addBenchmarkPoint()">
    <button class="btn btn-bl" style="padding:4px 12px;font-size:11px;white-space:nowrap" onclick="addBenchmarkPoint()">${T('addBenchmark')}</button>
  </div>
  ${benchmarkData.length ? `<div class="tbl-wrap"><table>
    <thead><tr><th>${T('date')}</th><th class="R">${T('benchmarkValue')}</th><th class="R">% vs prev</th><th></th></tr></thead>
    <tbody>${(()=>{
      const sorted = [...benchmarkData].sort((a,b)=>parseD(b.d)-parseD(a.d));
      return sorted.map((h,i)=>{
        const realIdx = benchmarkData.indexOf(h);
        const prev = sorted[i+1];
        const chg = prev ? (h.p-prev.p)/prev.p*100 : null;
        const isEd = state.editingBenchmark === realIdx;
        if(isEd) return `<tr style="background:#0f172a">
          <td>${dateInput('ebm_d',internalToHTML(benchmarkData[realIdx].d),'state.benchmarkEditForm={...state.benchmarkEditForm,d:htmlToInternal(this.value)}','width:130px!important;font-size:11px!important')}</td>
          <td class="R"><input class="p-inp" style="width:90px!important" value="${benchmarkData[realIdx].p}" oninput="state.benchmarkEditForm={...state.benchmarkEditForm,p:this.value}"></td>
          <td class="R d" style="font-size:11px">—</td>
          <td style="text-align:right;white-space:nowrap">
            <button class="ok-btn" onclick="saveBenchmarkEdit(${realIdx})">✓</button>
            <button class="x-btn" onclick="state.editingBenchmark=null;render()">✕</button>
          </td>
        </tr>`;
        return `<tr>
          <td class="d mn">${h.d}</td>
          <td class="R mn">${h.p.toLocaleString('it-IT')}</td>
          <td class="R mn ${chg===null?'':chg>=0?'g':'r'}">${chg===null?'—':(chg>=0?'+':'')+chg.toFixed(2)+'%'}</td>
          <td style="text-align:right;white-space:nowrap">
            <button onclick="state.editingBenchmark=${realIdx};state.benchmarkEditForm={d:'${h.d}',p:'${h.p}'};render()" style="background:none;border:none;color:#64748b;font-size:11px;padding:2px 4px;cursor:pointer" onmouseover="this.style.color='#60a5fa'" onmouseout="this.style.color='#64748b'">✎</button>
            <button onclick="deleteBenchmarkPoint(${realIdx})" style="background:none;border:none;color:#64748b;font-size:13px;cursor:pointer;padding:0 4px" onmouseover="this.style.color='#f87171'" onmouseout="this.style.color='#64748b'">✕</button>
          </td>
        </tr>`;
      }).join('');
    })()}</tbody>
  </table></div>` : `<div style="color:#64748b;font-size:12px">${T('benchmarkEmpty')}</div>`}
</div>`;

    return `${modeBar}${selChips}
<div class="card">
  <div style="font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:4px">${T('chartPct')}</div>
  <div style="font-size:11px;color:#64748b;margin-bottom:10px">Each line starts at 0% from its first recorded price${bmSeries?' · White dashed line = S&P 500 benchmark':''}</div>
  <div style="margin-bottom:10px;display:flex;flex-wrap:wrap">${legend}</div>
  ${lineChart(allSeries,{yFmt:v=>(v>=0?'+':'')+v.toFixed(1),yUnit:'%',zeroLine:true})}
</div>${bmForm}`;
  }

  // ── Unrealised P&L chart ───────────────────────────────────────────────────
  const series = selected.map((p,i)=>{
    const ph = (p.priceHistory||[]).filter(h=>h.p>0);
    if (!ph.length) return null;
    const sorted = [...ph].sort((a,b)=>parseD(a.d)-parseD(b.d));
    return {
      label: p.name,
      color: CHART_COLORS[positions.indexOf(p)%10],
      pts: filterRange(sorted.map(h=>({x:parseD(h.d), y:(h.p - p.avgFill)*p.qty})))
    };
  }).filter(Boolean);

  const legend = series.map(s=>`<span style="display:inline-flex;align-items:center;gap:5px;margin-right:12px;margin-bottom:4px;font-size:12px"><span style="display:inline-block;width:14px;height:3px;background:${s.color};border-radius:2px"></span><span style="color:#cbd5e1">${s.label}</span></span>`).join('');

  // Also compute a "combined P&L" series across all selected positions
  const allDates = [...new Set(selected.flatMap(p=>(p.priceHistory||[]).map(h=>parseD(h.d))))].sort((a,b)=>a-b).filter(x=>!rangeCutoff()||x>=rangeCutoff());
  const combinedPts = allDates.map(x=>{
    let total = 0;
    selected.forEach(p=>{
      const ph = (p.priceHistory||[]).map(h=>({x:parseD(h.d),p:h.p})).sort((a,b)=>a.x-b.x);
      // find most recent price at or before x
      const match = [...ph].reverse().find(h=>h.x<=x);
      if (match) total += (match.p - p.avgFill)*p.qty;
    });
    return {x, y:total};
  });
  const combinedSeries = selected.length>1 ? [{label:'Combined', color:'#ffffff', pts:combinedPts}] : [];

  return `${modeBar}${selChips}
<div class="card">
  <div style="font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:4px">${T('chartPL')}</div>
  <div style="font-size:11px;color:#64748b;margin-bottom:10px">Based on current qty × (historical price − avg cost)</div>
  <div style="margin-bottom:10px;display:flex;flex-wrap:wrap">${legend}</div>
  ${lineChart(series,{yFmt:v=>(v>=0?'+':'')+e2(v),yUnit:'€',zeroLine:true})}
</div>
${combinedSeries.length ? `<div class="card" style="margin-top:14px">
  <div style="font-size:13px;font-weight:600;color:#94a3b8;margin-bottom:4px">Combined P&L — selected positions</div>
  <div style="margin-bottom:10px"><span style="display:inline-flex;align-items:center;gap:5px;font-size:12px"><span style="display:inline-block;width:14px;height:3px;background:#fff;border-radius:2px"></span><span style="color:#cbd5e1">Combined</span></span></div>
  ${lineChart(combinedSeries,{yFmt:v=>(v>=0?'+':'')+e2(v),yUnit:'€',zeroLine:true})}
</div>` : ''}`;
}

function toggleChartSel(id) {
  if (state.chartSel.has(id)) { if (state.chartSel.size>1) state.chartSel.delete(id); }
  else state.chartSel.add(id);
  render();
}

function toggleContribTag(tag) {
  const tagIds = positions.filter(p=>(p.tags||[]).includes(tag)).map(p=>p.id);
  const allOn = tagIds.every(id=>state.chartSel.has(id));
  tagIds.forEach(id => allOn ? (state.chartSel.size>1 && state.chartSel.delete(id)) : state.chartSel.add(id));
  render();
}

render();
if (syncConfigured()) setTimeout(() => syncNow({}), 50);
if (loadError) { const n=document.getElementById('notif'); if(n){ n.textContent=T('loadErrorNotif'); n.classList.add('show'); setTimeout(()=>n.classList.remove('show'),8000); } }
</script>
</body>
</html>
